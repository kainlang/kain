[package]
name = "kain-run"
version = "0.1.0"
edition = "2021"
description = "KAIN run planning, execution, watch, and telemetry"
license = "MIT"

[dependencies]
blade = { path = "../kain-blades" }
kain-core = { path = "../kain-core" }
kain-c-ffi = { path = "../kain-c-ffi" }
kain-driver = { path = "../kain-driver" }
kain-fs = { path = "../kain-fs" }
kain-host = { path = "../kain-host", default-features = false }
kain-omni = { path = "../kain-omni", default-features = false }
kain-process = { path = "../kain-process" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3.8"
