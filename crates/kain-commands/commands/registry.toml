[pack]
id = "registry"
title = "Command Registry Commands"
owner = "crates/kain-commands"
about = "Command registry inspection, export, pack listing, and dynamic help generation."

[[commands]]
id = "commands.list"
bins = ["kain", "kn"]
path = ["commands", "list"]
about = "List command registry entries"
handler = "builtin:commands-list"
tags = ["registry", "diagnostics"]

[[commands]]
id = "commands.export"
bins = ["kain", "kn"]
path = ["commands", "export"]
about = "Export command registry entries"
handler = "builtin:commands-export"
tags = ["registry", "automation"]

[[commands]]
id = "commands.packs"
bins = ["kain", "kn"]
path = ["commands", "packs"]
about = "List command manifest packs"
handler = "builtin:commands-packs"
tags = ["registry", "diagnostics"]

[[commands]]
id = "commands.help"
bins = ["kain", "kn"]
path = ["commands", "help"]
about = "Render dynamic help from the command registry"
handler = "builtin:commands-help"
tags = ["registry", "help"]
