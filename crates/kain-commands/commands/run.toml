[pack]
id = "run"
title = "Run Commands"
owner = "crates/kain-run"
about = "Unified execute, dev, planning, and watch entrypoints."

[[commands]]
id = "run"
bins = ["kain", "kn"]
path = ["run"]
about = "Execute a Kain entrypoint"
handler = "builtin:run"
tags = ["execute"]

[[commands]]
id = "run.dev"
bins = ["kain", "kn"]
path = ["run", "dev"]
about = "Run the dev orchestrator for the current project"
handler = "builtin:run-dev"
tags = ["execute", "dev"]

[[commands]]
id = "run.plan"
bins = ["kain", "kn"]
path = ["run", "plan"]
about = "Print the resolved run plan"
handler = "builtin:run-plan"
tags = ["execute", "diagnostics"]

[[commands]]
id = "watch"
bins = ["kain", "kn"]
path = ["watch"]
about = "Watch source inputs and rerun the selected Kain action"
handler = "builtin:watch"
tags = ["execute", "dev"]
