[[commands]]
id = "init"
bins = ["kain", "kn"]
path = ["init"]
about = "Initialize a new Kain project"
handler = "builtin:init"

[[commands]]
id = "lsp"
bins = ["kain", "kn"]
path = ["lsp"]
about = "Start the Kain language server"
handler = "builtin:lsp"

[[commands]]
id = "doctor"
bins = ["kain", "kn"]
path = ["doctor"]
about = "Show binary diagnostics and optional repair workflows"
handler = "builtin:doctor"

[[commands]]
id = "format"
bins = ["kain", "kn"]
path = ["format"]
alias_paths = [["fmt"]]
about = "Format Kain source using the compiler-owned printer"
handler = "builtin:format"

[[commands]]
id = "check"
bins = ["kain", "kn"]
path = ["check"]
about = "Check Kain source without emitting backend artifacts"
handler = "builtin:check"

[[commands]]
id = "test"
bins = ["kain", "kn"]
path = ["test"]
about = "Run Kain source tests"
handler = "builtin:test"

