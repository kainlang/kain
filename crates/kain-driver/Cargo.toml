[package]
name = "kain-driver"
version = "0.1.0"
edition = "2021"
description = "Embeddable Rust-native compiler driver for KAIN"
license = "MIT"

[dependencies]
kain-core = { path = "../kain-core" }
kain-python = { path = "../kain-python" }
kain-ui = { path = "../kain-ui" }
serde = { workspace = true }
serde_json = { workspace = true }
ue5 = { path = "../ue5", optional = true }
ue5-editor = { path = "../ue5-editor", optional = true }
ue5-shaders = { path = "../ue5-shaders", optional = true }
gpu = { path = "../gpu", optional = true }
web = { path = "../web", optional = true }
kain-sys-codegen = { path = "../kain-sys-codegen", optional = true }

[features]
default = ["ue5", "gpu", "web", "sys"]
ue5 = ["dep:ue5", "dep:ue5-editor", "dep:ue5-shaders"]
gpu = ["dep:gpu"]
web = ["dep:web"]
sys = ["dep:kain-sys-codegen"]

[dev-dependencies]
tempfile = "3.8"
