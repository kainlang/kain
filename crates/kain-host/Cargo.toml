[package]
name = "kain-host"
version = "0.1.0"
edition = "2021"
description = "Native Rust host runtime for calling KAIN and exposing Rust functions to KAIN"
license = "MIT"

[features]
default = ["derive"]
derive = ["dep:kain-host-derive"]

[dependencies]
blade = { path = "../kain-blades" }
kain-c-ffi = { path = "../kain-c-ffi" }
kain-codebase = { path = "../kain-codebase" }
kain-crate-ffi = { path = "../kain-crate-ffi" }
kain-core = { path = "../kain-core" }
kain-driver = { path = "../kain-driver", default-features = false }
kain-fs = { path = "../kain-fs" }
kain-interop = { path = "../kain-interop" }
kain-node = { path = "../kain-node" }
kain-python = { path = "../kain-python" }
kain-host-derive = { path = "../kain-host-derive", optional = true }
kain-omni = { path = "../kain-omni", default-features = false }
kain-gpu-runtime = { path = "../kain-gpu-runtime" }
kain-reflect = { path = "../kain-reflect" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3.8"
