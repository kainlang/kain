[package]
name = "kain-host"
version = "0.1.0"
edition = "2021"
description = "Native Rust host runtime for calling KAIN and exposing Rust functions to KAIN"
license = "MIT"

[features]
default = ["derive"]
derive = ["dep:kain-host-derive"]

[dependencies]
kain-core = { path = "../kain-core" }
kain-driver = { path = "../kain-driver", default-features = false }
kain-host-derive = { path = "../kain-host-derive", optional = true }
kain-reflect = { path = "../kain-reflect" }

[dev-dependencies]
tempfile = "3.8"
