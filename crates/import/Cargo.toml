[package]
name = "kain-import"
version = "0.1.0"
edition = "2021"
authors = ["KAIN Contributors"]
description = "Universal import system for KAIN - import C, Rust, and other languages into KAIN IR"
license = "MIT"

[dependencies]
# Core KAIN dependencies
kain-core = { path = "../core" }
kain-fs = { path = "../fs" }

# C parsing
lang-c = { version = "0.15", optional = true }

# Rust parsing (syn — the standard Rust AST library, used by all proc-macros)
syn         = { version = "2.0", features = ["full", "extra-traits", "parsing", "printing"], optional = true }
proc-macro2 = { version = "1.0", optional = true }

# TypeScript/JavaScript parsing (SWC — used by Deno, Next.js, Vercel, Parcel)
# Using latest versions which should be compatible with modern serde
swc_ecma_parser = { version = "0.150", optional = true }
swc_ecma_ast    = { version = "0.119", optional = true }
swc_common      = { version = "0.38", optional = true }

# Utilities
thiserror = "1.0"
# Keep serde aligned with the Kain workspace so downstream hosts can resolve
# modern UI/runtime crates against the same serialization stack.
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"

# GPU shader parsing
tree-sitter = { version = "0.24", optional = true }
tree-sitter-hlsl = { version = "0.2", optional = true }

[dev-dependencies]
pretty_assertions = "1.4"

[features]
default = ["c", "rust", "typescript", "usf"]
c    = ["dep:lang-c"]
rust = ["dep:syn", "dep:proc-macro2"]
typescript = ["dep:swc_ecma_parser", "dep:swc_ecma_ast", "dep:swc_common"]
usf  = ["dep:tree-sitter", "dep:tree-sitter-hlsl"]
cpp  = []        # Future: tree-sitter-cpp
python = []      # Future: rustpython-parser
