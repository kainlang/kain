[package]
name = "kain-error"
version = "0.2.0"
edition = "2021"
description = "Data-driven diagnostic engine for the Kain compiler — TOML-powered, JSON-native, unstoppable."

[features]
default = ["toml-registry"]
toml-registry = []
# Future: i18n bundles, telemetry export, LSP integration

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.1"
once_cell = "1"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"


