version: 1
id: kain.core.proofs.keywords_teleport_origin_cannot_remain_live
kind: check_smt2
description: >
  Teleport is a destructive ownership handoff: after the transition the destination
  owns the value and the origin world cannot also remain live.
tags:
- teleport
- ownership
- world
- handoff
source:
  path: D:\Kain-Lang\crates\kain-core\src\types.rs
  symbol: ensure_teleport_world_reference
  start_line: 5812
  reason: teleport typechecking validates both worlds and then marks simple origin
    identifiers as moved so later reads are rejected.
case:
  smt2: |
    (set-logic ALL)
    (declare-datatypes () ((TeleportWorld Origin Destination)))
    (declare-const owner_before TeleportWorld)
    (assert (= owner_before Origin))
    (define-fun owner_after () TeleportWorld Destination)
    (define-fun origin_live_after () Bool (= owner_after Origin))
    (define-fun destination_live_after () Bool (= owner_after Destination))
    (assert (or origin_live_after (not destination_live_after) (and origin_live_after destination_live_after)))
    (check-sat)
  include_model: false
  include_stats: false
