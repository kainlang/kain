version: 1
id: kain.core.proofs.keywords_patch_cancel_rewinds_only_when_reversible
kind: check_smt2
description: cancel_active_patch only rewinds recorded changes when the active patch
  frame is reversible; best-effort frames skip the reverse replay path.
tags:
- patch
- runtime
- undo
- replay
- invariant
source:
  path: D:\Kain-Lang\crates\kain-core\src\runtime.rs
  symbol: cancel_active_patch
  start_line: 3713
  reason: the reverse replay loop is guarded by frame.undo_mode == "reversible" and
    otherwise does no rewind
case:
  smt2: '(set-logic ALL)

    (declare-const reversible Bool)

    (declare-const changes Int)

    (define-fun reverted () Int (ite reversible changes 0))

    (assert (>= changes 0))

    (assert (and (not reversible) (> reverted 0)))

    (check-sat)'
  include_model: false
  include_stats: false
