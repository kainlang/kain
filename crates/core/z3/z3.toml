[pack]
name = "kain.core.proofs"
scope = ".."
languages = ["rust"]

[solver]
timeout_ms = 5000
size_bits = 64

[sources]
include = ["**/*"]
exclude = ["z3/**", "target/**", "node_modules/**"]

[templates]
use = ["builtin:*", "local:templates/*.yaml"]

[fixtures]
use = ["fixtures/**/*.*"]

[ci]
smoke = ["proofs/**/*.yaml"]
full = ["proofs/**/*.*"]
memory = ["proofs/memory-*.yaml"]
diagnostics = ["proofs/diagnostics-*.yaml"]
literals = ["proofs/literal-*.yaml"]
parser = ["proofs/parser-*.yaml"]
keywords = ["proofs/keywords-*.yaml"]

[reports]
path = "reports"
keep_history = true

[engines]

[engines.libclang]
compile_flags = []
include_paths = []
