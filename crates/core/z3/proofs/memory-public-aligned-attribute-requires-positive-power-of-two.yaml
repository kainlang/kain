version: 1
id: kain.core.proofs.memory_public_aligned_attribute_requires_positive_power_of_two
kind: check_smt2
description: The public `@aligned(N)` attribute accepts only positive one-hot byte alignments.
tags:
- memory
- layout
- attributes
- alignment
- parser
- typechecker
source:
  path: D:\Kain-Lang\crates\core\src\types.rs
  symbol: validate_alignment_value
  start_line: 505
  reason: authored aligned structs must reject zero and non-power-of-two byte alignments before layout lowering.
case:
  smt2: |
    (set-logic QF_BV)
    (declare-const alignment (_ BitVec 64))
    (assert (bvsgt alignment #x0000000000000000))
    (assert (= (bvand alignment (bvsub alignment #x0000000000000001)) #x0000000000000000))
    (assert (not (= alignment (bvand alignment (bvneg alignment)))))
    (check-sat)
  include_model: false
  include_stats: false
