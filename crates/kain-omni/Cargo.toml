[package]
name = "kain-omni"
version = "0.1.0"
edition = "2021"
authors = ["KAIN Contributors"]
description = "Import-aware multi-language orchestration for KAIN"
license = "MIT"

[features]
default = ["typescript-import"]
typescript-import = ["kain-import/typescript"]

[dependencies]
blade = { path = "../kain-blades" }
kain-core = { path = "../kain-core" }
kain-driver = { path = "../kain-driver", default-features = false, features = ["ue5", "gpu", "web", "sys"] }
kain-fs = { path = "../kain-fs" }
kain-import = { path = "../kain-import", default-features = false, features = ["c", "rust", "usf"] }
kain-asm = { path = "../kain-asm" }
ue5 = { path = "../ue5" }
ue5-editor = { path = "../ue5-editor" }
ue5-shaders = { path = "../ue5-shaders" }
gpu = { path = "../gpu" }
kain-sys-codegen = { path = "../kain-sys-codegen" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = "3.8"
