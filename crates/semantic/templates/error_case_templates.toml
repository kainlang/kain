[shapes.type_inexhaustive_match]
family = "type"
file_stem = "type_inexhaustive_match"
description = "Match expression that does not cover all enum variants."
expected_mode = "GenericUnknown"
expected_repair = "add_missing_arm"
repair_required = false
allowed_codes = ["KAIN-TYPE-0001"]
donor_hint = "benchmark/cases_v2/keyword_expansion.kn"
body = """
enum {enum_name}{index}:
    VariantA
    VariantB
    VariantC

fn {fn_name}_probe_{index}(v: {enum_name}{index}) -> Int:
    match v:
        VariantA => return 1
        VariantB => return 2
    return 0

fn main() -> Int:
    return {fn_name}_probe_{index}({enum_name}{index}::VariantC)
"""
[shapes.type_inexhaustive_match.knobs]
enum_name = "TriState"
fn_name = "match_check"

