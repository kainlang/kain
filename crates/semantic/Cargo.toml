[package]
name = "kain-semantic"
version = "0.1.0"
edition = "2021"
description = "Reusable semantic coprocessor and corpus intelligence for the Kain ecosystem."
build = "build.rs"

[features]
default = ["corpus-bake"]
corpus-bake = []

[dependencies]
kain-error = { path = "../error" }
strsim = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
regex = "1"
