[package]
name = "kain-crate-ffi"
version = "0.1.0"
edition = "2021"
description = "Live + generated Rust crate FFI bindings for KAIN"
license = "MIT"

[dependencies]
blade = { path = "../kain-blades" }
kain-core = { path = "../kain-core" }
kain-fs = { path = "../kain-fs" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }
once_cell = { workspace = true }
heck = { workspace = true }
libloading = "0.8"
regex = "1.11"
sha2 = "0.10"
syn = { version = "2.0", features = ["full", "extra-traits"] }

[dev-dependencies]
tempfile = "3.8"
