version: 1
id: kain.gpu.proofs.ptx_runtime_param_order_matches_codegen_binding_order
kind: check_smt2
description: PTX runtime launch parameter order matches codegen parameter order when runtime binding slots are unique and both sides sort by binding.
tags:
- gpu
- ptx
- cuda
- abi
- binding-order
source:
  path: D:\Kain-Lang\crates\gpu\src\codegen_ptx.rs
  symbol: emit_uniform_params
  reason: codegen sorts runtime uniforms by binding; the PTX runtime sorts dispatch bindings by binding_slot before passing kernel params.
case:
  smt2: "(set-logic QF_LIA)\n(declare-const binding_a Int)\n(declare-const binding_b Int)\n(assert (>= binding_a 0))\n(assert (>= binding_b 0))\n(assert (not (= binding_a binding_b)))\n(define-fun codegen_first () Int (ite (< binding_a binding_b) binding_a binding_b))\n(define-fun runtime_first () Int (ite (< binding_a binding_b) binding_a binding_b))\n(define-fun codegen_second () Int (ite (< binding_a binding_b) binding_b binding_a))\n(define-fun runtime_second () Int (ite (< binding_a binding_b) binding_b binding_a))\n(assert (or (not (= codegen_first runtime_first)) (not (= codegen_second runtime_second))))\n(check-sat)"
  include_model: false
  include_stats: false
