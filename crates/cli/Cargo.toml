[package]
name = "cli"
version = "0.1.0"
edition = "2021"
default-run = "kain"
autobins = false

[[bin]]
name = "kain"
path = "src/main.rs"

[[bin]]
name = "blade"
path = "src/bin/blade.rs"

[dependencies]
kain-core = { path = "../core" }
kain-lattice = { path = "../lattice" }
blade = { path = "../blades" }
kain-amalgamate = { path = "../amalgamate" }
kain-build = { path = "../build" }
kain-check = { path = "../check" }
kain-clean = { path = "../clean" }
kain-error = { path = "../error" }
kain-test = { path = "../test" }
kain-driver = { path = "../driver", default-features = false }
kain-fmt = { path = "../fmt" }
kain-c-ffi = { path = "../c-ffi" }
kain-codebase = { path = "../codebase" }
kain-commands = { path = "../commands" }
kain-crate-ffi = { path = "../crate-ffi" }
kain-service-bridge = { path = "../service-bridge" }
kain-asm = { path = "../asm" }
kain-host = { path = "../host" }
kain-import = { path = "../import", default-features = false, features = ["c", "rust", "usf"] }
kain-omni = { path = "../omni", default-features = false }
kain-repair = { path = "../repair" }
kain-run = { path = "../run" }
kain-repl = { path = "../repl" }
kain-stdlib-map = { path = "../stdlib-map" }
ue5 = { path = "../ue5", optional = true }
ue5-editor = { path = "../ue5-editor", optional = true }
ue5-shaders = { path = "../ue5-shaders", optional = true }
ue5-materials = { path = "../ue5-materials", optional = true }
ue5-blueprints = { path = "../ue5-blueprints", optional = true }
ue5-graphs = { path = "../ue5-graphs", optional = true }
ue5-gas = { path = "../ue5-gas", optional = true }
ue5-asset-utils = { path = "../ue5-asset-utils", optional = true }
ue5-config = { path = "../ue5-config", optional = true }
unreal_asset_registry = { workspace = true, optional = true }
unreal_asset_base = { workspace = true, optional = true }
unreal_asset = { workspace = true, optional = true }
gpu = { path = "../gpu", optional = true }
kain-web = { path = "../web", optional = true }
kain-sys-codegen = { path = "../sys-codegen", optional = true }
kain-target = { path = "../target-triple" }

clap = { workspace = true }
notify = { workspace = true }
ctrlc = { workspace = true }
tokio = { workspace = true }
flume = { workspace = true }

# Missing dependencies added
serde = { workspace = true }
serde_json = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
minijinja = { workspace = true }
heck = { workspace = true }
toml = { workspace = true }
rayon = { workspace = true }
prettyplease = "0.2"
syn = { version = "2", features = ["full"] }

# C++ validation dependencies
which = "6.0"
quick-xml = "0.36"

[features]
default = ["ue5", "gpu", "web", "sys"]
ue5 = ["dep:ue5", "dep:ue5-editor", "dep:ue5-shaders", "dep:ue5-materials", "dep:ue5-blueprints", "dep:ue5-graphs", "dep:ue5-gas", "dep:ue5-asset-utils", "dep:ue5-config", "dep:unreal_asset_registry", "dep:unreal_asset_base", "dep:unreal_asset", "kain-driver/ue5"]
gpu = ["dep:gpu", "kain-driver/gpu"]
web = ["dep:kain-web", "kain-driver/web"]
sys = ["dep:kain-sys-codegen", "kain-driver/sys"]
tauri = ["kain-driver/tauri", "kain-build/tauri"]
typescript-import = ["kain-import/typescript", "kain-omni/typescript-import"]
semantic-cuda-forged-pack = ["kain-core/semantic-cuda-forged-pack"]

[dev-dependencies]
tempfile = "3.8"