[package]
name = "cli"
version = "0.1.0"
edition = "2021"
default-run = "kain"

[[bin]]
name = "kain"
path = "src/main.rs"

[[bin]]
name = "kn"
path = "src/bin/kn.rs"

[dependencies]
kain-core = { path = "../kain-core" }
kain-driver = { path = "../kain-driver", default-features = false }
kain-crate-ffi = { path = "../kain-crate-ffi" }
kain-asm = { path = "../kain-asm" }
kain-host = { path = "../kain-host" }
kain-import = { path = "../kain-import" }
kain-omni = { path = "../kain-omni" }
kain-repair = { path = "../kain-repair" }
ue5 = { path = "../ue5", optional = true }
ue5-editor = { path = "../ue5-editor", optional = true }
ue5-shaders = { path = "../ue5-shaders", optional = true }
ue5-materials = { path = "../ue5-materials", optional = true }
ue5-blueprints = { path = "../ue5-blueprints", optional = true }
ue5-graphs = { path = "../ue5-graphs", optional = true }
ue5-gas = { path = "../ue5-gas", optional = true }
ue5-asset-utils = { path = "../ue5-asset-utils", optional = true }
ue5-config = { path = "../ue5-config", optional = true }
unreal_asset_registry = { workspace = true, optional = true }
unreal_asset_base = { workspace = true, optional = true }
unreal_asset = { workspace = true, optional = true }
gpu = { path = "../gpu", optional = true }
web = { path = "../web", optional = true }
kain-sys-codegen = { path = "../kain-sys-codegen", optional = true }

clap = { workspace = true }
tower-lsp = { workspace = true }
notify = { workspace = true }
ctrlc = { workspace = true }
tokio = { workspace = true }
flume = { workspace = true }

# Missing dependencies added
serde = { workspace = true }
serde_json = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
minijinja = { workspace = true }
heck = { workspace = true }
toml = { workspace = true }

# C++ validation dependencies
which = "6.0"
quick-xml = "0.36"

[features]
default = ["ue5", "gpu", "web", "sys"]
ue5 = ["dep:ue5", "dep:ue5-editor", "dep:ue5-shaders", "dep:ue5-materials", "dep:ue5-blueprints", "dep:ue5-graphs", "dep:ue5-gas", "dep:ue5-asset-utils", "dep:ue5-config", "dep:unreal_asset_registry", "dep:unreal_asset_base", "dep:unreal_asset", "kain-driver/ue5"]
gpu = ["dep:gpu", "kain-driver/gpu"]
web = ["dep:web", "kain-driver/web"]
sys = ["dep:kain-sys-codegen", "kain-driver/sys"]

[dev-dependencies]
tempfile = "3.8"
