[package]
name = "kain-repl"
version = "0.1.0"
edition = "2021"
description = "Modular interactive REPL runtime for the KAIN toolchain"
license = "MIT"

[dependencies]
arboard = "3"
kain-lattice = { path = "../lattice" }
kain-core = { path = "../core" }
kain-driver = { path = "../driver", default-features = false }
kain-run = { path = "../run" }
logos = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
unicode-width = { workspace = true }
serde_json = { workspace = true }
