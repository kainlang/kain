version: 1
id: kain.ownership.proofs.ownership_state_decayed_is_terminal
kind: check_smt2
description: Once a region is decayed, all ownership transitions that would make it live again are rejected.
tags:
- ownership
- state
- terminal
- decay
source:
  path: D:\Kain-Lang\crates\kain-ownership\src\lib.rs
  symbol: OwnershipState::is_terminal
  start_line: 102
  reason: Decayed is the only terminal state, and begin_observe, begin_collapse, and decay all reject it
case:
  smt2: |
    (set-logic ALL)
    (declare-const decayed Bool)
    (define-fun can_begin_observe () Bool (not decayed))
    (define-fun can_begin_collapse () Bool (not decayed))
    (define-fun can_decay_again () Bool (not decayed))
    (assert decayed)
    (assert (or can_begin_observe can_begin_collapse can_decay_again))
    (check-sat)
  include_model: false
  include_stats: false
