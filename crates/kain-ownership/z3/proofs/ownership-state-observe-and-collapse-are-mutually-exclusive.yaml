version: 1
id: kain.ownership.proofs.ownership_state_observe_and_collapse_are_mutually_exclusive
kind: check_smt2
description: OwnershipState only allows collapse from Idle, so an active observe count and an active collapse token cannot coexist.
tags:
- ownership
- state
- observe
- collapse
- exclusivity
source:
  path: D:\Kain-Lang\crates\kain-ownership\src\lib.rs
  symbol: OwnershipState::begin_collapse
  start_line: 137
  reason: begin_collapse returns Collapsed only from Idle and rejects Observed(readers)
case:
  smt2: |
    (set-logic ALL)
    (declare-const observers Int)
    (declare-const collapsed Bool)
    (assert (>= observers 0))
    (define-fun can_collapse () Bool (and (= observers 0) (not collapsed)))
    (assert can_collapse)
    (assert (> observers 0))
    (check-sat)
  include_model: false
  include_stats: false
