version: 1
id: kain.ownership.proofs.ownership_state_decay_requires_zero_live_capabilities
kind: check_smt2
description: OwnershipState only allows decay from Idle, which implies no observers and no active collapse token.
tags:
- ownership
- state
- decay
- lifetime
source:
  path: D:\Kain-Lang\crates\ownership\src\lib.rs
  symbol: OwnershipState::decay
  start_line: 157
  reason: decay returns Decayed only from Idle and rejects Observed(readers), Collapsed, and Decayed
case:
  smt2: |
    (set-logic ALL)
    (declare-const observers Int)
    (declare-const collapsed Bool)
    (declare-const decayed Bool)
    (assert (>= observers 0))
    (define-fun can_decay () Bool (and (= observers 0) (not collapsed) (not decayed)))
    (assert can_decay)
    (assert (or (> observers 0) collapsed decayed))
    (check-sat)
  include_model: false
  include_stats: false
