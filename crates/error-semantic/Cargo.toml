[package]
name = "kain-error-semantic"
version = "0.1.0"
edition = "2021"
description = "Semantic diagnostic coprocessor — corpus-baked, data-driven error intelligence for the Kain compiler."
build = "build.rs"

[features]
default = ["corpus-bake"]
corpus-bake = []

[dependencies]
kain-error = { path = "../error" }
strsim = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
regex = "1"
