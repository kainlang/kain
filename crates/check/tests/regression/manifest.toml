# Error regression test manifest (ETA-C).
#
# Each case maps a minimal .kn file to the error code/message that
# `kain check` is expected to surface. The harness in
# tests/regression_test.rs iterates this file and verifies behavior.
#
# Conventions:
#   - file          — relative path to the .kn fixture (under tests/regression/)
#   - expected_error_code — short code (Rust style, Kain style, or descriptive)
#   - expected_message_contains — fuzzy substring match against the rendered
#                                 error message
#   - should_fail   — true if check should error out (default: true)
#   - known_bug     — true if the check currently passes but should fail;
#                     the test records the regression but does not fail
#   - known_bug_reason — why the bug is currently latent
#
# The harness is intentionally lenient: a case that should_fail but
# currently passes is recorded as a known_bug rather than a hard fail.
# This lets us ship the test surface now and tighten it as validators
# land across ETA-A, BRAVO, and CHARLIE.

