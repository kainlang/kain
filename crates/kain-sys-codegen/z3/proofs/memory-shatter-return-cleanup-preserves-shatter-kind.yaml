version: 1
id: kain.sys.codegen.llvm.proofs.memory_shatter_return_cleanup_preserves_shatter_kind
kind: check_smt2
description: Return-path cleanup for a shattered array local must not remove the
  compile-time shatter metadata while codegen is still emitting sibling return
  branches. Otherwise the first branch frees the shatter handle correctly and a
  later branch misclassifies the same handle as a generic RC pointer.
tags:
- llvm
- memory
- shatter
- cleanup
source:
  path: D:\Kain-Lang\crates\kain-sys-codegen\src\codegen_llvm\mod.rs
  symbol: emit_all_scopes_cleanup
  start_line: 7117
  reason: emit_all_scopes_cleanup emits kain_machine_shatter_free for return
    paths but preserves shattered_array_locals so sibling return paths emit the
    same cleanup kind.
case:
  smt2: "(set-logic QF_LIA)\n(declare-const metadata_before_first_return Int)\n(declare-const all_cleanup_removes_metadata Int)\n(assert (= metadata_before_first_return 1))\n(assert (= all_cleanup_removes_metadata 0))\n(define-fun metadata_before_second_return () Int\n  (ite (= all_cleanup_removes_metadata 1) 0 metadata_before_first_return))\n(define-fun second_return_uses_shatter_free () Int metadata_before_second_return)\n(assert (not (= second_return_uses_shatter_free 1)))\n(check-sat)"
  include_model: false
  include_stats: false
