version: 1
id: kain.sys.codegen.llvm.proofs.memory_atomic_compare_exchange_validation_rejects_invalid_failure_orderings
kind: check_smt2
description: The LLVM compare_exchange lowering now rejects failure orderings
  that are release/acq_rel or stronger than the chosen success ordering.
tags:
- llvm
- memory
- atomic
- compare-exchange
- validation
source:
  path: D:\Kain-Lang\crates\kain-sys-codegen\src\codegen_llvm\mod.rs
  symbol: validate_atomic_compare_exchange_failure_ordering
  start_line: 7097
  reason: the lowering rejects invalid failure-order shapes before cmpxchg is
    emitted, so no accepted pair can violate LLVM or C11 compare_exchange
    ordering rules
case:
  smt2: '(set-logic QF_LIA)

    (declare-const success Int)
    (declare-const failure Int)

    (define-fun RELAXED () Int 0)
    (define-fun ACQUIRE () Int 1)
    (define-fun RELEASE () Int 2)
    (define-fun ACQ_REL () Int 3)
    (define-fun SEQ_CST () Int 4)

    (assert (>= success 0))
    (assert (<= success 4))
    (assert (>= failure 0))
    (assert (<= failure 4))

    (define-fun strength ((code Int)) Int
      (ite (= code RELAXED) 0
      (ite (= code ACQUIRE) 2
      (ite (= code RELEASE) 3
      (ite (= code ACQ_REL) 4 5)))))

    (define-fun accepted_failure ((succ Int) (fail Int)) Bool
      (and (not (= fail RELEASE))
           (not (= fail ACQ_REL))
           (<= (strength fail) (strength succ))))

    (assert (accepted_failure success failure))
    (assert
      (or
        (= failure RELEASE)
        (= failure ACQ_REL)
        (> (strength failure) (strength success))))

    (check-sat)'
  include_model: false
  include_stats: false
