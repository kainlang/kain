version: 1
id: kain.sys.codegen.llvm.proofs.memory_teleport_pointer_bitcast_roundtrip_preserves_address
kind: check_smt2
description: >
  LLVM teleport lowering bitcasts typed pointers to i8* for the native handoff
  ABI and bitcasts the returned pointer back to the original typed pointer; the
  modeled address bits are unchanged by that roundtrip.
tags:
- llvm
- memory
- teleport
- machine
source:
  path: D:\Kain-Lang\crates\kain-sys-codegen\src\codegen_llvm\mod.rs
  symbol: compile_teleport_expr
  reason: pointer teleport must be a zero-copy address-preserving ABI handoff
case:
  smt2: |
    (set-logic QF_BV)
    (declare-const typed_ptr (_ BitVec 64))
    (define-fun as_i8_ptr () (_ BitVec 64) typed_ptr)
    (define-fun restored_typed_ptr () (_ BitVec 64) as_i8_ptr)
    (assert (not (= restored_typed_ptr typed_ptr)))
    (check-sat)
  include_model: false
  include_stats: false
