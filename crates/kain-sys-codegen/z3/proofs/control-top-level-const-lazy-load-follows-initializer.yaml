version: 1
id: kain.sys.codegen.llvm.proofs.control_top_level_const_lazy_load_follows_initializer
kind: check_smt2
description: Top-level consts that require runtime initialization emit a lazy initializer
  that stores the computed value before setting the init flag, and every const load
  emits a call to that initializer before the load. Under those control-ordering assumptions,
  a generated load cannot observe the lazy const in an uninitialized state.
tags:
- llvm
- control
- const
- initializer
source:
  path: D:/Kain-Lang/crates/kain-sys-codegen/src/codegen_llvm/mod.rs
  symbol: compile_const_load
  start_line: 2883
  reason: compile_const_load emits the initializer call before loading the global,
    while compile_const_initializer stores the value before writing the initialized
    flag
case:
  smt2: '(set-logic QF_LIA)

    (declare-const initial_flag Int)

    (declare-const store_executed Int)

    (assert (or (= initial_flag 0) (= initial_flag 1)))

    (assert (or (= store_executed 0) (= store_executed 1)))

    (assert (=> (= initial_flag 0) (= store_executed 1)))

    (define-fun final_flag () Int (ite (= initial_flag 1) 1 store_executed))

    (assert (= final_flag 0))

    (check-sat)'
  include_model: false
  include_stats: false
