version: 1
id: kain.sys.codegen.llvm.proofs.memory_rc_escape_transfer_balance
kind: check_smt2
description: >
  When LLVM lowers an escaping shared RC value from a local binding, it must
  emit exactly one retain before the local cleanup releases the source binding.
  Raw helper/raw pointer lanes must stay RC-neutral. This is the balance rule
  behind `expr_needs_shared_value_retain(...)`.
tags:
  - llvm
  - memory
  - rc
  - ownership
  - escape
source:
  path: D:/Kain-Lang/crates/kain-sys-codegen/src/codegen_llvm/mod.rs
  symbol: expr_needs_shared_value_retain
  reason: >
    The helper chooses the shared RC escape lane for runtime arrays, strings,
    and heap aggregates while excluding raw helper/authored pointer values that
    must not route through `rc_retain` / `rc_release`.
case:
  smt2: |
    (set-logic QF_LIA)

    (declare-fun rc0 () Int)
    (assert (>= rc0 1))

    ; Shared RC escape lane: retain once before the source local cleanup
    ; releases its ownership slot, leaving the escaped handle live.
    (define-fun shared_retain_count () Int 1)
    (define-fun shared_cleanup_release_count () Int 1)
    (define-fun shared_rc_after_escape () Int
      (- (+ rc0 shared_retain_count) shared_cleanup_release_count))

    ; Raw helper/authored pointer lane: codegen must stay RC-neutral.
    (define-fun raw_retain_count () Int 0)
    (define-fun raw_cleanup_release_count () Int 0)
    (define-fun raw_rc_after_escape () Int
      (- (+ rc0 raw_retain_count) raw_cleanup_release_count))

    (assert
      (or
        (< shared_rc_after_escape 1)
        (distinct raw_retain_count 0)
        (distinct raw_cleanup_release_count 0)
        (distinct raw_rc_after_escape rc0)))

    (check-sat)
  include_model: false
  include_stats: false
