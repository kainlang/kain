version: 1
id: kain.sys.codegen.llvm.proofs.control_guard_fail_cleanup_can_only_target_next_condition_or_no_match
kind: check_smt2
description: a match guard fail path only cleans up bound variables and then
  branches either to the next condition block or to the no-match block. It can
  never jump back into the current arm body or directly into the merge block.
tags:
- llvm
- control
- match
- guard
- cleanup
source:
  path: D:\Kain-Lang\crates\kain-sys-codegen\src\codegen_llvm\mod.rs
  symbol: compile_expr
  start_line: 6033
  reason: guard_fail now performs cleanup before branching to condition_labels[i + 1] or label_no_match
case:
  smt2: "(set-logic QF_LIA)\n(declare-const base Int)\n(declare-const arm_count Int)\n(declare-const i Int)\n(assert (>= base 0))\n(assert (> arm_count 0))\n(assert (>= i 0))\n(assert (< i arm_count))\n(define-fun label_end () Int base)\n(define-fun label_no_match () Int (+ base 1))\n(define-fun current_condition () Int (+ base 2 (* 2 i)))\n(define-fun current_arm () Int (+ base 3 (* 2 i)))\n(define-fun next_condition () Int (+ base 2 (* 2 (+ i 1))))\n(define-fun guard_false_target () Int (ite (< (+ i 1) arm_count) next_condition label_no_match))\n(assert (or (= guard_false_target label_end) (= guard_false_target current_condition) (= guard_false_target current_arm)))\n(check-sat)"
  include_model: false
  include_stats: false
