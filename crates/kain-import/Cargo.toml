[package]
name = "kain-import"
version = "0.1.0"
edition = "2021"
authors = ["KAIN Contributors"]
description = "Universal import system for KAIN - import C, Rust, and other languages into KAIN IR"
license = "MIT"

[dependencies]
# Core KAIN dependencies
kain-core = { path = "../kain-core" }

# C parsing
lang-c = { version = "0.15", optional = true }

# Utilities
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
pretty_assertions = "1.4"

[features]
default = ["c"]
c = ["lang-c"]
rust = []  # Future: syn crate for Rust parsing
cpp = []   # Future: tree-sitter-cpp
python = [] # Future: rustpython-parser
