version: 1
id: kain.sys.codegen.llvm.proofs.casts_double_to_bool_unordered_nonzero_aligns_with_runtime_truthiness
kind: check_smt2
description: LLVM `double -> bool` lowering with `fcmp une` matches Kain's total
  runtime truthiness rule `number != 0.0`, including `NaN`.
tags:
- llvm
- casts
- float
- bool
- truthiness
- nan
- saturation-safe
source:
  path: D:\Kain-Lang\crates\sys-codegen\src\codegen_llvm\mod.rs
  symbol: cast_numeric_value
  start_line: 8914
  reason: the shared numeric cast helper now lowers `double -> i1` via unordered
    non-zero comparison so `NaN` stays truthy like the interpreter/runtime path
case:
  smt2: '(set-logic QF_FP)

    (declare-const x (_ FloatingPoint 11 53))

    (define-fun zero () (_ FloatingPoint 11 53) (_ +zero 11 53))

    (define-fun runtime_truthy () Bool (not (fp.eq x zero)))

    (define-fun llvm_truthy_after_fix () Bool
      (or (fp.isNaN x) (not (fp.eq x zero))))

    (assert (xor runtime_truthy llvm_truthy_after_fix))

    (check-sat)

    '
  include_model: false
  include_stats: false
