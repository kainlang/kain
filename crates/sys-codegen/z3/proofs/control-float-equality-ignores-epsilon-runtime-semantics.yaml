version: 1
id: kain.sys.codegen.llvm.proofs.control_float_equality_ignores_epsilon_runtime_semantics
kind: check_smt2
description: LLVM float `==`/`!=` lowering uses raw ordered equality/inequality while
  the interpreter/runtime uses an epsilon window. There exist ordinary finite inputs
  where Kain semantic equality is true but LLVM equality is false, and inequality
  flips with it.
tags:
- llvm
- control
- float
- equality
- epsilon
- miscompile
source:
  path: D:\Kain-Lang\crates\sys-codegen\src\codegen_llvm\mod.rs
  symbol: compile_expr
  start_line: 15355
  reason: float `BinaryOp::Eq`/`Ne` lowering emits `fcmp oeq` / `fcmp one`, while
    the interpreter/runtime evaluates float equality with an `f64::EPSILON` window
case:
  smt2: '(set-logic QF_LRA)

    (declare-const a Real)

    (declare-const b Real)

    (define-fun epsilon () Real 0.0000000000000002220446049250313)

    (define-fun abs_real ((x Real)) Real (ite (>= x 0.0) x (- x)))

    (define-fun runtime_eq () Bool (< (abs_real (- a b)) epsilon))

    (define-fun llvm_eq () Bool (= a b))

    (define-fun runtime_ne () Bool (>= (abs_real (- a b)) epsilon))

    (define-fun llvm_ne () Bool (not (= a b)))

    (assert (= a 0.0))

    (assert (= b 0.0000000000000001))

    (assert (or (xor runtime_eq llvm_eq) (xor runtime_ne llvm_ne)))

    (check-sat)

    (get-model)

    '
  include_model: true
  include_stats: false
