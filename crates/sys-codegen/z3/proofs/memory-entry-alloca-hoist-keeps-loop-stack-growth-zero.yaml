version: 1
id: kain.sys.codegen.llvm.proofs.memory_entry_alloca_hoist_keeps_loop_stack_growth_zero
kind: check_smt2
description: LLVM local slots are inserted into the function entry block instead of
  the currently active control-flow block. Once every backend alloca flows through
  emit_entry_alloca, a long-running loop contributes zero additional stack bytes
  per frame, so frame count alone cannot cause stack overflow when the fixed entry
  allocation fits inside the stack limit.
tags:
- llvm
- memory
- stack
- alloca
- ui
source:
  path: D:\Kain-Lang\crates\sys-codegen\src\codegen_llvm\mod.rs
  symbol: emit_entry_alloca
  start_line: 194
  reason: emit_entry_alloca inserts alloca text at entry_alloca_insert_offset, and
    every textual LLVM alloca emission in the backend now routes through that helper
case:
  smt2: "(set-logic QF_LIA)\n(declare-const frames Int)\n(declare-const stack_limit_bytes Int)\n(declare-const entry_alloca_bytes Int)\n(declare-const loop_stack_contribution_bytes Int)\n(assert (>= frames 0))\n(assert (> stack_limit_bytes 0))\n(assert (>= entry_alloca_bytes 0))\n(assert (<= entry_alloca_bytes stack_limit_bytes))\n(assert (= loop_stack_contribution_bytes 0))\n(define-fun total_stack_after_frames () Int (+ entry_alloca_bytes loop_stack_contribution_bytes))\n(assert (> total_stack_after_frames stack_limit_bytes))\n(check-sat)"
  include_model: false
  include_stats: false
