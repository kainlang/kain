version: 1
id: kain.sys.codegen.llvm.proofs.layout_string_literal_byte_count_adds_trailing_nul_without_wrap
kind: size_add_ok
description: compile_string_literal and compile_static_c_string_literal both use
  s.len() + 1 so the emitted LLVM global includes a trailing NUL byte. Under the
  explicit usize headroom precondition that addition stays in range.
