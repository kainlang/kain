version: 1
id: kain.sys.codegen.llvm.proofs.casts_double_bitcast_roundtrip_preserves_array_float_storage
kind: check_smt2
description: >
  coerce_runtime_array_storage_from_compiled lowers Float array storage as a raw
  64-bit IEEE payload lane, so storing and reloading that lane preserves the
  exact payload bits.
tags:
  - llvm
  - casts
  - float
  - array
  - storage
source:
  path: D:\Kain-Lang\crates\sys-codegen\src\codegen_llvm\mod.rs
  symbol: coerce_runtime_array_storage_from_compiled
  start_line: 9000
  reason: typed runtime Float arrays must round-trip their 64-bit storage lane exactly
case:
  smt2: "(set-logic QF_BV)\n(declare-const ieee_payload (_ BitVec 64))\n(define-fun stored_lane () (_ BitVec 64) ieee_payload)\n(define-fun reloaded_lane () (_ BitVec 64) stored_lane)\n(assert (not (= reloaded_lane ieee_payload)))\n(check-sat)"
  include_model: false
  include_stats: false
