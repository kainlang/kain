[pack]
name = "kain.build.proofs"
scope = ".."
languages = ["rust"]

[solver]
timeout_ms = 5000
size_bits = 64

[sources]
include = ["**/*"]
exclude = ["z3/**", "target/**", "node_modules/**"]

[templates]
use = ["builtin:*", "local:templates/*.yaml"]

[plugins]
use = ["local:*", "global:*"]

[fixtures]
use = ["fixtures/**/*.*"]

[ci]
smoke = ["proofs/**/*.yaml"]
full = ["proofs/**/*.*"]
build = ["proofs/build-*.yaml"]

[reports]
path = "reports"
keep_history = true

[engines]

[engines.libclang]
compile_flags = []
include_paths = []
