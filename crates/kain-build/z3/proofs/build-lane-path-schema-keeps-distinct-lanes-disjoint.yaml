version: 1
id: kain.build.proofs.build_lane_path_schema_keeps_distinct_lanes_disjoint
kind: check_smt2
description: The canonical artifact tuple includes lane between host and target, so two builds with different lanes cannot resolve to the same canonical task root while host, target, unit, and task are fixed.
tags:
- build
- lane
- artifact-root
- isolation
source:
  path: D:\Kain-Lang\crates\kain-build\src\workspace.rs
  symbol: StandaloneBuildConfig::task_root
  start_line: 1048
  reason: task_root appends host, lane, target, unit, and task id in that order
case:
  smt2: |
    (set-logic ALL)
    (declare-const host_a Int)
    (declare-const host_b Int)
    (declare-const lane_a Int)
    (declare-const lane_b Int)
    (declare-const target_a Int)
    (declare-const target_b Int)
    (declare-const unit_a Int)
    (declare-const unit_b Int)
    (declare-const task_a Int)
    (declare-const task_b Int)
    (define-fun same_path () Bool
      (and (= host_a host_b)
           (= lane_a lane_b)
           (= target_a target_b)
           (= unit_a unit_b)
           (= task_a task_b)))
    (assert (and (= host_a host_b)
                 (not (= lane_a lane_b))
                 (= target_a target_b)
                 (= unit_a unit_b)
                 (= task_a task_b)
                 same_path))
    (check-sat)
  include_model: false
  include_stats: false
