version: 1
id: kain.build.proofs.build_output_collision_guard_rejects_duplicate_paths
kind: check_smt2
description: validate_plan_safety accepts a task-output set only when no two distinct tasks resolve to the same stable output key.
tags:
- build
- graph
- outputs
