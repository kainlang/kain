version: 1
id: kain.build.proofs.build_order_task_dag_rejects_bounded_cycles
kind: check_smt2
description: order_tasks accepts a three-node dependency graph only when self-cycles, two-node cycles, and three-node cycles are absent.
tags:
- build
- graph
- dag
- cycle
source:
  path: D:\Kain-Lang\crates\kain-build\src\workspace.rs
  symbol: order_tasks
  start_line: 2591
  reason: DFS temporary marks reject cycles before a task can be permanently ordered
case:
  smt2: |
    (set-logic ALL)
    (declare-const ab Bool)
    (declare-const ba Bool)
    (declare-const ac Bool)
    (declare-const ca Bool)
    (declare-const bc Bool)
    (declare-const cb Bool)
    (declare-const aa Bool)
    (declare-const bb Bool)
    (declare-const cc Bool)
    (define-fun self_cycle () Bool (or aa bb cc))
    (define-fun two_cycle () Bool (or (and ab ba) (and ac ca) (and bc cb)))
    (define-fun three_cycle () Bool (or (and ab bc ca) (and ac cb ba)))
    (define-fun has_cycle () Bool (or self_cycle two_cycle three_cycle))
    (define-fun accepted_dag () Bool (not has_cycle))
    (assert (and accepted_dag has_cycle))
    (check-sat)
  include_model: false
  include_stats: false
