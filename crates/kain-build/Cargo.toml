[package]
name = "kain-build"
version = "0.1.0"
edition = "2021"
description = "KAIN build orchestration and Cargo build.rs helpers"
license = "MIT"

[dependencies]
blade = { path = "../kain-blades" }
kain-check = { path = "../kain-check" }
kain-core = { path = "../kain-core" }
kain-driver = { path = "../kain-driver" }
kain-fs = { path = "../kain-fs" }
kain-host = { path = "../kain-host", default-features = false }
kain-omni = { path = "../kain-omni" }
kain-sys-codegen = { path = "../kain-sys-codegen" }
kain-test = { path = "../kain-test" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }
toml = { workspace = true }

[features]
default = []
tauri = ["kain-driver/tauri"]
