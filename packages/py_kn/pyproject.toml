[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pykain"
version = "0.1.0"
description = "The official Python companion layer for Kain"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["."]
include = ["pykain*"]
