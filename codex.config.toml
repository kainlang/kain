# Copy the block below into ~/.codex/config.toml and set KAIN_REPO_ROOT in your shell.
# The direct compiled `kain` path now speaks clean MCP stdio, so Codex no longer needs the Python shim.

[mcp_servers.kain_mcp]
startup_timeout_sec = 60
command = "kain"
args = ["run", "${KAIN_REPO_ROOT}/blades/kain-mcp"]
cwd = "${KAIN_REPO_ROOT}"
