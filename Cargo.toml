[workspace]
members = [
    "crates/kain-core",
    "crates/ue5",
    "crates/ue5-shaders",
    "crates/gpu",
    "crates/web",
    "crates/sys",
    "crates/cli",
    # "crates/browser" # Uncomment when ready to integrate
]
resolver = "2"

[workspace.dependencies]
# Compiler Front-end
logos = "0.14"
chumsky = "0.9"
ariadne = "0.4"
thiserror = "1"
indexmap = "2"
petgraph = "0.6"

# Runtime & Async
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-std", "fs"] }
flume = "0.11"
once_cell = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
jsonschema = "0.18"

# CLI & LSP
clap = { version = "4", features = ["derive"] }
tower-lsp = "0.20"
notify = "6"
ctrlc = "3"

# Utilities
reqwest = { version = "0.12.28", features = ["blocking", "json"] }
flate2 = "1.0"
tar = "0.4"
heck = "0.5.0"
minijinja = "2.15.1"
chrono = "0.4.43"

# Backend specific (can remain here to lock versions)
inkwell = { version = "0.4", features = ["llvm17-0", "target-x86"] }
walrus = "0.21"
rspirv = "0.12"
pyo3 = { version = "0.20", features = ["auto-initialize"] }
