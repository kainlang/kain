[package]
name = "DialogueForge"
version = "1.0.0"
authors = ["KAIN Compiler"]

[ue5]
plugin_name = "DialogueForge"
engine_version = "5.4"
category = "Narrative"
description = "Full dialogue system with branching conversations, conditions, graph editor, voice line playback, and GAS integration"

sources = [
    "src/dialogue_data_structures.kn",
    "src/dialogue_subsystem.kn",
    "src/dialogue_graph_runtime.kn",
    "src/dialogue_graph_editor.kn",
    "src/dialogue_actors.kn",
    "src/dialogue_gas_integration.kn",
    "src/dialogue_ui_widgets.kn",
]

[[ue5.modules]]
name = "DialogueForge"
type = "Runtime"
loading_phase = "Default"

[[ue5.modules]]
name = "DialogueForgeEditor"
type = "Editor"
depends_on = ["DialogueForge"]

[build]
targets = ["ue5"]
output_dir = "Generated"
