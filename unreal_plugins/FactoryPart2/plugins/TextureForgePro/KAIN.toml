name = "TextureForgePro"
version = "1.0.0"
authors = ["KAIN Factory Part 2"]
description = "Professional Substance Painter alternative for UE5 with procedural texture generation, GPU filters, and real-time preview"

[build]
entry = "src/types.kn"
target = "ue5"

[ue5]
plugin_name = "TextureForgePro"
plugin_dir = "."
engine_version = "5.4"
modular_output = true

# All source files in src/ — ordered by dependency
sources = [
    "src/data_structures.kn",
    "src/filter_shaders.kn",
    "src/material_generators.kn",
    "src/texture_graph_runtime.kn",
    "src/texture_graph_editor.kn",
    "src/layer_stack_widget.kn",
    "src/preview_viewport.kn",
    "src/texture_forge_actor.kn",
]
