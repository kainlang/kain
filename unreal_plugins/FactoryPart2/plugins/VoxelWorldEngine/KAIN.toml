name = "VoxelWorldEngine"
version = "1.0.0"
authors = ["KAIN Factory Part 2"]
description = "Minecraft-style voxel engine with infinite terrain generation, multiplayer support, and advanced voxel manipulation for 100+ player servers"

[build]
entry = "src/types.kn"
target = "ue5"

[ue5]
plugin_name = "VoxelWorldEngine"
plugin_dir = "."
engine_version = "5.4"
modular_output = true

# All source files in src/ — ordered by dependency
sources = [
    "voxel_types.kn",
    "chunk_shaders.kn",
    "terrain_generation.kn",
    "voxel_physics.kn",
    "chunk_manager.kn",
    "world_subsystem.kn",
    "voxel_actors.kn",
    "multiplayer_sync.kn",
]
