name = "MeshForge"
version = "1.0.0"
authors = ["KAIN Factory Part 2"]
description = "Houdini-style procedural mesh generation system with node-based modeling, real-time preview, and Blueprint integration"

[build]
entry = "src/types.kn"
target = "ue5"

[ue5]
plugin_name = "MeshForge"
plugin_dir = "."
engine_version = "5.4"
modular_output = true

# All source files in src/ — ordered by dependency
sources = [
    "mesh_types.kn",
    "mesh_operations.kn",
    "mesh_shaders.kn",
    "mesh_graph_runtime.kn",
    "mesh_graph_editor.kn",
    "mesh_actor.kn",
]
