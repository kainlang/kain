# Root-level plugin_name for FULLBUILD.bat compatibility
plugin_name = "TitanGraph"

[plugin]
name = "TitanGraph"
version = "1.0.0"
description = "Quest and dialogue graph editor with runtime system"
author = "KAIN Factory"
category = "Gameplay"
