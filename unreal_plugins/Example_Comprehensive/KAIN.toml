[package]
name = "ComprehensiveTest"
version = "1.0.0"
authors = ["KAIN Test Suite"]

[ue5]
plugin_name = "ComprehensiveTest"
engine_version = "5.4"
category = "Testing"
description = "Comprehensive test plugin exercising all non-GAS KAIN features"

[[ue5.modules]]
name = "ComprehensiveTest"
type = "Runtime"
loading_phase = "Default"

[[ue5.modules]]
name = "ComprehensiveTestEditor"
type = "Editor"
loading_phase = "Default"
depends_on = ["ComprehensiveTest"]

[build]
targets = ["ue5"]
