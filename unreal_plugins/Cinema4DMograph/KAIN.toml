[package]
name = "Cinema4DMograph"
version = "1.0.0"
authors = ["K-Studio"]
description = "Professional mograph system for UE5 inspired by Cinema4D's MoGraph"

[build]
entry = "Kain/types.kn"
target = "ue5"

[ue5]
plugin_name = "ZenMograph"
plugin_dir = ""
engine_version = "5.4"
modular_output = true

# All source files in Kain/ — ordered by dependency (types first, then components, modifiers, actors, utilities, editor)
sources = [
    "Kain/types.kn",
    "Kain/components.kn",
    "Kain/modifiers.kn",
    "Kain/actors.kn",
    "Kain/utilities.kn",
    "Kain/editor.kn",
]

