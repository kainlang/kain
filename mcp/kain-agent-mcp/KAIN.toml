[package]
name = "kain-agent-mcp"
version = "0.1.0"
description = "Repo-native Kain MCP transport scaffold. Permanent MCP workspace, not a proving-ground blade."

[blade]
name = "kain-agent-mcp"
kind = "kain_app"
entry = "src/main.kn"
source_roots = ["src"]
module_roots = ["src"]
build_targets = ["llvm"]

[run]
entry = "src/main.kn"
target = "llvm"

[build]
entry = "src/main.kn"
artifact_root = ".kain/out"
cache_root = ".kain/cache/build"
profile = "debug"

[[build.tasks]]
id = "check-llvm"
kind = "check"
entry = "src/main.kn"
target = "llvm"
inputs = [
  "src/main.kn",
  "src/agent_mcp_util.kn",
  "src/agent_mcp_config.kn",
  "src/agent_mcp_protocol.kn",
  "src/agent_mcp_tools.kn",
  "src/agent_mcp_server.kn",
  "config/server.json",
]
