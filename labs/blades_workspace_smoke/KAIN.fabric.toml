version = 1

[workspace]
root = "."
search_roots = ["apps", "blades", "crates", "scripts"]

[[requires]]
key = "session.local"
version = 1
optional = false

[[steps]]
id = "python_source"
runtime = "python"
entry = "scripts/python_source.py"

[[steps.outputs]]
name = "settings"
kind = "value"

[[steps]]
id = "kain_orchestrator"
runtime = "kain"
blade = "signal-console"
depends_on = ["python_source"]

[[steps.outputs]]
name = "image"
kind = "shared_image"

[[steps.outputs]]
name = "report"
kind = "value"

[[steps]]
id = "native_filter"
runtime = "c_abi"
blade = "native-filter"
depends_on = ["python_source", "kain_orchestrator"]

[[steps.outputs]]
name = "filtered_image"
kind = "shared_image"

[[steps.outputs]]
name = "snapshot"
kind = "shared_buffer"

[[steps.outputs]]
name = "signature"
kind = "value"

[[steps]]
id = "rust_metrics"
runtime = "rust_crate"
blade = "native-metrics"
depends_on = ["native_filter", "kain_orchestrator"]

[[steps.outputs]]
name = "analysis"
kind = "value"

[[steps]]
id = "node_packager"
runtime = "node"
entry = "scripts/node_packager.mjs"
depends_on = ["kain_orchestrator", "native_filter", "rust_metrics"]

[[steps.outputs]]
name = "summary"
kind = "value"

[reports]
directory = "outputs/fabric/reports"
emit_jsonl_events = true
