[package]
name = "signal-console"
version = "0.1.0"
description = "Blade smoke app that feeds the CPU Fabric pipeline"

[blade]
name = "signal-console"
kind = "app"
entry = "src/main.kn"
source_roots = ["src"]
module_roots = ["src"]
build_targets = ["run", "fabric"]

[[blade.dependencies]]
name = "signal-math"
kind = "kain"

[[blade.dependencies]]
name = "native-filter"
kind = "c_ffi"

[[blade.dependencies]]
name = "native-metrics"
kind = "rust_crate"

[[blade.dependencies]]
name = "gpu-compute"
kind = "gpu_compute"
optional = true
