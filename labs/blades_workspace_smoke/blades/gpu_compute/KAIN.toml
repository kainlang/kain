[package]
name = "gpu-compute"
version = "0.1.0"
description = "GPU compute blade discovered from blade metadata"

[blade]
name = "gpu-compute"
kind = "gpu_compute"
source_roots = ["shaders"]
module_roots = ["shaders"]
build_targets = ["gpu-artifacts"]

[blade.gpu]
shader_sources = [
    "shaders/gpu_step.kn",
    "shaders/nebula_field.kn",
    "shaders/spectral_lattice.kn",
]
shader_roots = ["shaders"]
compute_keys = ["BladeSmokeCopy", "BladeNebulaForge", "BladeSpectralLattice"]
