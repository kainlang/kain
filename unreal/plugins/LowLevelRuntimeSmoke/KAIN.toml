[package]
name = "LowLevelRuntimeSmoke"
version = "1.0.0"
authors = ["KAIN Factory Labs"]
description = "UE5 smoke project built from an imported self-hosting runtime sample to validate low-level memory and storage lowering through the Factory pipeline"

[build]
targets = ["ue5"]

[ue5]
plugin_name = "LowLevelRuntimeSmoke"
plugin_dir = "."
sources = ["kain_runtime_clean.kn"]
modular_output = true