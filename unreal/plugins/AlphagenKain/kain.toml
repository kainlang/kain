[package]
name = "AlphaGen"
version = "2.0.0"
authors = ["K-Studio"]
description = "AlphaGen - Complete procedural alpha texture generation system with 21 generators, 15 filters, Blueprint support, and Slate editor UI"

[build]
targets = ["ue5"]

[ue5]
plugin_name = "AlphaGen"
plugin_dir = "."
sources = ["AlphaGen_FULL.kn"]
shaders = [
    "GenerateRadial", "GenerateCircle", "GenerateSquare", "GenerateDiamond",
    "GeneratePerlin", "GenerateVoronoi", "GenerateBricks", "GenerateDots",
    "GenerateSeamlessNoise", "GenerateCrosshatch", "GenerateWaves", "GenerateCheckerboard",
    "GenerateHexagon", "GenerateTears", "GenerateScratches", "GenerateSplatter",
    "GenerateCracks", "GenerateCells", "GenerateGrunge", "GenerateFibers", "GenerateCaustics",
    "FilterCopy", "FilterBlur", "FilterSharpen", "FilterInvert", "FilterDilate",
    "FilterErode", "FilterThreshold", "FilterPosterize", "FilterPixelate", "FilterEdgeDetect",
    "FilterLevels", "FilterContrast", "FilterSpherize", "FilterSpiral", "FilterDomainWarp"
]
modular_output = true
