[package]
name = "FluidFlow"
version = "1.0.0"
authors = ["KAIN Research Labs"]
description = "Hyper-Advanced Computational Fluid Dynamics System - The most sophisticated fluid simulation ever created for Unreal Engine 5, featuring quantum fluids, magnetohydrodynamics, multiphase flows, and real-time supercomputing capabilities"

[build]
targets = ["ue5"]

[ue5]
plugin_name = "FluidFlow"
plugin_dir = "."
sources = ["HyperFluidDynamics.kn"]
shaders = [
    "LatticeBoltzmannCollision",
    "LatticeBoltzmannStreaming", 
    "SmoothedParticleHydrodynamics",
    "MagnetohydrodynamicsInduction",
    "MagnetohydrodynamicsLorentz",
    "QuantumFluidGrossPitaevskii",
    "QuantumFluidVortices",
    "MultiphasePhaseField",
    "MultiphaseSurfaceTension",
    "ThermalFluidConduction",
    "ThermalFluidConvection",
    "ReactiveFluidChemistry",
    "ReactiveFluidCombustion",
    "GranularFlowCollision",
    "GranularFlowFriction",
    "CosmicDustAccretion",
    "CosmicDustRadiation",
    "SuperfluidHelium4",
    "SuperfluidVortexLattice",
    "PlasmaTokamak",
    "PlasmaFusion",
    "ViscoelasticStress",
    "ViscoelasticRelaxation",
    "ImmersedBoundaryForce",
    "ImmersedBoundaryVelocity",
    "SpectralFourierTransform",
    "SpectralTurbulence",
    "VortexMethodCore",
    "VortexMethodAdvection",
    "FiniteVolumeFlux",
    "FiniteVolumeGradient",
    "FiniteElementStiffness",
    "FiniteElementMass",
    "FluidRaymarching",
    "FluidSchlieren",
    "FluidInterferometry",
    "FluidHolography",
    "FluidQuantumVisualization"
]
modular_output = true