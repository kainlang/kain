[package]
name = "KainCosmos"
version = "1.0.0"
authors = ["UE5 PLUGIN FACTORY"]
description = "God-Tier Single-File Procedural Planet Generator with Volumetric Atmosphere"

[build]
targets = ["ue5"]

[ue5]
plugin_name = "KainCosmos"
plugin_dir = "."
sources = ["KainCosmosGod.kn"]
shaders = [
    "K1Tectonics",
    "K2Continental",
    "K3Thermal",
    "K4Moisture",
    "K5Resources",
    "K6Normals",
    "K7Ocean",
    "K8Atmosphere",
    "K9Biomes",
    "K10Flora",
    "K11CityLights",
    "K12SovereignPBR"
]
modular_output = true