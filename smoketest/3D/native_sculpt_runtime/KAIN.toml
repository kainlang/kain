[package]
name = "native_sculpt_runtime"
version = "0.1.0"

[build]
entry = "smoke.kn"
output = "outputs"
targets = ["run", "test"]

[rust_ffi]
manifest_path = "../../../Cargo.toml"

[[rust_ffi.path_crates]]
name = "native_sculpt_backend"
path = "local_crate"

[c_ffi]

[[c_ffi.libraries]]
name = "native_sculpt_host"
header = "native/native_sculpt_host.h"
shared_lib = "native/native_sculpt_host.dll"
