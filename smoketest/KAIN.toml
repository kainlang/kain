# build.kn owns the explicit evidence DAG; this manifest carries compatibility
# metadata that the current run/build pipeline still reads for C FFI.

[package]
name = "smoketest"
version = "0.1.0"
description = "Album-edition Kain proving ground for semantics, systems, stdlib, interop, and telemetry."

[blade]
name = "smoketest"
kind = "kain_app"
entry = "src/main.kn"
source_roots = [
  "src",
  "src/semantics",
  "src/systems",
  "src/gpu",
  "src/stdlib",
  "src/interop",
  "src/wasm",
  "src/telemetry",
  "src/ui",
  "telemetry",
]
module_roots = [
  "src",
  "src/semantics",
  "src/systems",
  "src/gpu",
  "src/stdlib",
  "src/interop",
  "src/wasm",
  "src/telemetry",
  "src/ui",
  "telemetry",
]
build_targets = ["llvm"]

[run]
entry = "src/main.kn"
target = "llvm"

[build]
entry = "src/main.kn"
artifact_root = ".kain/out/llvm"
cache_root = ".kain/cache/build"
profile = "debug"

[c_ffi]
tier = "inline"
include_paths = ["native"]

[[c_ffi.libraries]]
name = "sqlite3"
header = "native/sqlite3.h"
sources = ["native/sqlite3.c"]

[[c_ffi.libraries]]
name = "smoketest_sqlite_pingpong"
header = "native/smoketest_sqlite_pingpong.h"
sources = ["native/smoketest_sqlite_pingpong.c"]

[[c_ffi.libraries]]
name = "smoketest_visualizer_bridge"
header = "native/smoketest_visualizer_bridge.h"
sources = ["native/smoketest_visualizer_bridge.c"]
link_libs = ["user32", "gdi32", "opengl32"]
