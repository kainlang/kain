[package]
name = "zen_workflow_city"
version = "0.1.0"

[build]
entry = "smoke.kn"
output = "outputs"
targets = ["run", "test"]

[node_ffi]
command = "node"
args = []
cwd = "."

[rust_ffi]
manifest_path = "../../../Cargo.toml"

[[rust_ffi.path_crates]]
name = "workflow_city_lab"
path = "local_crate"

[c_ffi]

[[c_ffi.libraries]]
name = "cgltf_scene_probe"
header = "native/cgltf_scene_probe.h"
shared_lib = "native/cgltf_scene_probe.dll"
