version: 1
id: kain.native.core.proofs.native_stdlib_abi_string_new_allocation_overflow
kind: check_smt2
description: Proves that unguarded allocation (length * 2u) + 1u can overflow, but the guard length <= (SIZE_MAX - 1u) / 2u mathematically prevents any overflow.
tags:
- native-runtime
- stdlib_abi
- allocation
- overflow
- correctness
source:
  path: runtime\native\src\core\stdlib_abi.c
  symbol: string_new
  start_line: 2704
  reason: Verification of allocation size safety bounds with and without the division-based overflow guard.
case:
  smt2: |
    (set-logic ALL)

    ; Define length as 64-bit bit-vector (size_t on x86_64)
    (declare-const length (_ BitVec 64))
    
    ; SIZE_MAX for 64-bit is 18446744073709551615
    (define-fun size_max () (_ BitVec 64)
      (_ bv18446744073709551615 64))
      
    ; Multiplication term: length * 2
    (define-fun mult_term () (_ BitVec 64)
      (bvmul length (_ bv2 64)))
      
    ; Total allocation size: (length * 2) + 1
    (define-fun alloc_size () (_ BitVec 64)
      (bvadd mult_term (_ bv1 64)))

    ; Define condition for multiplication overflow
    ; In unsigned 64-bit, length * 2 overflows if length > SIZE_MAX / 2
    (define-fun mult_overflows () Bool
      (bvugt length (bvudiv size_max (_ bv2 64))))

    ; Define condition for addition overflow
    ; mult_term + 1 overflows if mult_term == SIZE_MAX
    (define-fun add_overflows () Bool
      (= mult_term size_max))

    ; Any overflow in the calculation
    (define-fun any_overflow () Bool
      (or mult_overflows add_overflows))

    ; --- PART 1: The Unguarded Case ---
    ; We assert that an overflow occurs to find a counterexample input
    (assert any_overflow)

    (check-sat)
    (get-model)
  include_model: true
  include_stats: false
