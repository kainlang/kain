# Cargo build configuration for the Kain repo.
#
# Machine-specific parallelism, sccache, and LIB paths live in
#   %USERPROFILE%\.cargo\config.toml
# — keep them there, not here.

# ── Linker note ──────────────────────────────────────────────
# link.exe is symlinked to lld-link 22.1.6 (F:\Scoop\apps\llvm\current\bin\)
# No rustflags needed — the symlink takes care of it.

# ── Dev profile ──────────────────────────────────────────────
[profile.dev]
incremental = true
# line-tables-only = backtraces work, debug info doesn't — 2-3× faster compiles
debug = "line-tables-only"

# Faster dependency builds (shared generics in deps get opt-level=2)
[profile.dev.build-override]
opt-level = 2

# ── Net ──────────────────────────────────────────────────────
[net]
git-fetch-with-cli = false

# ── Aliases ──────────────────────────────────────────────────
[alias]
# Build release + install
bi = "build --release"
# Release build, warnings silenced, only errors surface
br = "build --release --config target.x86_64-pc-windows-msvc.rustflags=['-Awarnings']"
