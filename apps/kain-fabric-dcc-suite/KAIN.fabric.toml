version = 1

[workspace]
root = "."
search_roots = ["src", "scripts", "native", "local_crate", "shaders"]

[[requires]]
key = "session.local"
version = 1
optional = false

[[steps]]
id = "python_suite_bootstrap"
runtime = "python"
entry = "scripts/python_suite_bootstrap.py"

[[steps.outputs]]
name = "project_settings"
kind = "value"

[[steps]]
id = "dcc_suite_seed"
runtime = "kain"
entry = "src/main.kn"
depends_on = ["python_suite_bootstrap"]

[[steps.outputs]]
name = "scene_graph_document"
kind = "value"

[[steps.outputs]]
name = "asset_catalog_document"
kind = "value"

[[steps.outputs]]
name = "material_authoring_document"
kind = "value"

[[steps.outputs]]
name = "svg_mask_document"
kind = "value"

[[steps.outputs]]
name = "preview_src"
kind = "shared_buffer"

[[steps.outputs]]
name = "preview_dst"
kind = "shared_buffer"

[[steps.outputs]]
name = "preview_image"
kind = "shared_image"

[[steps.outputs]]
name = "tensor_features"
kind = "shared_buffer"

[[steps.outputs]]
name = "sculpt_heightfield_src"
kind = "shared_buffer"

[[steps.outputs]]
name = "sculpt_brush_params"
kind = "shared_buffer"

[[steps.outputs]]
name = "sculpt_delta"
kind = "shared_buffer"

[[steps.outputs]]
name = "session_report"
kind = "value"

[[steps]]
id = "gpu_sculpt_displacement"
runtime = "gpu_compute"
shader_source = "shaders/sculpt_heightfield_apply.kn"
compute_key = "DccSuiteGpuSculptStroke"
depends_on = ["dcc_suite_seed"]

[[steps.outputs]]
name = "sculpt_delta"
kind = "shared_buffer"

[[steps]]
id = "mesh_import_projection"
runtime = "kain"
entry = "src/mesh_import_projection.kn"
depends_on = ["python_suite_bootstrap", "dcc_suite_seed"]

[[steps.outputs]]
name = "imported_mesh_payload_report"
kind = "value"

[[steps]]
id = "primitive_mesh_authoring"
runtime = "kain"
entry = "src/primitive_mesh_authoring.kn"
depends_on = ["python_suite_bootstrap", "dcc_suite_seed", "mesh_import_projection"]

[[steps.outputs]]
name = "authored_primitive_report"
kind = "value"

[[steps]]
id = "material_authoring_projection"
runtime = "kain"
entry = "src/material_authoring_projection.kn"
depends_on = ["python_suite_bootstrap", "dcc_suite_seed", "primitive_mesh_authoring"]

[[steps.outputs]]
name = "material_authoring_report"
kind = "value"

[[steps]]
id = "svg_material_mask_projection"
runtime = "kain"
entry = "src/svg_material_mask_projection.kn"
depends_on = ["python_suite_bootstrap", "dcc_suite_seed", "material_authoring_projection"]

[[steps.outputs]]
name = "svg_mask_report"
kind = "value"

[[steps]]
id = "native_sculpt_kernel"
runtime = "c_abi"
entry = "src/native_sculpt_step.kn"
module = "dcc_suite_ops"
library = "native/dcc_suite_ops.dll"
depends_on = ["python_suite_bootstrap", "gpu_sculpt_displacement"]

[[steps.outputs]]
name = "sculpt_signature"
kind = "value"

[[steps.outputs]]
name = "sculpt_report"
kind = "value"

[[steps]]
id = "sculpt_brush_projection"
runtime = "kain"
entry = "src/sculpt_brush_projection.kn"
depends_on = ["python_suite_bootstrap", "dcc_suite_seed", "native_sculpt_kernel"]

[[steps.outputs]]
name = "sculpt_brush_report"
kind = "value"

[[steps]]
id = "rig_graph_analysis"
runtime = "rust_crate"
entry = "src/rust_graph_step.kn"
crate_name = "fabric_dcc_suite_runtime"
manifest_path = "local_crate/Cargo.toml"
depends_on = ["dcc_suite_seed", "gpu_sculpt_displacement", "native_sculpt_kernel"]

[[steps.outputs]]
name = "topology_report"
kind = "value"

[[steps]]
id = "topology_history_projection"
runtime = "kain"
entry = "src/topology_history_projection.kn"
depends_on = ["python_suite_bootstrap", "dcc_suite_seed", "rig_graph_analysis"]

[[steps.outputs]]
name = "topology_history_report"
kind = "value"

[[steps]]
id = "tensor_train_stage"
runtime = "python"
entry = "scripts/python_tensor_train_step.py"
depends_on = ["python_suite_bootstrap", "dcc_suite_seed", "rig_graph_analysis", "topology_history_projection"]

[[steps.outputs]]
name = "tensor_training_report"
kind = "value"

[[steps]]
id = "tensor_infer_stage"
runtime = "python"
entry = "scripts/python_tensor_infer_step.py"
depends_on = ["python_suite_bootstrap", "dcc_suite_seed", "tensor_train_stage"]

[[steps.outputs]]
name = "tensor_inference_report"
kind = "value"

[[steps]]
id = "gpu_material_preview"
runtime = "gpu_compute"
shader_source = "shaders/material_bake_preview.kn"
compute_key = "DccSuiteMaterialBakePreview"
depends_on = ["dcc_suite_seed", "material_authoring_projection", "svg_material_mask_projection"]

[[steps.outputs]]
name = "preview_dst"
kind = "shared_buffer"

[[steps]]
id = "gpu_pathtrace_preview"
runtime = "gpu_compute"
shader_source = "shaders/pathtrace_preview_lighting.kn"
compute_key = "DccSuitePathTracePreviewLighting"
depends_on = ["dcc_suite_seed", "material_authoring_projection", "svg_material_mask_projection", "gpu_material_preview"]

[[steps.outputs]]
name = "pathtrace_dst"
kind = "shared_buffer"

[[steps]]
id = "pathtrace_preview_projection"
runtime = "kain"
entry = "src/pathtrace_preview_projection.kn"
depends_on = [
    "python_suite_bootstrap",
    "dcc_suite_seed",
    "material_authoring_projection",
    "svg_material_mask_projection",
    "gpu_material_preview",
    "gpu_pathtrace_preview"
]

[[steps.outputs]]
name = "pathtrace_preview_report"
kind = "value"

[[steps]]
id = "material_texture_export_projection"
runtime = "kain"
entry = "src/material_texture_export_projection.kn"
depends_on = [
    "python_suite_bootstrap",
    "dcc_suite_seed",
    "material_authoring_projection",
    "svg_material_mask_projection",
    "gpu_material_preview"
]

[[steps.outputs]]
name = "material_texture_export_report"
kind = "value"

[[steps]]
id = "publish_suite_report"
runtime = "kain"
entry = "src/node_publish_bridge.kn"
depends_on = [
    "python_suite_bootstrap",
    "dcc_suite_seed",
    "gpu_sculpt_displacement",
    "material_authoring_projection",
    "svg_material_mask_projection",
    "native_sculpt_kernel",
    "rig_graph_analysis",
    "tensor_train_stage",
    "tensor_infer_stage",
    "gpu_material_preview",
    "material_texture_export_projection"
]

[[steps.outputs]]
name = "publish_summary"
kind = "value"

[reports]
directory = ".kain/fabric/reports"
emit_jsonl_events = true
