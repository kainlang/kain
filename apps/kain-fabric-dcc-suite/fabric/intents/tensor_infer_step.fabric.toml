version = 1

[workspace]
root = "."
search_roots = ["src", "scripts"]

[[requires]]
key = "session.local"
version = 1
optional = false

[[steps]]
id = "python_suite_bootstrap"
runtime = "python"
entry = "scripts/python_suite_bootstrap.py"

[[steps.outputs]]
name = "project_settings"
kind = "value"

[[steps]]
id = "dcc_suite_seed"
runtime = "kain"
entry = "src/main.kn"
depends_on = ["python_suite_bootstrap"]

[[steps.outputs]]
name = "tensor_features"
kind = "shared_buffer"

[[steps]]
id = "tensor_train_stage"
runtime = "python"
entry = "scripts/python_tensor_train_step.py"
depends_on = ["python_suite_bootstrap", "dcc_suite_seed"]

[[steps.outputs]]
name = "tensor_training_report"
kind = "value"

[[steps]]
id = "tensor_infer_stage"
runtime = "python"
entry = "scripts/python_tensor_infer_step.py"
depends_on = ["python_suite_bootstrap", "dcc_suite_seed", "tensor_train_stage"]

[[steps.outputs]]
name = "tensor_inference_report"
kind = "value"

[[steps]]
id = "tensor_inference_bridge"
runtime = "kain"
entry = "src/tensor_infer_bridge.kn"
depends_on = ["tensor_infer_stage"]

[[steps.outputs]]
name = "tensor_inference_bridge"
kind = "value"

[reports]
directory = ".kain/fabric/intents/tensor_infer_step"
emit_jsonl_events = true
