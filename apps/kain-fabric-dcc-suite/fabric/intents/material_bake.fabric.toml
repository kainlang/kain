version = 1

[workspace]
root = "."
search_roots = ["src", "scripts", "shaders"]

[[requires]]
key = "session.local"
version = 1
optional = false

[[steps]]
id = "python_suite_bootstrap"
runtime = "python"
entry = "scripts/python_suite_bootstrap.py"

[[steps.outputs]]
name = "project_settings"
kind = "value"

[[steps]]
id = "dcc_suite_seed"
runtime = "kain"
entry = "src/main.kn"
depends_on = ["python_suite_bootstrap"]

[[steps.outputs]]
name = "preview_src"
kind = "shared_buffer"

[[steps.outputs]]
name = "preview_dst"
kind = "shared_buffer"

[[steps]]
id = "gpu_material_preview"
runtime = "gpu_compute"
shader_source = "shaders/material_bake_preview.kn"
compute_key = "DccSuiteMaterialBakePreview"
depends_on = ["dcc_suite_seed"]

[[steps.outputs]]
name = "preview_dst"
kind = "shared_buffer"

[reports]
directory = ".kain/fabric/intents/material_bake"
emit_jsonl_events = true
