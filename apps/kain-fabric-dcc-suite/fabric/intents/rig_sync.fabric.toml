version = 1

[workspace]
root = "../.."
search_roots = ["src", "scripts", "local_crate"]

[[requires]]
key = "session.local"
version = 1
optional = false

[[steps]]
id = "python_suite_bootstrap"
runtime = "python"
entry = "scripts/python_suite_bootstrap.py"

[[steps.outputs]]
name = "project_settings"
kind = "value"

[[steps]]
id = "dcc_suite_seed"
runtime = "kain"
entry = "src/main.kn"
depends_on = ["python_suite_bootstrap"]

[[steps.outputs]]
name = "scene_graph_document"
kind = "value"

[[steps]]
id = "rig_graph_analysis"
runtime = "rust_crate"
entry = "src/rust_graph_step.kn"
crate_name = "fabric_dcc_suite_runtime"
manifest_path = "local_crate/Cargo.toml"
depends_on = ["dcc_suite_seed"]

[[steps.outputs]]
name = "topology_report"
kind = "value"

[[steps]]
id = "rig_sync_projection"
runtime = "kain"
entry = "src/rig_sync_bridge.kn"
depends_on = ["python_suite_bootstrap", "rig_graph_analysis"]

[[steps.outputs]]
name = "rig_sync_report"
kind = "value"

[reports]
directory = ".kain/fabric/intents/rig_sync"
emit_jsonl_events = true
