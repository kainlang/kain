version = 1

[workspace]
root = "."
search_roots = ["src", "scripts"]

[[requires]]
key = "session.local"
version = 1
optional = false

[[steps]]
id = "python_suite_bootstrap"
runtime = "python"
entry = "scripts/python_suite_bootstrap.py"

[[steps.outputs]]
name = "project_settings"
kind = "value"

[[steps]]
id = "dcc_suite_seed"
runtime = "kain"
entry = "src/main.kn"
depends_on = ["python_suite_bootstrap"]

[[steps.outputs]]
name = "session_report"
kind = "value"

[[steps]]
id = "sim_tick_projection"
runtime = "kain"
entry = "src/session_projection.kn"
depends_on = ["python_suite_bootstrap", "dcc_suite_seed"]

[[steps.outputs]]
name = "sim_tick_plan"
kind = "value"

[[steps]]
id = "sim_solver_execute"
runtime = "kain"
entry = "src/sim_solver_step.kn"
depends_on = ["sim_tick_projection"]

[[steps.outputs]]
name = "sim_tick_report"
kind = "value"

[reports]
directory = ".kain/fabric/intents/sim_tick"
emit_jsonl_events = true
