version = 1

[workspace]
root = "../.."
search_roots = ["src", "scripts"]

[[requires]]
key = "session.local"
version = 1
optional = false

[[steps]]
id = "python_suite_bootstrap"
runtime = "kain"
entry = "src/python_suite_bootstrap.kn"

[[steps.outputs]]
name = "project_settings"
kind = "value"

[[steps]]
id = "dcc_suite_seed"
runtime = "kain"
entry = "src/main.kn"
depends_on = ["python_suite_bootstrap"]

[[steps.outputs]]
name = "scene_graph_document"
kind = "value"

[[steps.outputs]]
name = "asset_catalog_document"
kind = "value"

[[steps.outputs]]
name = "preview_src"
kind = "shared_buffer"

[[steps.outputs]]
name = "preview_dst"
kind = "shared_buffer"

[[steps.outputs]]
name = "preview_image"
kind = "shared_image"

[[steps.outputs]]
name = "tensor_features"
kind = "shared_buffer"

[[steps.outputs]]
name = "session_report"
kind = "value"

[[steps]]
id = "sim_tick_projection"
runtime = "kain"
entry = "src/sim_tick_projection.kn"
depends_on = ["python_suite_bootstrap", "dcc_suite_seed"]

[[steps.outputs]]
name = "sim_tick_plan"
kind = "value"

[[steps]]
id = "sim_solver_execute"
runtime = "kain"
entry = "src/sim_solver_step.kn"
depends_on = ["python_suite_bootstrap", "sim_tick_projection"]

[[steps.outputs]]
name = "sim_tick_report"
kind = "value"

[reports]
directory = ".kain/fabric/intents/sim_tick"
emit_jsonl_events = true
