version = 1

[workspace]
root = "."
search_roots = ["src", "scripts"]

[[requires]]
key = "session.local"
version = 1
optional = false

[[steps]]
id = "python_suite_bootstrap"
runtime = "python"
entry = "scripts/python_suite_bootstrap.py"

[[steps.outputs]]
name = "project_settings"
kind = "value"

[[steps]]
id = "dcc_suite_seed"
runtime = "kain"
entry = "src/main.kn"
depends_on = ["python_suite_bootstrap"]

[[steps.outputs]]
name = "session_report"
kind = "value"

[[steps]]
id = "compositor_projection"
runtime = "kain"
entry = "src/session_projection.kn"
depends_on = ["python_suite_bootstrap", "dcc_suite_seed"]

[[steps.outputs]]
name = "compositor_rebuild_plan"
kind = "value"

[[steps]]
id = "compositor_assembly"
runtime = "kain"
entry = "src/compositor_rebuild_step.kn"
depends_on = ["compositor_projection"]

[[steps.outputs]]
name = "compositor_rebuild_report"
kind = "value"

[reports]
directory = ".kain/fabric/intents/compositor_rebuild"
emit_jsonl_events = true
