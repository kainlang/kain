[package]
name = "kain-fabric-modeler"
version = "0.1.0"
authors = ["OpenAI Codex"]
description = "Fabric-first 3D modeling workbench for the Kain native-ui and native runtime lanes."

[build]
entry = "generated/main.generated.kn"
output = "outputs"
targets = ["run", "ks", "ts", "js", "hybrid"]

[runtime]
primary_app = "kain_fabric_modeler"
default_host = "native_ui"
workspace_manifest = "config/app_manifest.json"

[c_ffi]

[[c_ffi.libraries]]
name = "modeler_ops"
header = "native/modeler_ops.h"
shared_lib = "native/modeler_ops.dll"
[manifests]
app = "config/app_manifest.json"
surfaces = "config/surfaces.json"
workspace_modes = "config/workspace_modes.json"
library_catalog = "config/library_catalog.json"
tools = "config/tool_catalog.json"
command_registry = "config/command_registry.json"
fabric_pipeline = "config/fabric_pipeline.json"
fabric_intents = "config/fabric_intents.json"
resource_kinds = "config/resource_kinds.json"
session_schema = "session/session_schema.kn"
session_reducers = "session/reducers.kn"
session_derived_state = "session/derived_state.kn"
session_command_handlers = "session/command_handlers.kn"
session_intent_planner = "session/intent_planner.kn"
session_resource_registry = "session/resource_registry.kn"
session_report_registry = "session/report_registry.kn"

