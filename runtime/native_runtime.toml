# Runtime Version and ABI Metadata
# These values must match the constants defined in runtime/native/include/kain_runtime_version.h
[version]
runtime_major = 0
runtime_minor = 1
runtime_patch = 0
abi_major = 0
abi_minor = 1
abi_patch = 0

# Runtime Metadata
[metadata]
description = "KAIN native C runtime for compiled programs"
target_platforms = ["windows", "linux", "macos"]
active_platforms = ["windows", "linux"]  # Native core runtime currently compiles on Windows and Linux
runtime_lane = "raw-native"
compatibility_class = "experimental"  # experimental, stable, production

# Runtime Services Declaration
# These services are registered at runtime initialization and used for capability discovery
# Service keys must match the constants defined in runtime/native/include/kain_runtime_services.h
[[services]]
key = "base.memory"
name = "Base Memory Services"
provider = "native-core"
requirement = "required"
status = "available"
description = "Core allocation, retain/release, and memory management"

[[services]]
key = "base.diagnostics"
name = "Base Diagnostics"
provider = "native-core"
requirement = "required"
status = "available"
description = "Structured diagnostics and error reporting"

[[services]]
key = "contract"
name = "Runtime Contract"
provider = "native-core"
requirement = "required"
status = "available"
description = "Runtime contract bundle loading and validation"

[[services]]
key = "platform.app-host"
name = "Native App Host"
provider = "platform-win32"
requirement = "required"
status = "available"
platforms = ["windows"]
description = "Win32 application host and window management"

[[services]]
key = "platform.input"
name = "Native Input"
provider = "platform-win32"
requirement = "required"
status = "available"
platforms = ["windows"]
description = "Win32 input capture and event handling"

[[services]]
key = "gfx.viewport"
name = "Native Viewport"
provider = "platform-win32"
