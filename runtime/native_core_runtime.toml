[[services]]
key = "host.bridge"
name = "Host Bridge"
provider = "native-core"
requirement = "optional"
status = "available"
description = "Plugin and foreign service integration"

[[services]]
key = "platform.library"
name = "Native Dynamic Library Loader"
provider = "native-core"
requirement = "optional"
status = "available"
platforms = ["windows", "linux", "macos"]
description = "Raw platform dynamic library open/resolve/close substrate for generated typed platform packages; no generic public ABI call surface is exposed"

[link]
windows = ["legacy_stdio_definitions", "user32", "gdi32", "shell32", "ws2_32", "winhttp", "advapi32"]
linux = ["pthread", "dl", "rt", "m"]
macos = []
