name = "kain-native-core-runtime"

# Canonical production runtime manifest.
# This lane is intentionally vendor-free: no vendored source trees, no baked
# compatibility presenters, no OpenGL runtime host, and no hardcoded app/demo
# lanes. It keeps only the Kain-owned ABI floor, runtime services, and raw
# platform helpers needed by LLVM/direct-C/native builds.
sources = [
    "native/src/core/core.c",
    "native/src/core/crash_handler.c",
    "native/src/core/version.c",
    "native/src/core/diagnostics.c",
    "native/src/core/profile.c",
    "native/src/core/handle.c",
    "native/src/core/fixup.c",
    "native/src/core/services.c",
    "native/src/core/contract.c",
    "native/src/core/entangle.c",
    "native/src/core/event.c",
    "native/src/core/cpu.c",
    "native/src/core/converge.c",
    "native/src/core/simd.c",
    "native/src/core/wire.c",
    "native/src/core/json.c",
    "native/src/core/json_benchmark.c",
    "native/src/core/ray_sphere_benchmark.c",
    "native/src/core/machine_stones.c",
    "native/src/core/stdlib_abi.c",
    "native/src/core/input_system.c",
    "native/src/core/audio_system.c",
    "native/src/core/net_system.c",
    "native/src/core/process_system.c",
    "native/src/core/graphics_system.c",
    "native/src/core/renderer_backend.c",
    "native/src/core/renderer_session.c",
    "native/src/core/scene.c",
    "native/src/core/reflection.c",
    "native/src/core/realtime.c",
    "native/src/core/cuda_runtime.c",
    "native/src/core/attrition.c",
    "native/src/core/batch_queue.c",
    "native/src/core/async.c",
    "native/src/core/compatibility.c",
    "native/src/core/host_bridge.c",
    "native/src/core/interop_zero_copy.c",
    "native/src/core/interop_contracts.c",
    "native/src/core/python_runtime.c",
    "native/src/core/fanout.c",
    "native/src/core/arena.c",
    "native/src/core/buddy.c",
    "native/src/core/deferred_free.c",
    "native/src/core/memory.c",
    "native/src/core/ownership.c",
    "native/src/core/virtual_alloc.c",
    "native/src/core/bitfield.c",
    "native/src/core/union.c",
    "native/src/core/actor.c",
    "native/src/platform/platform.c",
    "native/src/platform/platform_library.c",
    "native/src/platform/os_system.c",
    "native/src/ui/ui_compiled_bundle.c",
    "native/src/ui/ui_system.c",
    "native/src/ui/ui_host_adapter.c",
    "native/src/ui/ui_runtime.c",
    "native/src/ui/ui_hot_reload.c",
]

windows_sources = [
    "native/src/platform/win32/kain_win32_app_host.c",
    "native/src/platform/win32/kain_win32_input_host.c",
    "native/src/platform/win32/win32_shared.c",
    "native/src/platform/win32/crash_handler_win32.c",
]

linux_sources = [
    "native/src/platform/linux/linux_shared.c",
    "native/src/platform/linux/crash_handler_linux.c",
]

macos_sources = [
    "native/src/platform/macos/macos_shared.c",
    "native/src/platform/macos/crash_handler_macos.c",
]

include_dirs = [
    "native/include",
]

windows_defines = [
    "WIN32_LEAN_AND_MEAN",
    "_WIN32_WINNT=0x0A00",
    "_CRT_DECLARE_NONSTDC_NAMES=0",
]

linux_defines = [
    "_GNU_SOURCE",
    "_POSIX_C_SOURCE=200112",
    "_FILE_OFFSET_BITS=64",
]

[version]
runtime_major = 0
runtime_minor = 1
runtime_patch = 0
abi_major = 0
abi_minor = 1
abi_patch = 0

[metadata]
description = "KAIN native C runtime for compiled programs"
target_platforms = ["windows", "linux", "macos"]
active_platforms = ["windows", "linux", "macos"]
runtime_lane = "raw-native"
compatibility_class = "experimental"

[[services]]
key = "base.memory"
name = "Base Memory Services"
provider = "native-core"
requirement = "required"
status = "available"
description = "Core allocation, retain/release, and memory management"

[[services]]
key = "memory.ownership"
name = "Ownership State Guards"
provider = "native-core"
requirement = "required"
status = "available"
description = "Native collapse/observe/decay guards for helper-owned heap regions and imported pointer lifetimes"

[[services]]
key = "memory.shared-fanout"
name = "Shared Fanout Runtime"
provider = "native-core"
requirement = "optional"
status = "available"
platforms = ["windows", "linux", "macos"]
description = "Native shared-memory fanout over real OS threads for compiler-owned share/fanout lowering"

[[services]]
key = "memory.atomic-seqcst"
name = "SeqCst Atomic Cells"
provider = "native-core"
requirement = "optional"
status = "available"
platforms = ["windows", "linux", "macos"]
description = "Canonical seq-cst atomic cell ABI for native shared-memory fanout and LLVM fallback surfaces"

[[services]]
key = "memory.volatile"
name = "Volatile Memory Cells"
provider = "native-core"
requirement = "optional"
status = "available"
platforms = ["windows", "linux", "macos"]
description = "Byte-exact volatile load/store ABI for MMIO and externally-observed memory"

[[services]]
key = "memory.atomic-v2"
name = "Ordered Atomic Cells"
provider = "native-core"
requirement = "optional"
status = "available"
platforms = ["windows", "linux", "macos"]
description = "Explicit memory-order atomic load/store/RMW/CAS/fence ABI including bitwise RMW operations"

[[services]]
key = "base.diagnostics"
name = "Base Diagnostics"
provider = "native-core"
requirement = "required"
status = "available"
description = "Structured diagnostics and error reporting"

[[services]]
key = "control.runtime-tiers"
name = "Runtime Control Tiers"
provider = "native-core"
requirement = "optional"
status = "available"
description = "Compile-time no-op, gated, and full-cost control tiers for diagnostics, profiling, and relocation bookkeeping"

[[services]]
key = "runtime.profile"
name = "Runtime Profiling Zones"
provider = "native-core"
requirement = "optional"
status = "available"
description = "Scoped push/pop profiling zones with compile-out tiers and fixed-cost native timing telemetry"

[[services]]
key = "memory.handles"
name = "Generation Tagged Runtime Handles"
provider = "native-core"
requirement = "optional"
status = "available"
description = "Index plus magic runtime handles for stale rejection across relocation and control-plane surfaces"

[[services]]
key = "memory.fixup"
name = "Relocation Fixup Registry"
provider = "native-core"
requirement = "optional"
status = "available"
description = "Known-ref registration, self-updating pointer patching, and handle-aware relocation tracking for helper-owned allocations"

[[services]]
key = "cpu.capabilities"
name = "Native CPU Capability Service"
provider = "native-core"
requirement = "optional"
status = "available"
description = "Runtime-published CPU feature bits for compiled converge selectors, including x86 AVX/AVX2/AVX-512 gates"

[[services]]
key = "machine.topology"
name = "Machine Topology And Affinity"
provider = "native-core"
requirement = "optional"
status = "available"
platforms = ["windows", "linux", "macos"]
description = "Native logical-CPU count, thread identity, and current-thread affinity controls for systems blades"

[[services]]
key = "machine.virtual-memory"
name = "Virtual Memory Pages"
provider = "native-core"
requirement = "optional"
status = "available"
platforms = ["windows", "linux", "macos"]
description = "Native page-size, map/unmap, and page-protection ABI for authored systems code"

[[services]]
key = "control.converge.autotune"
name = "Converge Lane Selector And Telemetry"
provider = "native-core"
requirement = "optional"
status = "available"
description = "Proof-bounded native converge lane selection, warm cache state, and fixed-ring telemetry for future silicon autotuning"

[[services]]
key = "machine.stones"
name = "Machine Stones Runtime"
provider = "native-core"
requirement = "optional"
status = "available"
description = "Native axiom predicates, pulse scheduler/snapshots, shatter SoA lane buffers, and teleport zero-copy handoff telemetry"

[[services]]
key = "data.json"
name = "Native JSON Runtime"
provider = "native-core"
requirement = "optional"
status = "available"
description = "Native JSON parse/render/object/array helpers for LLVM builtin calls over string, integer, boolean, null, object, and array values"

[[services]]
key = "interop.shared-contracts"
name = "Neutral Shared Buffer And Image Contracts"
provider = "native-core"
requirement = "optional"
status = "available"
description = "Runtime-owned shared buffer/image handles plus neutral info and byte snapshot lanes for Python, JS, GPU, and foreign host bridges"

[[services]]
key = "contract"
name = "Runtime Contract"
provider = "native-core"
requirement = "required"
status = "available"
description = "Runtime contract bundle loading and validation"

[[services]]
key = "platform.app-host"
name = "Native App Host"
provider = "platform-win32"
requirement = "required"
status = "available"
platforms = ["windows"]
description = "Raw Win32 app/window host substrate without baked presenters or app policy"

[[services]]
key = "platform.input"
name = "Native Input"
