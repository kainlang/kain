requirement = "required"
status = "available"
platforms = ["windows"]
description = "Canonical Kain input sessions, semantic actions, replay traces, and native platform event handling"

[[services]]
key = "gfx.viewport"
name = "Native Viewport"
provider = "platform-win32"
requirement = "optional"
status = "degraded"
platforms = ["windows"]
description = "Platform window handles and presenter attachment contract; concrete presenters now live in blades or packages"

[[services]]
key = "gfx.raw-native"
name = "Raw Native Graphics"
provider = "native-core"
requirement = "optional"
status = "available"
description = "Catalog-free graphics kernel for Kain-authored engines, buffers, SPIR-V modules, pipelines, and draw commands"

[[services]]
key = "gfx.shader.spirv"
name = "SPIR-V Shader Modules"
provider = "native-core"
requirement = "optional"
status = "available"
