[pack]
name = "stb-truetype"
scope = ".."
languages = ["c"]

[solver]
timeout_ms = 10000
size_bits = 64

[sources]
include = ["**/*"]
exclude = ["z3/**", "target/**", "node_modules/**"]

[templates]
use = ["builtin:*", "local:templates/*.yaml"]

[fixtures]
use = ["fixtures/**/*.*"]

[ci]
smoke = ["proofs/**/*.yaml"]
full = ["proofs/**/*.*"]

[reports]
path = "reports"
keep_history = true

[engines]

[engines.libclang]
compile_flags = []
include_paths = []
