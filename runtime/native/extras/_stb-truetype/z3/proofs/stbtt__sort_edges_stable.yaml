version: 1
id: stb-truetype.sort_edges_stable.valid_total_order
kind: find_counterexample
description: >
  The edge sort comparator STBTT__COMPARE(a,b) = (a)->y0 < (b)->y0 is a valid
  strict total order. It is irreflexive, asymmetric, and transitive. Edges
  with equal y0 values compare false both ways, enabling stable sorting that
  preserves their original relative order.
tags:
- stb_truetype
- rasterizer
- sorting
- comparator
- invariant
source:
  path: extras/_stb-truetype/stb_truetype.h
  language: c
  symbol: stbtt__sort_edges
  start_line: 3479
  end_line: 3483
  reason: >
    The sort comparator must define a valid total order for quicksort to
    partition correctly. Equal y0 edges must not receive arbitrary ordering,
    as the insertion sort pass preserves their original positions (stable sort).
