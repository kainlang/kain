version: 1
id: kain.native.core.proofs.actor_microcell_ready_state_is_exclusive
kind: find_counterexample
description: A microcell actor can be in the scheduler queue or owned by a worker
  turn, but never both. The ready path may enqueue only when both ownership bits
  are clear, preserving exclusive scheduler ownership.
