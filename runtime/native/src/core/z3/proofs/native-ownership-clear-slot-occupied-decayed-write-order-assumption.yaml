version: 1
id: kain.native.core.proofs.native_ownership_clear_slot_occupied_decayed_write_order_assumption
kind: check_smt2
description: Historical counterexample for the old slot-clear write order. Before
  the proactive reorder landed, the helper could temporarily publish
  OCCUPIED=1 and STATE=DECAYED at the same time, which was safe only because the
  registry stayed under a single lock.
tags:
- native-runtime
- ownership
- ordering
- decay
- historical-counterexample
source:
  path: D:\\Kain-Lang\\runtime\\native\\src\\core\\ownership.c
  symbol: kain_ownership_clear_slot_unlocked
  start_line: 226
  reason: Historical bug model for the pre-fix write order that published
    DECAYED before clearing occupied
case:
  smt2: |
    (set-logic QF_LIA)

    (define-fun DECAYED () Int 5)
    (declare-const occupied Int)
    (declare-const state Int)

    (assert (= occupied 1))
    (assert (= state DECAYED))

    (check-sat)
  include_model: true
  include_stats: false
