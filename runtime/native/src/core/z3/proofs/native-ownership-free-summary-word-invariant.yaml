version: 1
id: kain.native.core.proofs.native_ownership_free_summary_word_invariant
kind: check_smt2
description: >
  The occupancy-bitmap free_slot search in
  kain_ownership_find_free_slot scans up to 64 words looking for a
  word with at least one cleared bit. With a free_summary word
  (a 64-bit vector where bit i = 1 iff ~occupancy_words[i] != 0),
  the scan collapses to ctz(free_summary): one instruction on x86
  (TZCNT/BLSF) vs. up to 64 loop iterations. This proof shows:
    (1) The invariant definition is sound (bijection)
    (2) The alloc update rule preserves the invariant
    (3) The free update rule preserves the invariant
    (4) ctz(free_summary) via isolate-low-bit correctly identifies
        a word with a free slot
tags:
- native-runtime
- ownership
- occupancy
- summary-word
- bitset
- branchless
source:
  path: X:\runtime\native\src\core\ownership.c
  symbol: kain_ownership_find_free_slot
  reason: >
    find_free_slot scans up to 64 words (~4096/64) looking for any
    word with a cleared bit. A free_summary word turns this into
    a single ctz instruction, saving 2-64 loop iterations per alloc.
case:
  smt2: |
    ;
    ; =========================================================================
    ; OCCUPANCY FREE-SUMMARY WORD INVARIANT
    ;
    ; The occupancy bitmap uses 64 x 64-bit words covering 4096 slots.
    ; For each word i (0..63), the INVARIANT is:
    ;
    ;   free_summary bit i = 1  ⇔  ~occupancy_words[i] != 0
    ;   (i.e., word i has at least one free slot)
    ;
    ; The update rules that maintain this invariant:
    ;   ALLOC(slot):  occ[word] |= (1 << bit)
    ;     If occ[word] == ALL_ONES after set: free_summary &= ~(1 << word)
    ;
    ;   FREE(slot):   occ[word] &= ~(1 << bit)
    ;     If occ[word] == ALL_ONES before clear: free_summary |= (1 << word)
    ;
    ; This proof verifies that:
    ;   1. The invariant definition is logically sound
    ;   2. The ALLOC update preserves the invariant
    ;   3. The FREE update preserves the invariant
    ;   4. Finding a free slot via free_summary is correct
    ; =========================================================================

    ;
    ; =========================================================================
    ; CLAIM 1: Invariant definition is well-founded
    ; For any 64-bit word w: ~w != 0  ⇔  w != ALL_ONES
    ; (trivially true by bitwise NOT — proven for completeness)
    ; =========================================================================
    (set-logic QF_BV)

    (define-fun ALL_ONES () (_ BitVec 64) #xFFFFFFFFFFFFFFFF)
    (define-fun ZERO () (_ BitVec 64) #x0000000000000000)

    (declare-const w (_ BitVec 64))
    (assert (not (= (not (= w ALL_ONES))
                    (not (= (bvnot w) ZERO)))))
    (check-sat)
    (reset)

    ;
    ; =========================================================================
    ; CLAIM 2: ALLOC update preserves the invariant
    ;
    ; After setting bit k in word occ:
    ;   occ' = occ | (1 << k)
    ; If occ was not full but occ' is full, then ~occ' = 0 (summary bit = 0).
    ; =========================================================================
    (set-logic QF_BV)

    (define-fun ALL_ONES () (_ BitVec 64) #xFFFFFFFFFFFFFFFF)
    (define-fun ZERO () (_ BitVec 64) #x0000000000000000)

    (define-fun word_has_free ((w (_ BitVec 64))) Bool
      (not (= w ALL_ONES)))

    (declare-const occ (_ BitVec 64))
    (declare-const k (_ BitVec 64))
    (assert (bvult k #x0000000000000040))

    (define-fun bitmask () (_ BitVec 64)
      (bvshl #x0000000000000001 k))

    (define-fun occ_after_alloc () (_ BitVec 64)
      (bvor occ bitmask))

    (assert (not (=> (and (word_has_free occ)
                          (= occ_after_alloc ALL_ONES))
                     (= (bvnot occ_after_alloc) ZERO))))
    (check-sat)
    (reset)

    ;
    ; =========================================================================
    ; CLAIM 3: FREE update preserves the invariant
    ;
    ; Before clearing bit k from word occ:
    ;   occ' = occ & ~(1 << k)
    ; If occ was ALL_ONES before clear, then occ' != ALL_ONES,
    ; so ~occ' != 0 (summary bit must be set to 1).
    ; =========================================================================
    (set-logic QF_BV)

    (define-fun ALL_ONES () (_ BitVec 64) #xFFFFFFFFFFFFFFFF)
    (define-fun ZERO () (_ BitVec 64) #x0000000000000000)

    (declare-const occ (_ BitVec 64))
    (declare-const k (_ BitVec 64))
    (assert (bvult k #x0000000000000040))

    (define-fun bitmask () (_ BitVec 64)
      (bvshl #x0000000000000001 k))

    (define-fun occ_after_free () (_ BitVec 64)
      (bvand occ (bvnot bitmask)))

    ; If occ was all-ones before clearing a bit, ~occ_after_free must be non-zero
    (assert (not (=> (= occ ALL_ONES)
                     (not (= (bvnot occ_after_free) ZERO)))))
    (check-sat)
    (reset)

    ;
    ; =========================================================================
    ; CLAIM 4: Finding a free slot via free_summary is correct.
    ;
    ; If free_summary != 0, then:
    ;   (a) There exists at least one word with a free slot
    ;   (b) The lowest-set bit (fs & -fs) gives a valid word index
    ;
    ; We prove:
    ;   (4a) fs != 0 ⇒ (fs & -fs) != 0  [isolated low bit is non-zero]
    ;   (4b) fs != 0 ⇒ fs & (fs & -fs) = (fs & -fs)  [low bit is subset of fs]
    ;   (4c) For any word i where bit i is set in fs: occ_i != ALL_ONES
    ;        (i.e., word has a free slot — the defining invariant)
    ; =========================================================================

    ; --- Claim 4a: low_bit isolation is non-zero ---
    (set-logic QF_BV)
    (define-fun ZERO () (_ BitVec 64) #x0000000000000000)
    (declare-const fs (_ BitVec 64))

    (define-fun low_bit () (_ BitVec 64)
      (bvand fs (bvneg fs)))

    (assert (not (=> (not (= fs ZERO))
                     (not (= low_bit ZERO)))))
    (check-sat)
    (reset)

    ; --- Claim 4b: (fs & low_bit) = low_bit ---
    (set-logic QF_BV)
    (define-fun ZERO () (_ BitVec 64) #x0000000000000000)
    (declare-const fs (_ BitVec 64))

    (define-fun low_bit () (_ BitVec 64)
      (bvand fs (bvneg fs)))

    (assert (not (=> (not (= fs ZERO))
                     (= (bvand fs low_bit) low_bit))))
    (check-sat)
    (reset)

    ; --- Claim 4c: invariant connects summary bit to word state ---
    ; If bit i of free_summary is set, then ~occ_word_i != 0 (word has free slot)
    (set-logic QF_BV)
    (define-fun ZERO () (_ BitVec 64) #x0000000000000000)
    (define-fun ALL_ONES () (_ BitVec 64) #xFFFFFFFFFFFFFFFF)

    (declare-const fs (_ BitVec 64))
    (declare-const occ (_ BitVec 64))
    (declare-const i (_ BitVec 64))
    (assert (bvult i #x0000000000000040))

    (define-fun bit_mask () (_ BitVec 64)
      (bvshl #x0000000000000001 i))

    ; Invariant premise: summary bit for word i is set when ~occ != 0
    (assert (=> (not (= (bvand fs bit_mask) ZERO))
                (not (= occ ALL_ONES))))

    ; Prove: summary bit set ⇒ word has free slot
    (assert (not (=> (not (= (bvand fs bit_mask) ZERO))
                     (not (= (bvnot occ) ZERO)))))
    (check-sat)
  include_model: false
  include_stats: false
