version: 1
id: kain.native.core.proofs.native_memory_store_order_acquire_silently_downgrades_to_release
kind: check_smt2
description: Historical counterexample for the old plain-store ordering path.
  The runtime ABI helper historically accepted acquire and acq_rel on plain
  stores and silently canonicalized them to release without a diagnostic.
tags:
- native-runtime
- memory
- atomic
- store
- ordering
- historical-counterexample
source:
  path: D:\\Kain-Lang\\runtime\\native\\src\\core\\memory.c
  symbol: __kain_atomic_store_ordered
  start_line: 495
  reason: Historical bug model for the pre-diagnostic store ordering path that
    silently remapped acquire and acq_rel requests to release semantics
case:
  smt2: |
    (set-logic QF_LIA)

    (declare-const user_ordering Int)

    (define-fun RELAXED () Int 0)
    (define-fun ACQUIRE () Int 1)
    (define-fun RELEASE () Int 2)
    (define-fun ACQ_REL () Int 3)
    (define-fun SEQ_CST () Int 4)

    (define-fun store_mapping ((code Int)) Int
      (ite (= code RELAXED) RELAXED
      (ite (= code RELEASE) RELEASE
      (ite (= code ACQUIRE) RELEASE
      (ite (= code ACQ_REL) RELEASE
           SEQ_CST)))))

    (assert (= user_ordering ACQUIRE))
    (assert (not (= (store_mapping user_ordering) user_ordering)))

    (check-sat)
  include_model: true
  include_stats: false
