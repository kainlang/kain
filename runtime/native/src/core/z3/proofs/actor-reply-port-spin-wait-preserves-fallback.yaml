id: kain.native.core.proofs.actor_reply_port_spin_wait_preserves_fallback
kind: find_counterexample
description: >-
  The bounded reply-port spin is a pure fast path: if no reply is observed
  before or during the spin window, control must still enter the same blocking
  OS wait path used before the optimization.
