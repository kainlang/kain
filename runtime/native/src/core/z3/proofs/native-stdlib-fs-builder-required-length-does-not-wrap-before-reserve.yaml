      kind: int
  - name: additional
    sort:
      kind: int
  - name: size_max
    sort:
      kind: int
  constraints:
  - op: eq
    args:
    - size_max
    - 18446744073709551615
  - op: ge
    args:
    - length
    - 0
  - op: ge
    args:
    - additional
    - 0
  - op: le
    args:
    - length
    - size_max
  - op: le
    args:
    - additional
    - op: sub
      args:
      - op: sub
        args:
        - size_max
        - length
      - 1
  addends:
  - length
  - additional
  - 1
  size_bits: 64
  limit: size_max
