version: 1
id: kain.native.core.proofs.native_stdlib_fs_builder_required_length_does_not_wrap_before_reserve
kind: size_add_ok
description: The native stdlib text builder only computes length + additional + 1 after
  rejecting both the body growth sum and the trailing null-byte addition from wrapping
  size_t.
tags:
- native-runtime
- stdlib
- filesystem
- buffer-growth
source:
