version: 1
id: kain.native.core.proofs.native_map_linear_probe_empty_slot_precludes_later_match
kind: check_smt2
description: >
  The sequential prehashed map lookup may stop on the first empty slot because
  linear probing without tombstones cannot place the same key after an earlier
  empty slot in the probe order.
tags:
- native-runtime
- map
- lookup
- linear-probe
- early-exit
source:
  path: D:\\Kain-Lang\\runtime\\native\\src\\core\\core.c
  symbol: map_get_prehashed
  start_line: 1267
  reason: the new lookup fast path returns miss at the first empty slot instead of scanning the full table
case:
  smt2: |
    (set-logic QF_BV)

    (declare-fun o0 () (_ BitVec 64))
    (declare-fun o1 () (_ BitVec 64))
    (declare-fun o2 () (_ BitVec 64))
    (declare-fun o3 () (_ BitVec 64))
    (declare-fun o4 () (_ BitVec 64))
    (declare-fun o5 () (_ BitVec 64))
    (declare-fun o6 () (_ BitVec 64))
    (declare-fun o7 () (_ BitVec 64))
    (declare-fun m0 () (_ BitVec 64))
    (declare-fun m1 () (_ BitVec 64))
    (declare-fun m2 () (_ BitVec 64))
    (declare-fun m3 () (_ BitVec 64))
    (declare-fun m4 () (_ BitVec 64))
    (declare-fun m5 () (_ BitVec 64))
    (declare-fun m6 () (_ BitVec 64))
    (declare-fun m7 () (_ BitVec 64))

    (define-fun bit ((x (_ BitVec 64))) Bool
      (or (= x #x0000000000000000) (= x #x0000000000000001)))

    (assert (and (bit o0) (bit o1) (bit o2) (bit o3) (bit o4) (bit o5) (bit o6) (bit o7)))
    (assert (and (bit m0) (bit m1) (bit m2) (bit m3) (bit m4) (bit m5) (bit m6) (bit m7)))

    ; A key can match only in an occupied slot.
    (assert (=> (= m0 #x0000000000000001) (= o0 #x0000000000000001)))
    (assert (=> (= m1 #x0000000000000001) (= o1 #x0000000000000001)))
    (assert (=> (= m2 #x0000000000000001) (= o2 #x0000000000000001)))
    (assert (=> (= m3 #x0000000000000001) (= o3 #x0000000000000001)))
    (assert (=> (= m4 #x0000000000000001) (= o4 #x0000000000000001)))
    (assert (=> (= m5 #x0000000000000001) (= o5 #x0000000000000001)))
    (assert (=> (= m6 #x0000000000000001) (= o6 #x0000000000000001)))
    (assert (=> (= m7 #x0000000000000001) (= o7 #x0000000000000001)))

    ; Linear probing without tombstones: if the lookup key lives at slot i,
    ; every earlier slot in the probe order had to be occupied when inserted.
    (assert (=> (= m1 #x0000000000000001) (= o0 #x0000000000000001)))
    (assert (=> (= m2 #x0000000000000001) (and (= o0 #x0000000000000001) (= o1 #x0000000000000001))))
    (assert (=> (= m3 #x0000000000000001) (and (= o0 #x0000000000000001) (= o1 #x0000000000000001) (= o2 #x0000000000000001))))
    (assert (=> (= m4 #x0000000000000001) (and (= o0 #x0000000000000001) (= o1 #x0000000000000001) (= o2 #x0000000000000001) (= o3 #x0000000000000001))))
    (assert (=> (= m5 #x0000000000000001) (and (= o0 #x0000000000000001) (= o1 #x0000000000000001) (= o2 #x0000000000000001) (= o3 #x0000000000000001) (= o4 #x0000000000000001))))
    (assert (=> (= m6 #x0000000000000001) (and (= o0 #x0000000000000001) (= o1 #x0000000000000001) (= o2 #x0000000000000001) (= o3 #x0000000000000001) (= o4 #x0000000000000001) (= o5 #x0000000000000001))))
    (assert (=> (= m7 #x0000000000000001) (and (= o0 #x0000000000000001) (= o1 #x0000000000000001) (= o2 #x0000000000000001) (= o3 #x0000000000000001) (= o4 #x0000000000000001) (= o5 #x0000000000000001) (= o6 #x0000000000000001))))

    ; Search for a counterexample where an empty slot appears before a later match.
    (assert
      (or
        (and (= o0 #x0000000000000000) (or (= m1 #x0000000000000001) (= m2 #x0000000000000001) (= m3 #x0000000000000001) (= m4 #x0000000000000001) (= m5 #x0000000000000001) (= m6 #x0000000000000001) (= m7 #x0000000000000001)))
        (and (= o1 #x0000000000000000) (or (= m2 #x0000000000000001) (= m3 #x0000000000000001) (= m4 #x0000000000000001) (= m5 #x0000000000000001) (= m6 #x0000000000000001) (= m7 #x0000000000000001)))
        (and (= o2 #x0000000000000000) (or (= m3 #x0000000000000001) (= m4 #x0000000000000001) (= m5 #x0000000000000001) (= m6 #x0000000000000001) (= m7 #x0000000000000001)))
        (and (= o3 #x0000000000000000) (or (= m4 #x0000000000000001) (= m5 #x0000000000000001) (= m6 #x0000000000000001) (= m7 #x0000000000000001)))
        (and (= o4 #x0000000000000000) (or (= m5 #x0000000000000001) (= m6 #x0000000000000001) (= m7 #x0000000000000001)))
        (and (= o5 #x0000000000000000) (or (= m6 #x0000000000000001) (= m7 #x0000000000000001)))
        (and (= o6 #x0000000000000000) (= m7 #x0000000000000001))))

    (check-sat)
  include_model: false
  include_stats: false
