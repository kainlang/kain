version: 1
id: kain.native.core.proofs.native_graphics_probe_bounds_within_capacity
kind: check_smt2
description: >
  For every graphics table (sessions=16, buffers=4096, shaders=1024,
  meshes=2048, pipelines=1024, draw-commands=8192), a hash probe computed
  via the SplitMix-style mixer followed by a masked (hash + probe_step) & mask
  always produces a candidate index within [0, table_capacity - 1].
  This proves the probe can never address outside the table.
tags:
- native-runtime
- graphics
- hash-probe
- bounds
- splitmix
source:
  path: X:\runtime\native\src\core\graphics_system.c
  symbol: abi_graphics_find_session
  start_line: 243
  reason: >
    The proposed replacement for all five abi_graphics_find_* functions
    uses a hash-table with linear probe. The probe index is
    (mix_id(id) + probe_step) & (capacity - 1). This proof shows that
    this index is always within bounds for all graphics table sizes.
case:
  smt2: |
    (set-logic QF_BV)
    (declare-const id (_ BitVec 64))
    (declare-const probe (_ BitVec 64))

    ; SplitMix-style mixer (proven pattern from abi_net_mix_id)
    (define-fun mix0 () (_ BitVec 64)
      (bvxor id (bvlshr id #x000000000000001e)))
    (define-fun mix1 () (_ BitVec 64)
      (bvmul mix0 #xbf58476d1ce4e5b9))
    (define-fun mix2 () (_ BitVec 64)
      (bvxor mix1 (bvlshr mix1 #x000000000000001b)))
    (define-fun mix3 () (_ BitVec 64)
      (bvmul mix2 #x94d049bb133111eb))
    (define-fun mixed () (_ BitVec 64)
      (bvxor mix3 (bvlshr mix3 #x000000000000001f)))

    ; Table-specific masks (capacity - 1) — all capacities are powers of 2
    (define-fun sessions_mask () (_ BitVec 64) #x000000000000000f)   ; 16 - 1
    (define-fun buffers_mask () (_ BitVec 64) #x0000000000000fff)     ; 4096 - 1
    (define-fun shaders_mask () (_ BitVec 64) #x00000000000003ff)     ; 1024 - 1
    (define-fun meshes_mask () (_ BitVec 64) #x00000000000007ff)      ; 2048 - 1
    (define-fun pipelines_mask () (_ BitVec 64) #x00000000000003ff)   ; 1024 - 1
    (define-fun draw_commands_mask () (_ BitVec 64) #x0000000000001fff) ; 8192 - 1

    ; Probe: (hash + step) & mask  — candidate is always ≤ mask
    (define-fun candidate ((mask (_ BitVec 64))) (_ BitVec 64)
      (bvand (bvadd mixed probe) mask))

    ; If unsat: no candidate exceeds its mask for ANY id or probe step
    (assert (or
      (bvugt (candidate sessions_mask) sessions_mask)
      (bvugt (candidate buffers_mask) buffers_mask)
      (bvugt (candidate shaders_mask) shaders_mask)
      (bvugt (candidate meshes_mask) meshes_mask)
      (bvugt (candidate pipelines_mask) pipelines_mask)
      (bvugt (candidate draw_commands_mask) draw_commands_mask)))
    (check-sat)
  include_model: false
  include_stats: false
