version: 1
id: kain.native.core.proofs.crash-handler-binary-search-bounds
kind: check_smt2
description: >
  Proves that the binary search in lookup_crash_entry always produces a
  valid table index. The search maintains lo <= hi as a loop invariant,
  keeps lo and hi within [0, crash_table_count] at all times, guarantees
  that lo-1 is a valid index when lo > 0, and proves the interval strictly
  shrinks each iteration (termination guarantee).
tags:
- native-runtime
- crash-handler
- binary-search
source:
  path: X:\runtime\native\src\core\crash_handler.c
  symbol: lookup_crash_entry (static)
  start_line: 24
  reason: >
    The binary search is the core of crash-time symbol resolution. Every
    callstack frame during crash reporting triggers one binary search. If
    the search produces an out-of-bounds index, the crash handler itself
    would crash, hiding the root cause. Proving lo-1 < crash_table_count
    when lo > 0 ensures the final &__kain_crash_table[lo-1] dereference
    is always safe.
case:
  smt2: |
    (set-logic QF_BV)

    ; ── 64-bit bitvector model of size_t ──
    (declare-const lo (_ BitVec 64))
    (declare-const hi (_ BitVec 64))
    (declare-const count (_ BitVec 64))

    ; Preconditions: lo=0, hi=count, 0 < count <= 4096
    ; (the function returns NULL early when count==0, so count > 0 here)
    (assert (= lo (_ bv0 64)))
    (assert (bvugt count (_ bv0 64)))
    (assert (bvule count (_ bv4096 64)))
    (assert (= hi count))

    ; Midpoint calculation (overflow-safe form)
    (define-fun diff () (_ BitVec 64) (bvsub hi lo))
    (define-fun half () (_ BitVec 64) (bvlshr diff (_ bv1 64)))
    (define-fun mid () (_ BitVec 64) (bvadd lo half))

    ; Branch outcomes
    ; Branch A (fn_ptr[mid] <= ip_val): lo' = mid + 1
    (define-fun lo_A () (_ BitVec 64) (bvadd mid (_ bv1 64)))
    ; Branch B (fn_ptr[mid] > ip_val): hi' = mid
    (define-fun hi_B () (_ BitVec 64) mid)

    ; Claim 1: mid is always in [lo, hi) — the search range
    (push)
    (assert (not (and (bvuge mid lo) (bvult mid hi))))
    (check-sat)
    (pop)
    ; Expected: unsat ✓

    ; Claim 2: Branch A preserves lo <= hi invariant
    (push)
    (assert (not (bvule lo_A hi)))
    (check-sat)
    (pop)
    ; Expected: unsat ✓

    ; Claim 3: Branch B preserves lo <= hi invariant
    (push)
    (assert (not (bvule lo hi_B)))
    (check-sat)
    (pop)
    ; Expected: unsat ✓

    ; Claim 4: Branch A result stays within [0, count]
    (push)
    (assert (not (bvule lo_A count)))
    (check-sat)
    (pop)
    ; Expected: unsat ✓

    ; Claim 5: Branch B result stays within [0, count]
    (push)
    (assert (not (bvule hi_B count)))
    (check-sat)
    (pop)
    ; Expected: unsat ✓

    ; Claim 6: lo-1 is a valid table index when lo > 0
    (push)
    (declare-const lo_final (_ BitVec 64))
    (assert (bvugt lo_final (_ bv0 64)))
    (assert (bvule lo_final count))
    (assert (not (bvule (bvsub lo_final (_ bv1 64)) (bvsub count (_ bv1 64)))))
    (check-sat)
    (pop)
    ; Expected: unsat ✓  (lo-1 < count, so &__kain_crash_table[lo-1] is safe)

    ; Claim 7: Interval shrinks under Branch A
    (push)
    (declare-const diff_init (_ BitVec 64))
    (declare-const diff_fin_A (_ BitVec 64))
    (assert (= diff_init (bvsub hi lo)))
    (assert (bvugt diff_init (_ bv1 64)))
    (assert (= diff_fin_A (bvsub hi lo_A)))
    (assert (not (bvult diff_fin_A diff_init)))
    (check-sat)
    (pop)
    ; Expected: unsat ✓

    ; Claim 8: Interval shrinks under Branch B
    (push)
    (declare-const diff_init2 (_ BitVec 64))
    (declare-const diff_fin_B (_ BitVec 64))
    (assert (= diff_init2 (bvsub hi lo)))
    (assert (bvugt diff_init2 (_ bv1 64)))
    (assert (= diff_fin_B (bvsub hi_B lo)))
    (assert (not (bvult diff_fin_B diff_init2)))
    (check-sat)
    (pop)
    ; Expected: unsat ✓
  include_model: false
  include_stats: false
