version: 1
id: kain.native.core.proofs.native_buddy_log2_clz_equivalence
kind: check_smt2
description: >
  The while-loop in kain_buddy_log2_exact can be replaced by
  31 - __builtin_clz(value) for all power-of-two inputs. And
  kain_buddy_required_height can be computed as
  32 - __builtin_clz(unit_count - 1) for unit_count > 1.
  Together these collapse a loop of up to 32 iterations into
  2-3 instructions on every buddy alloc/free.
tags:
- native-runtime
- memory
- buddy
- clz
- branchless
source:
  path: X:\runtime\native\src\core\buddy.c
  symbol: kain_buddy_log2_exact / kain_buddy_required_height
  reason: >
    Every buddy alloc and free calls both functions. The while-loop in
    log2_exact iterates up to 32 times per call. Replacing with CLZ
    eliminates the loop entirely on x86 (LZCNT) and ARM (CLZ).
case:
  smt2: |
    ;
    ; =========================================================================
    ; CLAIM 1: For all 32 power-of-two values v (1, 2, 4, ..., 2^31),
    ;   log2_exact(v) = 31 - clz(v)
    ;
    ; The log2_exact while-loop for v = 2^k shifts right k times then exits
    ; with height = k. CLZ(2^k) = 31 - k, so 31 - CLZ(v) = k = log2_exact(v).
    ;
    ; Verified by checking each of the 32 possible power-of-two values.
    ; =========================================================================
    (set-logic QF_BV)

    (define-fun clz32 ((x (_ BitVec 32))) (_ BitVec 32)
      (ite (bvuge x #x80000000) #x00000000
      (ite (bvuge x #x40000000) #x00000001
      (ite (bvuge x #x20000000) #x00000002
      (ite (bvuge x #x10000000) #x00000003
      (ite (bvuge x #x08000000) #x00000004
      (ite (bvuge x #x04000000) #x00000005
      (ite (bvuge x #x02000000) #x00000006
      (ite (bvuge x #x01000000) #x00000007
      (ite (bvuge x #x00800000) #x00000008
      (ite (bvuge x #x00400000) #x00000009
      (ite (bvuge x #x00200000) #x0000000a
      (ite (bvuge x #x00100000) #x0000000b
      (ite (bvuge x #x00080000) #x0000000c
      (ite (bvuge x #x00040000) #x0000000d
      (ite (bvuge x #x00020000) #x0000000e
      (ite (bvuge x #x00010000) #x0000000f
      (ite (bvuge x #x00008000) #x00000010
      (ite (bvuge x #x00004000) #x00000011
      (ite (bvuge x #x00002000) #x00000012
      (ite (bvuge x #x00001000) #x00000013
      (ite (bvuge x #x00000800) #x00000014
      (ite (bvuge x #x00000400) #x00000015
      (ite (bvuge x #x00000200) #x00000016
      (ite (bvuge x #x00000100) #x00000017
      (ite (bvuge x #x00000080) #x00000018
      (ite (bvuge x #x00000040) #x00000019
      (ite (bvuge x #x00000020) #x0000001a
      (ite (bvuge x #x00000010) #x0000001b
      (ite (bvuge x #x00000008) #x0000001c
      (ite (bvuge x #x00000004) #x0000001d
      (ite (bvuge x #x00000002) #x0000001e
      (ite (bvuge x #x00000001) #x0000001f
      #x00000020)))))))))))))))))))))))))))))))))

    (define-fun log2_by_clz ((v (_ BitVec 32))) (_ BitVec 32)
      (bvsub #x0000001f (clz32 v)))

    (assert (not (and
      (= (log2_by_clz #x00000001) #x00000000)
      (= (log2_by_clz #x00000002) #x00000001)
      (= (log2_by_clz #x00000004) #x00000002)
      (= (log2_by_clz #x00000008) #x00000003)
      (= (log2_by_clz #x00000010) #x00000004)
      (= (log2_by_clz #x00000020) #x00000005)
      (= (log2_by_clz #x00000040) #x00000006)
      (= (log2_by_clz #x00000080) #x00000007)
      (= (log2_by_clz #x00000100) #x00000008)
      (= (log2_by_clz #x00000200) #x00000009)
      (= (log2_by_clz #x00000400) #x0000000a)
      (= (log2_by_clz #x00000800) #x0000000b)
      (= (log2_by_clz #x00001000) #x0000000c)
      (= (log2_by_clz #x00002000) #x0000000d)
      (= (log2_by_clz #x00004000) #x0000000e)
      (= (log2_by_clz #x00008000) #x0000000f)
      (= (log2_by_clz #x00010000) #x00000010)
      (= (log2_by_clz #x00020000) #x00000011)
      (= (log2_by_clz #x00040000) #x00000012)
      (= (log2_by_clz #x00080000) #x00000013)
      (= (log2_by_clz #x00100000) #x00000014)
      (= (log2_by_clz #x00200000) #x00000015)
      (= (log2_by_clz #x00400000) #x00000016)
      (= (log2_by_clz #x00800000) #x00000017)
      (= (log2_by_clz #x01000000) #x00000018)
      (= (log2_by_clz #x02000000) #x00000019)
      (= (log2_by_clz #x04000000) #x0000001a)
      (= (log2_by_clz #x08000000) #x0000001b)
      (= (log2_by_clz #x10000000) #x0000001c)
      (= (log2_by_clz #x20000000) #x0000001d)
      (= (log2_by_clz #x40000000) #x0000001e)
      (= (log2_by_clz #x80000000) #x0000001f)
    )))
    (check-sat)

    (reset)

    ;
    ; =========================================================================
    ; CLAIM 2: For all 32-bit n,
    ;   required_height(n) = n <= 1 ? 0 : 32 - clz(n - 1)
    ;
    ; Proof uses a symbolic free variable (n) with the solver proving
    ; equivalence across ALL 2^32 possible values — not enumeration.
    ; 
    ; The ceil_log2 ite-chain models the while-loop body:
    ;   rounded_units = 1; height = 0;
    ;   while (rounded_units < n) { rounded_units <<= 1; height++; }
    ;   return height;
    ; =========================================================================

    (set-logic QF_BV)

    (define-fun clz32 ((x (_ BitVec 32))) (_ BitVec 32)
      (ite (bvuge x #x80000000) #x00000000
      (ite (bvuge x #x40000000) #x00000001
      (ite (bvuge x #x20000000) #x00000002
      (ite (bvuge x #x10000000) #x00000003
      (ite (bvuge x #x08000000) #x00000004
      (ite (bvuge x #x04000000) #x00000005
      (ite (bvuge x #x02000000) #x00000006
      (ite (bvuge x #x01000000) #x00000007
      (ite (bvuge x #x00800000) #x00000008
      (ite (bvuge x #x00400000) #x00000009
      (ite (bvuge x #x00200000) #x0000000a
      (ite (bvuge x #x00100000) #x0000000b
      (ite (bvuge x #x00080000) #x0000000c
      (ite (bvuge x #x00040000) #x0000000d
      (ite (bvuge x #x00020000) #x0000000e
      (ite (bvuge x #x00010000) #x0000000f
      (ite (bvuge x #x00008000) #x00000010
      (ite (bvuge x #x00004000) #x00000011
      (ite (bvuge x #x00002000) #x00000012
      (ite (bvuge x #x00001000) #x00000013
      (ite (bvuge x #x00000800) #x00000014
      (ite (bvuge x #x00000400) #x00000015
      (ite (bvuge x #x00000200) #x00000016
      (ite (bvuge x #x00000100) #x00000017
      (ite (bvuge x #x00000080) #x00000018
      (ite (bvuge x #x00000040) #x00000019
      (ite (bvuge x #x00000020) #x0000001a
      (ite (bvuge x #x00000010) #x0000001b
      (ite (bvuge x #x00000008) #x0000001c
      (ite (bvuge x #x00000004) #x0000001d
      (ite (bvuge x #x00000002) #x0000001e
      (ite (bvuge x #x00000001) #x0000001f
      #x00000020)))))))))))))))))))))))))))))))))

    (define-fun ceil_log2 ((n (_ BitVec 32))) (_ BitVec 32)
      (ite (bvule n #x00000001) #x00000000
      (ite (bvule n #x00000002) #x00000001
      (ite (bvule n #x00000004) #x00000002
      (ite (bvule n #x00000008) #x00000003
      (ite (bvule n #x00000010) #x00000004
      (ite (bvule n #x00000020) #x00000005
      (ite (bvule n #x00000040) #x00000006
      (ite (bvule n #x00000080) #x00000007
      (ite (bvule n #x00000100) #x00000008
      (ite (bvule n #x00000200) #x00000009
      (ite (bvule n #x00000400) #x0000000a
      (ite (bvule n #x00000800) #x0000000b
      (ite (bvule n #x00001000) #x0000000c
      (ite (bvule n #x00002000) #x0000000d
      (ite (bvule n #x00004000) #x0000000e
      (ite (bvule n #x00008000) #x0000000f
      (ite (bvule n #x00010000) #x00000010
      (ite (bvule n #x00020000) #x00000011
      (ite (bvule n #x00040000) #x00000012
      (ite (bvule n #x00080000) #x00000013
      (ite (bvule n #x00100000) #x00000014
      (ite (bvule n #x00200000) #x00000015
      (ite (bvule n #x00400000) #x00000016
      (ite (bvule n #x00800000) #x00000017
      (ite (bvule n #x01000000) #x00000018
      (ite (bvule n #x02000000) #x00000019
      (ite (bvule n #x04000000) #x0000001a
      (ite (bvule n #x08000000) #x0000001b
      (ite (bvule n #x10000000) #x0000001c
      (ite (bvule n #x20000000) #x0000001d
      (ite (bvule n #x40000000) #x0000001e
      (ite (bvule n #x80000000) #x0000001f
      #x00000020)))))))))))))))))))))))))))))))))

    (define-fun required_height_clz ((n (_ BitVec 32))) (_ BitVec 32)
      (ite (bvule n #x00000001)
           #x00000000
           (bvsub #x00000020 (clz32 (bvsub n #x00000001)))))

    (declare-const n (_ BitVec 32))
    (assert (not (= (ceil_log2 n) (required_height_clz n))))
    (check-sat)
  include_model: false
  include_stats: false
