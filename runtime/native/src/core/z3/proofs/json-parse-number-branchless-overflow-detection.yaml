version: 1
id: kain.native.core.proofs.json_parse_number_branchless_overflow_detection
kind: check_smt2
description: >
  json.c:878 json_parse_number() currently calls strtoll() then conditionally
  strtod(), double-traversing the digit string. This proof validates a
  branchless inline integer parser with overflow detection that can replace
  strtoll for the common integer-only case.

  The branchless parser processes digits left-to-right:
    uint64_t value = 0;
    while (isdigit(*scan)) {
      uint64_t digit = *scan++ - '0';
      if (value > UINT64_MAX / 10 ||
          (value == UINT64_MAX / 10 && digit > 5)) {
        // Overflow would occur
        return fallback_to_strtoll;
      }
      value = value * 10 + digit;
    }

  This proof proves that the overflow detection predicate
    overflow(value, digit) := value > UINT64_MAX/10 OR
                              (value == UINT64_MAX/10 AND digit > 5)
  is correct for all uint64 inputs: if the predicate is false, then
  value * 10 + digit does NOT overflow uint64; if the predicate is true,
  then value * 10 + digit WOULD overflow uint64.

  Additional proof: a 20-digit input string of all '9's produces a value
  that exceeds UINT64_MAX, so the overflow guard correctly catches it
  and falls back to strtoll/strtod. 19-digit inputs of all '9's
  (18446744073709551615 = UINT64_MAX) are the max safe value.

  UINT64_MAX = 0xFFFFFFFFFFFFFFFF
  UINT64_MAX / 10 = 0x1999999999999999 = 1844674407370955161
  UINT64_MAX % 10 = 5
tags:
- native-runtime
- json
- parsing
- overflow
- performance
source:
  path: X:\runtime\native\src\core\json.c
  symbol: json_parse_number
  reason: >
    Every numeric JSON value calls strtoll/strtod, which are libc functions
    that re-traverse the string. A branchless inline parser with proven
    overflow detection eliminates strtoll for the common integer-only case
    (~85% of JSON numbers), saving the libc call overhead and string re-scan.
case:
  smt2: |
    ; Proof: The overflow predicate
    ;   overflow(v, d) := v > UINT64_MAX/10 OR (v == UINT64_MAX/10 AND d > 5)
    ; correctly detects all uint64 overflow cases for v = v * 10 + d
    ;
    ; where v is [0, UINT64_MAX], d is [0, 9] (a single decimal digit).
    ;
    ; We prove: overflow(v, d) iff v * 10 + d > UINT64_MAX

    (set-logic QF_BV)

    ; Constants
    (define-fun U64_MAX () (_ BitVec 64) #xffffffffffffffff)
    (define-fun U64_MAX_DIV_10 () (_ BitVec 64) #x1999999999999999)
    (define-fun U64_MAX_MOD_10 () (_ BitVec 64) #x0000000000000005)
    (define-fun TEN () (_ BitVec 64) #x000000000000000a)

    ; Declare variables
    (declare-const v (_ BitVec 64))
    (declare-const d (_ BitVec 64))

    ; Constraint: d is a valid decimal digit 0-9
    (assert (bvult d #x000000000000000a))

    ; The overflow predicate: v > U64_MAX/10 || (v == U64_MAX/10 && d > 5)
    (define-fun overflow_pred () Bool
      (or (bvugt v U64_MAX_DIV_10)
          (and (= v U64_MAX_DIV_10) (bvugt d U64_MAX_MOD_10))))

    ; The correct mathematical condition for overflow:
    ;   v * 10 + d > UINT64_MAX
    ;   <=> v * 10 > UINT64_MAX - d
    ;   <=> v > (UINT64_MAX - d) / 10
    ;   (integer division, exact since v and d are integers)
    ; This is the reference against which we compare overflow_pred.
    (define-fun correct_overflow () Bool
      (bvugt v (bvudiv (bvsub U64_MAX d) TEN)))

    ; Prove: overflow_pred == correct_overflow for all valid inputs
    ; Assert negation: there exists v, d where they disagree
    (assert (not (= overflow_pred correct_overflow)))

    (check-sat)
  include_model: false
  include_stats: false
