version: 1
id: kain.native.core.proofs.native_services_commit_gate_prevents_slot_overwrite
kind: check_smt2
description: The service registry mutation gate serializes successful registrations so slot claims stay distinct and the published count cannot lose an increment.
tags:
- native-runtime
- services
- registry
- atomic-gate
- lost-update
source:
  path: D:\Kain-Lang\runtime\native\src\core\services.c
  symbol: kain_service_registry_commit_descriptor_unlocked
  start_line: 288
  reason: Writers commit inside a serialized mutation gate and publish service_count only after a descriptor slot is fully populated.
case:
  smt2: |
    (set-logic ALL)

    (declare-const order_ab Bool)
    (declare-const initial_count Int)

    (assert (>= initial_count 0))
    (assert (< initial_count 63))

    (define-fun advance ((count Int)) Int
      (+ count 1))

    (define-fun state_after_first () Int
      (advance initial_count))

    (define-fun slot_a () Int
      (ite order_ab initial_count state_after_first))

    (define-fun slot_b () Int
      (ite order_ab state_after_first initial_count))

    (define-fun final_count () Int
      (advance state_after_first))

    ; Violation query: serialized writers still collide or lose a count increment.
    (assert
      (or
        (not (= final_count (+ initial_count 2)))
        (= slot_a slot_b)))
    (check-sat)
  include_model: false
  include_stats: false
