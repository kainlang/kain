name: native-map-tiny-rebuild-fingerprint-mul-bounded
surface: runtime
subsystem: core
source_file: runtime/native/src/core/core.c
source_function: kain_map_rebuild_tiny_dispatch
source_lines: "2574"

description: |
  core.c:2574:
    base_seed = kain_mix_u64(
        fingerprints[0] ^
        ((uint64_t)occupied_count * 0x94d049bb133111ebULL) ^
        map->mask
    ) | 1u;

  `occupied_count` is bounded by KAIN_MAP_TINY_MAX_COUNT (4). The function
  has an explicit guard at line 2555:
    if (occupied_count >= KAIN_MAP_TINY_MAX_COUNT) { return; }

  The multiplication `occupied_count * 0x94d049bb133111eb` for occupied_count=4
  does wrap: 4 * 0x94d049bb133111eb = 0x2534126ecc4c47ac which exceeds 2^64.
  However, this is a **hash mixing step** — the product is XOR'd with other
  values and passed to `kain_mix_u64()`. The wrapping is intentional and
  harmless; hash functions routinely rely on wrapping multiplication for
  bit diffusion.

  This is NOT a bug. The arithmetic site is safe because:
  1. occupied_count is bounded by 4 (guard at line 2555)
  2. The result is used only for hash mixing (XOR + mix_u64)
  3. No memory allocation or buffer index depends on the wrapped value

claim: |
  The multiplication wrap at line 2574 exists but is intentional hash mixing
  and does NOT cause incorrect behavior.

expected: sat (wrap exists but is harmless)

smt2: |
  (set-logic QF_BV)
  (declare-const occupied_count (_ BitVec 64))
  ; 0 <= occupied_count <= 4 (bounded by KAIN_MAP_TINY_MAX_COUNT)
  (assert (bvule occupied_count #x0000000000000004))
  ; 0x94d049bb133111eb
  (define-fun magic () (_ BitVec 64) #x94d049bb133111eb)
  ; product = occupied_count * magic
  (define-fun product () (_ BitVec 64) (bvmul occupied_count magic))
  ; Show that for occupied_count = 4, the product wraps
  (assert (= occupied_count #x0000000000000004))
  ; product is less than magic, indicating wrap
  (assert (bvult product magic))
  (check-sat)

result: sat
witness:
  occupied_count: "4"
  magic: "0x94d049bb133111eb"
  product: "0x2534126ecc4c47ac"
  verdict: "NOT A BUG — wrapping is intentional hash mixing"
  reason: |
    The multiplication feeds into a hash seed computation (XOR + kain_mix_u64).
    Wrapping multiplication is standard practice in hash functions for
    bit diffusion (see Wang hash, MurmurHash, etc.). No allocation or
    buffer index depends on this value.

severity: Info
categories: [proof, bounds, map, safe-by-design]
status: Verified-Safe
suggested_follow_up: |
  No fix needed. The guard at line 2555 (occupied_count >= KAIN_MAP_TINY_MAX_COUNT)
  already bounds occupied_count to 4. The wrapping multiplication is intentional
  hash mixing. If desired, add a comment at line 2574:
    /* Intentional wrapping hash mixing — not a bug. */
