version: 1
id: kain.native.core.proofs.native_stdlib_patch_journal_concurrent_slot_overwrite
kind: check_smt2
description: Patch-journal recording is unsynchronized, so two concurrent successful records can claim the same journal slot and collapse two logical increments into one.
tags:
- native-runtime
- stdlib
- patch
- journal
- race
- lost-update
source:
  path: D:\Kain-Lang\runtime\native\src\core\stdlib_abi.c
  symbol: abi_patch_record_i64
  start_line: 1191
  reason: The function selects g_kain_native_patch_journal[g_kain_native_patch_journal_count] and then increments g_kain_native_patch_journal_count without any lock or atomic primitive around the full record sequence.
case:
  smt2: |
    (set-logic ALL)

    (declare-const initial_count Int)
    (declare-const read_a Int)
    (declare-const read_b Int)
    (declare-const a_writes_last Bool)

    ; There is room for two sequential successful appends.
    (assert (>= initial_count 0))
    (assert (< initial_count 255))

    ; Two concurrent calls read the same shared count before either publishes.
    (assert (= read_a initial_count))
    (assert (= read_b initial_count))

    (define-fun slot_a () Int read_a)
    (define-fun slot_b () Int read_b)
    (define-fun next_a () Int (+ read_a 1))
    (define-fun next_b () Int (+ read_b 1))
    (define-fun final_count () Int
      (ite a_writes_last next_a next_b))

    ; Safety contract: if both calls succeed, they must land on distinct slots
    ; and advance the shared count by two.
    (define-fun safety_invariant ((count Int) (left_slot Int) (right_slot Int)) Bool
      (and (= count (+ initial_count 2))
           (not (= left_slot right_slot))))

    (assert (not (safety_invariant final_count slot_a slot_b)))
    (check-sat)
  include_model: true
  include_stats: false
