version: 1
id: kain.native.core.proofs.json_object_get_value_hash_prefilter
kind: check_smt2
description: >
  json.c:501 json_object_get_value() does a linear scan with strcmp on every
  field lookup (called by json_get, json_get_int, json_get_string, json_get_float,
  json_get_bool, json_has). This proof shows that the 23 field-name strings
  used across the runtime (interop_contracts.c, python_runtime_async.c) have
  distinct 64-bit hashes under the reflection magic polynomial
  0x64170d358aa115a1, enabling a hash pre-filter: precompute and store the hash
  of each field key at json_object_set_value time, then compare stored hashes
  first (64-bit integer comparison, ~3 cycles) and only fall back to strcmp
  on full hash match. With these 23 distinct full hashes, hash-match implies
  key-match for the runtime's own field set, eliminating strcmp entirely on
  the lookup hot path.

  Optimization: Add uint64_t key_hash field to KainJsonEntry. In
  json_object_set_value, compute hash via reflection_token_state16()
  (already proven in the runtime). In json_object_get_value, compute
  query_hash once, then for each field: if (entry->key_hash != query_hash)
  continue; return entry->value. The strcmp fallback remains for safety
  against adversarial keys (collisions in 64-bit space are possible in
  theory, omitted by this proof for the closed runtime field set).
tags:
- native-runtime
- json
- hash
- performance
source:
  path: X:\runtime\native\src\core\json.c
  symbol: json_object_get_value
  reason: >
    Hot-path function called by every json_get, json_get_int, json_get_string,
    json_get_float, json_get_bool, json_has. Replacing strcmp-with-every-field
    with hash pre-filter eliminates O(n) strcmp overhead on every access.
case:
  smt2: |
    ; Proof: 23 runtime field-name strings produce distinct 64-bit hashes
    ; under the reflection magic polynomial 0x64170d358aa115a1.
    ;
    ; The hash function (reflection_token_state16 in reflection.c:1061):
    ;   lo = first 8 bytes of name (little-endian), padded with zeros
    ;   hi = bytes 8-15 (little-endian), padded with zeros
    ;   folded0 = (lo ^ length) * 0x64170d358aa115a1
    ;   folded1 = (hi ^ rotl64(0x64170d358aa115a1, 17)) * 0x9e3779b97f4a7c15
    ;   folded2 = ((lo >> 7) ^ (hi << 11) ^ 0xbf58476d1ce4e5b9) * 0xd6e8feb86659fd93
    ;   state = folded0 ^ folded1 ^ folded2
    ;   result = ((state ^ (state >> 33)) * 0xff51afd7ed558ccd) ^ (state >> 29)
    ;
    ; Pre-computed from the C function reflection_token_state16.
    (set-logic QF_BV)

    ; --- 23 runtime field-name hashes (pre-computed via reflection_token_state16) ---
    ; "contract_version"     lo=0x74636172746e6f63 hi=0x6e6f69737265765f len=16 state=0x35a654d2b7ec8f75
    (define-fun f_contract_version () (_ BitVec 64) #x35a654d2b7ec8f75)
    ; "element_size"         lo=0x5f746e656d656c65 hi=0x00000000657a6973 len=12 state=0xb01ca770ed54e12c
    (define-fun f_element_size () (_ BitVec 64) #xb01ca770ed54e12c)
    ; "shape"                lo=0x0000006570616873 hi=0x0000000000000000 len=5  state=0xd340b5bf993039fb
    (define-fun f_shape () (_ BitVec 64) #xd340b5bf993039fb)
    ; "strides"              lo=0x0073656469727473 hi=0x0000000000000000 len=7  state=0x5f23226242354718
    (define-fun f_strides () (_ BitVec 64) #x5f23226242354718)
    ; "labels"               lo=0x0000736c6562616c hi=0x0000000000000000 len=6  state=0x112b341923588144
    (define-fun f_labels () (_ BitVec 64) #x112b341923588144)
    ; "byte_length"          lo=0x6e656c5f65747962 hi=0x0000000000687467 len=11 state=0x91cfa64194e2b8cc
    (define-fun f_byte_length () (_ BitVec 64) #x91cfa64194e2b8cc)
    ; "element_count"        lo=0x5f746e656d656c65 hi=0x000000746e756f63 len=13 state=0x95d3d4f8c1497972
    (define-fun f_element_count () (_ BitVec 64) #x95d3d4f8c1497972)
    ; "adoption_path"        lo=0x6e6f6974706f6461 hi=0x000000687461705f len=13 state=0x53f243aa284d2be5
    (define-fun f_adoption_path () (_ BitVec 64) #x53f243aa284d2be5)
    ; "fallback_reason"      lo=0x6b6361626c6c6166 hi=0x006e6f736165725f len=15 state=0x568d20ec52705e7d
    (define-fun f_fallback_reason () (_ BitVec 64) #x568d20ec52705e7d)
    ; "zero_copy"            lo=0x706f635f6f72657a hi=0x0000000000000079 len=9  state=0x360680826321b7db
    (define-fun f_zero_copy () (_ BitVec 64) #x360680826321b7db)
    ; "width"                lo=0x0000006874646977 hi=0x0000000000000000 len=5  state=0xdbde7cee8f8d7a7d
    (define-fun f_width () (_ BitVec 64) #xdbde7cee8f8d7a7d)
    ; "height"               lo=0x0000746867696568 hi=0x0000000000000000 len=6  state=0x26f31eadd33b94c6
    (define-fun f_height () (_ BitVec 64) #x26f31eadd33b94c6)
    ; "channels"             lo=0x736c656e6e616863 hi=0x0000000000000000 len=8  state=0x5ada37494bffd5ad
    (define-fun f_channels () (_ BitVec 64) #x5ada37494bffd5ad)
    ; "row_stride"           lo=0x697274735f776f72 hi=0x0000000000006564 len=10 state=0x391a44375ea316be
    (define-fun f_row_stride () (_ BitVec 64) #x391a44375ea316be)
    ; "contract"             lo=0x74636172746e6f63 hi=0x0000000000000000 len=8  state=0xfc086d00c8a8847c
    (define-fun f_contract () (_ BitVec 64) #xfc086d00c8a8847c)
    ; "status"               lo=0x0000737574617473 hi=0x0000000000000000 len=6  state=0x2f58deed4187cfe8
    (define-fun f_status () (_ BitVec 64) #x2f58deed4187cfe8)
    ; "state"                lo=0x0000006574617473 hi=0x0000000000000000 len=5  state=0xf203ce2a2cdcccd5
    (define-fun f_state () (_ BitVec 64) #xf203ce2a2cdcccd5)
    ; "value"                lo=0x00000065756c6176 hi=0x0000000000000000 len=5  state=0xb0c39b4b85a688b8
    (define-fun f_value () (_ BitVec 64) #xb0c39b4b85a688b8)
    ; "message"              lo=0x006567617373656d hi=0x0000000000000000 len=7  state=0xd2f837f41e8abcb6
    (define-fun f_message () (_ BitVec 64) #xd2f837f41e8abcb6)
    ; "callback_id"          lo=0x6b6361626c6c6163 hi=0x000000000064695f len=11 state=0x5cfffa2bdc21702a
    (define-fun f_callback_id () (_ BitVec 64) #x5cfffa2bdc21702a)
    ; "args"                 lo=0x0000000073677261 hi=0x0000000000000000 len=4  state=0x9695229cedad3a40
    (define-fun f_args () (_ BitVec 64) #x9695229cedad3a40)
    ; "kwargs"               lo=0x000073677261776b hi=0x0000000000000000 len=6  state=0x11f9c667d88d786e
    (define-fun f_kwargs () (_ BitVec 64) #x11f9c667d88d786e)
    ; "source_backend"       lo=0x625f656372756f73 hi=0x0000646e656b6361 len=14 state=0xc88261adfb5976f5
    (define-fun f_source_backend () (_ BitVec 64) #xc88261adfb5976f5)

    ; Assert they are all distinct (unsat = proof holds)
    (assert (not (distinct
      f_contract_version f_element_size f_shape f_strides f_labels
      f_byte_length f_element_count f_adoption_path f_fallback_reason
      f_zero_copy f_width f_height f_channels f_row_stride f_contract
      f_status f_state f_value f_message f_callback_id f_args f_kwargs
      f_source_backend
    )))
    (check-sat)
  include_model: false
  include_stats: false
