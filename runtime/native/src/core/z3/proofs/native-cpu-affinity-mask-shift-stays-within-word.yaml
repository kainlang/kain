version: 1
id: kain.native.core.proofs.native_cpu_affinity_mask_shift_stays_within_word
kind: check_smt2
description: The affinity setter only forms a one-bit mask from core indexes that stay within the native machine-word width.
tags:
- native-runtime
- machine
- cpu
- affinity
- shift
- bounds
source:
  path: D:\Kain-Lang\runtime\native\src\core\cpu.c
  symbol: abi_cpu_set_current_thread_affinity
  start_line: 489
  reason: the x86_64 Windows path shifts a single-bit mask by the validated core index.
case:
  smt2: |
    (set-logic QF_BV)
    (declare-const core_index (_ BitVec 64))
    (assert (bvult core_index #x0000000000000040))
    (assert (not (= (bvand core_index #xffffffffffffffc0) #x0000000000000000)))
    (check-sat)
  include_model: false
  include_stats: false
