version: 1
id: kain.native.core.proofs.actor_slot_word_bit_index_within_table_size
kind: check_smt2
description: Slot ID computed as word_index * 64 + bit_index is within bounds.
tags:
- actor
- table-bounds
source:
  path: D:\Kain-Lang\runtime\native\src\core\actor.c
  symbol: kain_actor_table_find_free_slot_unlocked
  start_line: 1859
  reason: Multiply-add slot calculation
case:
  smt2: |
    (set-logic QF_LIA)
    (declare-const word_index Int)
    (declare-const bit_index Int)
    (assert (>= word_index 0))
    (assert (<= word_index 63))
    (assert (>= bit_index 0))
    (assert (<= bit_index 63))
    (assert (>= (+ (* word_index 64) bit_index) 4096))
    (check-sat)
