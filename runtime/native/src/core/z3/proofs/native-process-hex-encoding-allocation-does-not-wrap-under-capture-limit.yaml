version: 1
id: kain.native.core.proofs.native_process_hex_encoding_allocation_does_not_wrap_under_capture_limit
kind: find_counterexample
description: Hex encoding a bounded capture buffer only needs byte_length * 2 + 1 bytes,
  which stays well within size_t under the process capture ceiling.
