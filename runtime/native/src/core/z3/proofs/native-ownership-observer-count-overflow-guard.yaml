version: 1
id: kain.native.core.proofs.ownership_observer_count_overflow_guard
kind: find_counterexample
description: begin_observe_slot_unlocked increments observers only when observers < UINT32_MAX,
  so the next count cannot overflow (wrap to 0).
tags:
- ownership
- state-machine
- invariant
source:
  path: runtime/native/src/core/ownership.c
  symbol: kain_ownership_begin_observe_slot_unlocked
  start_line: 242
  reason: observer count overflow guard before observers++
case:
  declarations:
  - name: observers
    sort:
      kind: int
  constraints:
  - op: ne
    args:
    - observers
    - 4294967295
  - op: ge
    args:
    - observers
    - 0
  claim:
    op: gt
    args:
    - op: add
      args:
      - observers
      - 1
    - observers
references:
- type: smt2
  path: runtime/native/src/core/z3/proofs-experimental/ownership-observer-count-overflow-guard.smt2
