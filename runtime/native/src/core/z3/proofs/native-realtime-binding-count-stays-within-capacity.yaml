version: 1
id: kain.native.core.proofs.native_realtime_binding_count_stays_within_capacity
kind: find_counterexample
description: Realtime graphics binding parsing only increments count while it is still
  below the fixed binding-array capacity used by the material and compute plans, so the
  next count cannot exceed that capacity.
tags:
- native-runtime
- realtime
- graphics
- bindings
- capacity
source:
  path: D:\Kain-Lang\runtime\native\src\core\kain_runtime_realtime.c
  symbol: kain_runtime_graphics_parse_binding_objects
  start_line: 442
  reason: count < max_bindings is enforced before binding = &bindings[count] and ++count
case:
  declarations:
  - name: binding_count
    sort:
      kind: int
  - name: max_bindings
    sort:
      kind: int
  constraints:
  - op: eq
    args:
    - max_bindings
    - 8
  - op: ge
    args:
    - binding_count
    - 0
  - op: lt
    args:
    - binding_count
    - max_bindings
  claim:
    op: le
    args:
    - op: add
      args:
      - binding_count
      - 1
    - max_bindings
