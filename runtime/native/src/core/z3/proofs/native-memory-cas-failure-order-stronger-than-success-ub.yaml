version: 1
id: kain.native.core.proofs.native_memory_cas_failure_order_stronger_than_success_ub
kind: check_smt2
description: Historical counterexample for the old compare_exchange helper shape.
  Before the clamp landed, the runtime could forward a failure ordering whose
  C11 strength exceeded the chosen success ordering, which violates C11
  compare_exchange rules and produces undefined behavior.
tags:
- native-runtime
- memory
- atomic
- compare-exchange
- c11
- historical-counterexample
source:
  path: D:\\Kain-Lang\\runtime\\native\\src\\core\\memory.c
  symbol: __kain_atomic_compare_exchange_ordered
  start_line: 568
  reason: Historical bug model for the pre-fix helper that forwarded success and
    failure orderings without clamping failure_strength <= success_strength
case:
  smt2: |
    (set-logic QF_LIA)

    (declare-const kain_success Int)
    (declare-const kain_failure Int)

    (define-fun RELAXED () Int 0)
    (define-fun ACQUIRE () Int 1)
    (define-fun RELEASE () Int 2)
    (define-fun ACQ_REL () Int 3)
    (define-fun SEQ_CST () Int 4)

    (define-fun c11_relaxed () Int 0)
    (define-fun c11_acquire () Int 2)
    (define-fun c11_release () Int 3)
    (define-fun c11_acq_rel () Int 4)
    (define-fun c11_seq_cst () Int 5)

    (define-fun success_c11 ((k Int)) Int
      (ite (= k RELAXED) c11_relaxed
      (ite (= k ACQUIRE) c11_acquire
      (ite (= k RELEASE) c11_release
      (ite (= k ACQ_REL) c11_acq_rel
           c11_seq_cst)))))

    (define-fun failure_c11 ((k Int)) Int
      (ite (= k RELAXED) c11_relaxed
      (ite (= k RELEASE) c11_acquire
      (ite (= k ACQUIRE) c11_acquire
      (ite (= k ACQ_REL) c11_acquire
           c11_seq_cst)))))

    (assert (>= kain_success 0))
    (assert (<= kain_success 4))
    (assert (>= kain_failure 0))
    (assert (<= kain_failure 4))

    (assert (> (failure_c11 kain_failure) (success_c11 kain_success)))

    (check-sat)
  include_model: true
  include_stats: false
