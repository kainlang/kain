# ═══════════════════════════════════════════════════════════════════════════
#  Kain UI Telemetry Taxonomy — Data-Driven Test Definition
# ═══════════════════════════════════════════════════════════════════════════
#  Every test case is data. Add new tests by editing this file, not by
#  writing code. Each category maps to one or more API surfaces.
#
#  Schema version: 1.0.0
#  Format:         TOML
#  Generator:      run_telemetry.py
# ═══════════════════════════════════════════════════════════════════════════

[meta]
schema_version = "1.0.0"
generated = "2026-06-26"
description = "Complete Kain UI telemetry taxonomy — 9 categories, all API surfaces"
runtime_abi = "native_ui_surface"
c_test_binary = "kain_ui_test_runner.exe"

[settings]
timeout_ms = 5000
repeat_count = 3
report_dir = "../reports"
c_test_dir = "c_tests"
crash_repro_dir = "../reports/crashes"
screenshot_dir = "../reports/screenshots"
max_workers = 4
verbosity = "info"
fail_fast = false
collect_perf = true
collect_cov = true

# ═══════════════════════════════════════════════════════════════════════════
#  CATEGORY 1: geometry
# ═══════════════════════════════════════════════════════════════════════════

[category.geometry]
name = "geometry"
description = "Primitive geometry types and operations: rect, point, size, color, matrix"
api_header = "kain_geometry.h"
source_file = "../../../../include/kain_geometry.h"
weight = 1.0

# ── Rect construction ────────────────────────────────────────────────────
[[category.geometry.tests]]
id = "rect_make"
name = "kain_rect_make"
api = "kain_rect_make"
signature = "kainRect(float x, float y, float w, float h) -> kainRect"
import_path = "kain_geometry.h"
group = "rect_construction"
pass_criteria = "returns rect with correct fields"

[[category.geometry.tests.inputs]]
desc = "normal rect"
x = 0.0
y = 0.0
w = 100.0
h = 100.0

[[category.geometry.tests.inputs]]
desc = "negative origin"
x = -50.0
y = -50.0
w = 200.0
h = 200.0

[[category.geometry.tests.inputs]]
desc = "zero width"
x = 1.5
y = 2.5
w = 0.0
h = 10.0

[[category.geometry.tests.inputs]]
desc = "large and small values"
x = 1000000.0
y = 1000000.0
w = 0.000001
h = 0.000001

