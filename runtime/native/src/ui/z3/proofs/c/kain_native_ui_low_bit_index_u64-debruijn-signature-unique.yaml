version: 1
id: ui.kain_native_ui_low_bit_index_u64_debruijn_signature_unique
kind: check_smt2
description: The de Bruijn multiplier used by `kain_native_ui_low_bit_index_u64`
  maps every 64-bit one-hot value to a distinct 6-bit signature before the lookup
  table is applied.
tags:
- native-ui
- occupancy
- debruijn
- bitset
- magic-number
source:
  path: D:\Kain-Lang\runtime\native\src\ui\kain_native_ui_system.c
  language: c
  symbol: kain_native_ui_low_bit_index_u64
  signature: static unsigned int kain_native_ui_low_bit_index_u64(uint64_t one_hot) {
  start_line: 34
  end_line: 46
  reason: the occupancy-bit free-slot fast path relies on the de Bruijn multiplier producing unique signatures for every isolated low bit
case:
  smt2: |
    (set-logic QF_BV)

    (declare-fun i () (_ BitVec 6))
    (declare-fun j () (_ BitVec 6))

    (define-fun one_hot ((bit (_ BitVec 6))) (_ BitVec 64)
      (bvshl #x0000000000000001 ((_ zero_extend 58) bit)))

    (define-fun debruijn_signature ((value (_ BitVec 64))) (_ BitVec 6)
      ((_ extract 63 58) (bvmul value #x03f79d71b4cb0a89)))

    (assert (distinct i j))
    (assert (= (debruijn_signature (one_hot i))
               (debruijn_signature (one_hot j))))
    (check-sat)
  include_model: false
  include_stats: false
