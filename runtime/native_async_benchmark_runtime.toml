name = "kain-native-async-benchmark-runtime"

sources = [
    "native/src/core/core.c",
    "native/src/core/version.c",
    "native/src/core/diagnostics.c",
    "native/src/core/entangle.c",
    "native/src/core/stdlib_abi.c",
    "native/src/core/attrition.c",
    "native/src/core/process_system.c",
    "native/src/core/batch_queue.c",
    "native/src/core/async.c",
    "native/src/core/fanout.c",
    "native/src/core/actor.c",
]

windows_sources = []
linux_sources = []
macos_sources = []

include_dirs = [
    "native/include",
]

defines = [
    "KAIN_RUNTIME_INIT_NET_RESET=0",
    "KAIN_RUNTIME_INIT_PROCESS_RESET=0",
]

windows_defines = [
    "WIN32_LEAN_AND_MEAN",
    "_WIN32_WINNT=0x0A00",
    "_CRT_DECLARE_NONSTDC_NAMES=0",
]

linux_defines = [
    "_GNU_SOURCE",
    "_POSIX_C_SOURCE=200112",
    "_FILE_OFFSET_BITS=64",
]

[link]
windows = ["legacy_stdio_definitions", "user32", "gdi32", "shell32", "ws2_32", "winhttp"]
linux = ["pthread", "dl", "rt", "m"]
macos = []
