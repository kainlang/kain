interface:
  display_name: "Lang C ABI"
  short_description: "C ABI and native package interop in Kain"
  default_prompt: "Use $lang-c-abi to design or repair authored Kain that crosses C ABI boundaries. Prefer canonical include ... as header imports for local C examples and include <...> as alias for known system headers like stdio.h, windows.h, or vulkan/vulkan.h; use c:: is for runtime-owned ABI modules and explicit bridge metadata. Cover native facade design, handle lifecycles, buffer ownership, string boundaries, DLL/shared-library loading, and multi-library bridge metadata. Not for kain import-c or kain import platform command usage."
