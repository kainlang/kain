[package]
name = "kain-config"
version = "0.1.0"
description = "Data-driven config and manifest helpers for reusable Kain blades."

[blade]
name = "kain-config"
kind = "kain_library"
entry = "src/main.kn"
source_roots = ["src"]
module_roots = ["src"]
build_targets = ["run"]

[[blade.dependencies]]
name = "kain-fsx"
kind = "kain"

[[blade.dependencies]]
name = "kain-json"
kind = "kain"

[run]
entry = "src/main.kn"
target = "kain"

[build]
entry = "src/main.kn"
artifact_root = ".kain/out"
cache_root = ".kain/cache/build"
profile = "debug"

[[build.tasks]]
id = "check"
kind = "check"
entry = "src/main.kn"
inputs = [
  "src/main.kn",
  "src/kain_config.kn",
]
