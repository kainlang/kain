[package]
name = "zender"
version = "0.1.0"
description = "GPU-accelerated data-driven sculpting system — a Kain-native ZBrush clone."

[blade]
name = "zender"
kind = "kain_app"
entry = "src/sculpt/main.kn"
source_roots = [
    "src",
    "src/sculpt",
    "src/sculpt/brushes",
    "src/sculpt/kernels",
    "src/sculpt/mesh",
    "src/sculpt/state",
    "src/sculpt/tools",
]
module_roots = [
    "src",
    "src/sculpt",
    "src/sculpt/brushes",
    "src/sculpt/kernels",
    "src/sculpt/mesh",
    "src/sculpt/state",
    "src/sculpt/tools",
]

[build]
target = "llvm"
profile = "release"
