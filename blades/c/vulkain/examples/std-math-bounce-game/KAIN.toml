[package]
name = "vulkain-std-math-bounce-game"
version = "0.1.0"
description = "Kain-authored std::math/std::input bouncing cube game state rendered through Vulkain."

[blade]
name = "vulkain-std-math-bounce-game"
kind = "kain_app"
entry = "src/main.kn"
source_roots = ["src", "../../src"]
module_roots = ["src", "../../src"]
build_targets = ["llvm"]

[run]
entry = "src/main.kn"
target = "llvm"

[build]
entry = "src/main.kn"
artifact_root = ".kain/out"
cache_root = ".kain/cache/build"
profile = "debug"

[c_ffi]

[[c_ffi.libraries]]
name = "vulkain_bridge"
header = "../../native/vulkain_bridge.h"
sources = ["../../native/vulkain_bridge.c"]
include_paths = [
  "../../native",
  "${env:KAIN_PLATFORM_VULKAN_INCLUDE}",
]
defines = ["_CRT_SECURE_NO_WARNINGS"]
link_libs = ["user32"]
