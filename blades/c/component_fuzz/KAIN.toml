[package]
name = "component_fuzz"
version = "0.1.0"
description = "Experimental component fuzz blade — pushing Kain's component keyword to its absolute limits. Components for things components were never meant to do."

[blade]
name = "component_fuzz"
kind = "kain_library"
entry = "src/main.kn"
source_roots = ["src"]
module_roots = ["src"]
build_targets = ["llvm"]

[run]
entry = "src/main.kn"
target = "llvm"

[build]
entry = "src/main.kn"
artifact_root = ".kain/out"
cache_root = ".kain/cache/build"
profile = "debug"

[[build.tasks]]
id = "check-llvm"
kind = "check"
entry = "src/main.kn"
target = "llvm"
inputs = [
  "src/main.kn",
  "src/components.kn",
  "build.kn",
]
