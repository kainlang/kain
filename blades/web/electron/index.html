<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>K-OS Playground</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #06080f; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display: flex; flex-direction: column; }

    #hypervisor-bar { flex-shrink: 0; }

    #main-area { flex: 1; display: flex; overflow: hidden; position: relative; }
    #main-area > div { position: absolute; inset: 0; }

    #page-viewport { display: flex; }

    #sidebar {
      width: 260px; min-width: 180px; max-width: 500px; height: 100%;
      background: rgba(8, 10, 20, 0.97); border-right: 1px solid #1e293b;
      display: flex; flex-direction: column; z-index: 200; user-select: none; overflow: hidden;
      flex-shrink: 0;
    }
    #sidebar-tabs { display: flex; border-bottom: 1px solid #1e293b; flex-shrink: 0; }
    .tab {
      flex: 1; padding: 10px 8px; background: transparent; border: none;
      border-bottom: 2px solid transparent; color: #8b949e; font-size: 11px;
      font-weight: 600; cursor: pointer; font-family: inherit; transition: all 0.15s;
    }
    .tab:hover { color: #e6edf3; background: rgba(88,166,255,0.05); }
    .tab.active { color: #58a6ff; border-bottom-color: #58a6ff; }
    .tab-content { display: none; flex: 1; flex-direction: column; overflow: hidden; }
    .tab-content.active { display: flex; }

    #sidebar-header { padding: 12px 14px; border-bottom: 1px solid #1e293b; color: #58a6ff; font-weight: 700; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
    #sidebar-header button { background: #1e293b; border: 1px solid #334155; color: #e6edf3; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; }
    #sidebar-header button:hover { background: #334155; }
    #sidebar-list { flex: 1; overflow-y: auto; padding: 4px 0; }
    #sidebar-list::-webkit-scrollbar { width: 4px; }
    #sidebar-list::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }

    .file-item { padding: 7px 14px; cursor: pointer; color: #8b949e; font-size: 12px; display: flex; align-items: center; gap: 6px; border-left: 2px solid transparent; transition: all 0.1s; }
    .file-item:hover { background: rgba(88,166,255,0.08); color: #e6edf3; }
    .file-item.active { border-left-color: #58a6ff; color: #e6edf3; background: rgba(88,166,255,0.12); }
    .file-item .icon { font-size: 13px; width: 18px; text-align: center; }
    .file-item .name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-item .status { font-size: 10px; opacity: 0.6; }
    .file-item.building { color: #ffa657; pointer-events: none; }

    #tab-props { padding: 14px; overflow-y: auto; color: #8b949e; font-size: 12px; }
    #tab-props .prop-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid #1e293b; }
    .prop-row .prop-key { color: #8b949e; }
    .prop-row .prop-val { color: #e6edf3; font-weight: 600; }

    #resize-handle { width: 4px; height: 100%; background: transparent; cursor: col-resize; z-index: 201; flex-shrink: 0; }
    #resize-handle:hover, #resize-handle.dragging { background: #58a6ff; }

    #canvas-container { flex: 1; height: 100%; position: relative; user-select: none; -webkit-user-drag: none; }
    #canvas-container canvas { display: block; user-select: none; -webkit-user-drag: none; pointer-events: auto; }

    #page-audio { display: none; }
    #audio-container { flex: 1; height: 100%; }
  </style>
  <script type="importmap">
  { "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
  </script>
</head>
<body>

  <!-- K-OS HYPERVISOR BAR -->
  <div id="hypervisor-bar"></div>

  <!-- MAIN CONTENT AREA -->
  <div id="main-area">

    <!-- PAGE: 3D Viewport -->
    <div id="page-viewport">
      <div id="sidebar">
        <div id="sidebar-tabs">
          <button class="tab active" data-tab="files">📁 FILES</button>
          <button class="tab" data-tab="props">📊 PROPS</button>
        </div>
        <div id="tab-files" class="tab-content active">
          <div id="sidebar-header">
            <span>📁 Demos</span>
            <button id="load-btn" title="Load a .kn file (Ctrl+O)">+ Load</button>
          </div>
          <div id="sidebar-list">
            <div class="file-item" style="color:#8b949e;cursor:default;">Scanning...</div>
          </div>
        </div>
        <div id="tab-props" class="tab-content">
          <div id="props-inner">Select a running demo to see properties.</div>
        </div>
      </div>
      <div id="resize-handle"></div>
      <div id="canvas-container"></div>
    </div>

    <!-- PAGE: Audio Lab -->
    <div id="page-audio">
      <div id="audio-container"></div>
    </div>

  </div>

  <script src="hypervisor.js"></script>
  <script src="audio_bridge.js"></script>
  <script src="audio.js"></script>
  <script type="module" src="renderer.js"></script>
</body>
</html>
