[package]
name = "reson8"
version = "0.1.0"
authors = ["reson8 Studio"]
kain-version = "0.1"
description = "The world's first Kain-native DAW — compiler-owned state, journaled undo, zero-copy metering, Python+ML interop, 7 semantic layers"

[build]
entry = "src/main.kn"
artifact_root = ".kain/out/llvm"
cache_root = ".kain/cache/build"
profile = "dev"

# ── C ABI: Vendored third-party bridges ──
# Four bridges: miniaudio (device I/O), VST3 SDK (plugin hosting),
# CLAP SDK (plugin hosting — pure C, minimal wrapping),
# vkvg (Vulkan Vector Graphics — 2D GPU drawing).
#
# All SDKs are vendored under 3rdparty/ — no system registry needed.

[c_ffi]
include_paths = [
  "3rdparty/miniaudio",
  "3rdparty/vst3_sdk",
  "3rdparty/vst3_sdk/pluginterfaces",
  "3rdparty/vst3_sdk/public.sdk",
  "3rdparty/clap/include",
  "3rdparty/vulkan/include",
  "3rdparty/vkvg/3rdparty/vkvg/include",
]

# ── Bridge 1: Audio device I/O (miniaudio) ──
[[c_ffi.libraries]]
name = "audio_device_bridge"
header = "src/bridge/native/audio_device_bridge.h"
sources = ["src/bridge/native/audio_device_bridge.c"]
include_paths = [
  "3rdparty/miniaudio",
]

# Platform-specific link libs for miniaudio
[[c_ffi.libraries.target_policies]]
target = "windows"
link_libs = ["ole32", "avrt"]    # WASAPI requires ole32 (COM), avrt (MMCSS)
[[c_ffi.libraries.target_policies]]
target = "linux"
link_libs = ["asound", "pulse"]  # ALSA + PulseAudio
[[c_ffi.libraries.target_policies]]
target = "macos"
link_libs = ["AudioToolbox", "CoreAudio", "CoreFoundation"]

# ── Bridge 2: VST3 plugin host (DISABLED: SDK API mismatch, needs update) ──
# [[c_ffi.libraries]]
# name = "vst3_host_bridge"
# ...
#
# ── Bridge 3: CLAP plugin host (DISABLED: SDK API mismatch, needs update) ──
# [[c_ffi.libraries]]
# name = "clap_host_bridge"
# ...
#
# ── Bridge 4: Vulkan Vector Graphics (vkvg) ──
# GPU-accelerated 2D vector drawing for reson8's UI.
# Requires vkvg built as a static/shared library (see 3rdparty/vkvg/).
# vkvg depends on: Vulkan SDK, vkh (submodule), optional freetype/harfbuzz.
[[c_ffi.libraries]]
name = "vkvg_bridge"
header = "src/bridge/native/vkvg_bridge.h"
sources = ["src/bridge/native/vkvg_bridge.c"]
include_paths = [
  "3rdparty/vkvg/3rdparty/vkvg/include",
  "3rdparty/vulkan/include",
]

# Platform-specific link libs for vkvg
[[c_ffi.libraries.target_policies]]
target = "windows"
link_libs = ["vkvg", "vulkan-1"]
[[c_ffi.libraries.target_policies]]
target = "linux"
link_libs = ["vkvg", "vulkan"]
[[c_ffi.libraries.target_policies]]
target = "macos"
link_libs = ["vkvg", "vulkan"]
