[package]
name = "cuda"
version = "0.1.0"
description = "Author-first CUDA/PTX blade: Kain drives multi-stage compute and a native C++ reference comparator."

[blade]
name = "cuda"
kind = "kain_library"
entry = "src/main.kn"
source_roots = ["src"]
module_roots = ["src"]
build_targets = ["llvm"]

[run]
entry = "src/main.kn"
target = "llvm"

[build]
entry = "src/main.kn"
artifact_root = ".kain/out"
cache_root = ".kain/cache/build"
profile = "debug"

[[build.tasks]]
id = "check-llvm"
kind = "check"
entry = "src/main.kn"
target = "llvm"
inputs = [
  "src/main.kn",
  "native/cuda_visual_bridge.h",
  "native/cuda_visual_bridge.cpp",
  "build-cuda-bridge.ps1",
  "run.ps1",
  "build.kn",
]
