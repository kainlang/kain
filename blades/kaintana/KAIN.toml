[package]
name = "kaintana"
version = "0.1.0"
description = "Blade-owned Kain UI framework with immediate, retained, theme, host, and embed lanes."

[blade]
name = "kaintana"
kind = "kain_library"
entry = "src/main.kn"
source_roots = [
  "src",
  "src/api",
  "src/core",
  "src/platform/desktop",
]
module_roots = [
  "src",
  "src/api",
  "src/core",
  "src/platform/desktop",
]
build_targets = ["llvm"]

[run]
entry = "src/main.kn"
target = "llvm"

[build]
entry = "src/main.kn"
artifact_root = ".kain/out"
cache_root = ".kain/cache/build"
profile = "debug"

[[build.tasks]]
id = "check-llvm"
kind = "check"
entry = "src/main.kn"
target = "llvm"
inputs = [
  "src/main.kn",
  "src/kaintana.kn",
  "src/api/kaintana_ui.kn",
  "src/api/widgets.kn",
  "src/core/input.kn",
  "src/core/layout.kn",
  "src/core/reconciliation.kn",
  "src/core/render_commands.kn",
  "src/core/theme.kn",
  "src/core/types.kn",
  "src/platform/desktop/desktop_adapter.kn",
  "native/kaintana_desktop_bridge.h",
  "native/kaintana_desktop_bridge.c",
  "build-desktop.ps1",
  "run.ps1",
]

[c_ffi]

[[c_ffi.libraries]]
name = "kaintana_desktop_bridge"
header = "native/kaintana_desktop_bridge.h"
shared_lib = ".kain/native/kaintana_desktop_bridge.obj"
link_libs = ["user32", "gdi32"]
