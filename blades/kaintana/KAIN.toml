[package]
name = "kaintana"
version = "0.1.0"
description = "Blade-owned Kain UI framework with hot-reload-aware retained and immediate authoring lanes."

[blade]
name = "kaintana"
kind = "kain_library"
entry = "src/kaintana.kn"
source_roots = ["src", "src/api", "src/core", "src/platform/desktop", "src/platform/vulkan", "src/platform/winit", "examples"]
module_roots = ["src", "src/api", "src/core", "src/platform/desktop", "src/platform/vulkan", "src/platform/winit", "examples"]
build_targets = ["llvm"]

[run]
entry = "src/main.kn"
target = "llvm"

[build]
entry = "src/main.kn"
artifact_root = ".kain/out"
cache_root = ".kain/cache/build"
profile = "debug"

[[build.tasks]]
id = "surface-check-llvm"
kind = "check"
entry = "src/kaintana.kn"
target = "llvm"

[[build.tasks]]
id = "check-llvm"
kind = "check"
entry = "src/main.kn"
target = "llvm"
inputs = ["src/main.kn", "src/kaintana.kn", "build.kn", "KAIN.toml"]

[[build.tasks]]
id = "root-executable"
kind = "native-executable"
entry = "src/main.kn"
output = "$blade/kaintana.exe"
inputs = ["src/main.kn", "src/kaintana.kn", "build.kn", "KAIN.toml"]
