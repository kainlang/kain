[package]
name = "kloner"
version = "0.1.0"
description = "Faithful Kain-native workstation recreation of the legacy KCloner operator."

[blade]
name = "kloner"
entry = "src/main.kn"
source_roots = ["src"]
module_roots = ["src"]
build_targets = ["llvm"]

[[blade.dependencies]]
name = "kaintana"
kind = "kain"

[run]
entry = "src/main.kn"
target = "llvm"

[build]
entry = "src/main.kn"
artifact_root = ".kain/out"
cache_root = ".kain/cache/build"
profile = "debug"

[[build.tasks]]
id = "check-llvm"
kind = "check"
entry = "src/main.kn"
target = "llvm"
inputs = [
  "src/main.kn",
  "run.ps1",
  "reference/KCloner.tsx",
]

[c_ffi]

[[c_ffi.libraries]]
name = "kaintana_desktop_bridge"
header = "../kaintana/native/kaintana_desktop_bridge.h"
shared_lib = "../kaintana/.kain/native/kaintana_desktop_bridge.obj"
link_libs = ["user32", "gdi32"]
