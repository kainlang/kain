[package]
name = "markscript"
version = "1.0.0"
description = "The core zero-copy intent engine companion for Kain."

[blade]
name = "markscript"
entry = "src/main.kn"
source_roots = ["src"]
module_roots = ["src"]
build_targets = ["llvm"]

[run]
entry = "src/main.kn"
target = "llvm"

[build]
entry = "src/main.kn"
artifact_root = ".kain/out"
cache_root = ".kain/cache/build"
profile = "release"

[[build.tasks]]
id = "check-llvm"
kind = "check"
entry = "src/main.kn"
target = "llvm"
inputs = [
    "src/main.kn",
    "src/lexer.kn",
    "src/types.kn",
    "src/error.kn",
    "src/parser.kn",
    "src/vm.kn",
    "src/bridge.kn",
    "src/import.kn",
]
