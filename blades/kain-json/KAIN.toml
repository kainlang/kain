[package]
name = "kain-json"
version = "0.1.0"
description = "High-performance JSON serialization and parsing for Kain"

[blade]
name = "kain-json"
entry = "src/main.kn"
source_roots = ["src"]
module_roots = ["src"]
build_targets = ["run"]

[run]
entry = "src/main.kn"
target = "kain"

[build]
entry = "src/main.kn"
artifact_root = ".kain/build"
cache_root = ".kain/cache/build"
profile = "debug"

[[build.tasks]]
id = "check"
kind = "check"
entry = "src/main.kn"
inputs = [
  "src/main.kn",
  "src/json.kn",
]
