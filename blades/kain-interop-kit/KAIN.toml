[package]
name = "kain-interop-kit"
version = "0.1.0"
description = "Shared buffer and image payload helpers for reusable Kain blades."

[blade]
name = "kain-interop-kit"
kind = "kain_library"
entry = "src/main.kn"
source_roots = ["src"]
module_roots = ["src"]
build_targets = ["run"]

[run]
entry = "src/main.kn"
target = "kain"

[build]
entry = "src/main.kn"
artifact_root = ".kain/out"
cache_root = ".kain/cache/build"
profile = "debug"

[[build.tasks]]
id = "check"
kind = "check"
entry = "src/main.kn"
inputs = [
  "src/main.kn",
  "src/kain_interop_kit.kn",
]
