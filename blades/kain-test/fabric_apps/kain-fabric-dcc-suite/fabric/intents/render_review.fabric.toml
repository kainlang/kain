version = 1

[workspace]
root = "../.."
search_roots = ["src", "scripts", "shaders"]

[[requires]]
key = "session.local"
version = 1
optional = false

[[steps]]
id = "python_suite_bootstrap"
runtime = "kain"
entry = "src/python_suite_bootstrap.kn"

[[steps.outputs]]
name = "project_settings"
kind = "value"

[[steps]]
id = "dcc_suite_seed"
runtime = "kain"
entry = "src/main.kn"
depends_on = ["python_suite_bootstrap"]

[[steps.outputs]]
name = "preview_src"
kind = "shared_buffer"

[[steps.outputs]]
name = "preview_dst"
kind = "shared_buffer"

[[steps.outputs]]
name = "pathtrace_dst"
kind = "shared_buffer"

[[steps.outputs]]
name = "session_report"
kind = "value"

[[steps]]
id = "gpu_render_aov_pack"
runtime = "gpu_compute"
shader_source = "shaders/render_aov_pack.kn"
compute_key = "DccSuiteRenderAovPack"
depends_on = ["dcc_suite_seed"]

[[steps.outputs]]
name = "preview_dst"
kind = "shared_buffer"

[[steps]]
id = "render_aov_pack_projection"
runtime = "kain"
entry = "src/render_aov_pack_projection.kn"
depends_on = [
    "python_suite_bootstrap",
    "dcc_suite_seed",
    "gpu_render_aov_pack"
]

[[steps.outputs]]
name = "render_aov_pack_report"
kind = "value"

[[steps]]
id = "render_review_capture_projection"
runtime = "kain"
entry = "src/render_review_capture_projection.kn"
depends_on = [
    "python_suite_bootstrap",
    "dcc_suite_seed",
    "render_aov_pack_projection",
    "render_preview_projection",
    "pathtrace_preview_projection"
]

[[steps.outputs]]
name = "render_review_capture_report"
kind = "value"

[[steps]]
id = "render_visibility_projection"
runtime = "kain"
entry = "src/render_visibility_projection.kn"
depends_on = [
    "python_suite_bootstrap",
    "dcc_suite_seed",
    "render_aov_pack_projection",
    "render_review_capture_projection",
    "render_frame_schedule_projection"
]

[[steps.outputs]]
name = "render_visibility_report"
kind = "value"

[reports]
directory = ".kain/fabric/intents/render_review"
emit_jsonl_events = true
