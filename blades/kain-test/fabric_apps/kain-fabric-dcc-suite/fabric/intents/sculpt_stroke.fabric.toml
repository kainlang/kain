version = 1

[workspace]
root = "../.."
search_roots = ["src", "scripts", "native", "shaders"]

[[requires]]
key = "session.local"
version = 1
optional = false

[[steps]]
id = "python_suite_bootstrap"
runtime = "kain"
entry = "src/python_suite_bootstrap.kn"

[[steps.outputs]]
name = "project_settings"
kind = "value"

[[steps]]
id = "dcc_suite_seed"
runtime = "kain"
entry = "src/main.kn"
depends_on = ["python_suite_bootstrap"]

[[steps.outputs]]
name = "sculpt_heightfield_src"
kind = "shared_buffer"

[[steps.outputs]]
name = "sculpt_brush_params"
kind = "shared_buffer"

[[steps.outputs]]
name = "sculpt_delta"
kind = "shared_buffer"

[[steps]]
id = "gpu_sculpt_displacement"
runtime = "gpu_compute"
shader_source = "shaders/sculpt_heightfield_apply.kn"
compute_key = "DccSuiteGpuSculptStroke"
depends_on = ["dcc_suite_seed"]

[[steps.outputs]]
name = "sculpt_delta"
kind = "shared_buffer"

[[steps]]
id = "native_sculpt_kernel"
runtime = "c_abi"
entry = "src/native_sculpt_step.kn"
module = "dcc_suite_ops"
library = "native/${kain_dynlib:dcc_suite_ops}"
depends_on = ["python_suite_bootstrap", "gpu_sculpt_displacement"]

[[steps.outputs]]
name = "sculpt_signature"
kind = "value"

[[steps.outputs]]
name = "sculpt_report"
kind = "value"

[[steps]]
id = "sculpt_brush_projection"
runtime = "kain"
entry = "src/sculpt_brush_projection.kn"
depends_on = ["python_suite_bootstrap", "dcc_suite_seed", "native_sculpt_kernel"]

[[steps.outputs]]
name = "sculpt_brush_report"
kind = "value"

[reports]
directory = ".kain/fabric/intents/sculpt_stroke"
emit_jsonl_events = true
