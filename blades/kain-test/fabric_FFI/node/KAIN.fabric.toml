version = 1

[workspace]
root = "."
search_roots = ["src", "helpers", "manifests"]

[[requires]]
key = "session.local"
version = 1
optional = false

[[steps]]
id = "threejs_space_builder"
runtime = "kain"
entry = "src/main.kn"

[[steps.outputs]]
name = "summary"
kind = "value"

[reports]
directory = ".kain/fabric/reports"
emit_jsonl_events = true
