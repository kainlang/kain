version = 1

[workspace]
root = "."
search_roots = ["src", "scripts", "shaders"]

[[requires]]
key = "session.local"
version = 1
optional = false

[[steps]]
id = "python_source"
runtime = "python"
entry = "scripts/python_step.py"

[[steps.outputs]]
name = "settings"
kind = "value"

[[steps]]
id = "kain_orchestrator"
runtime = "kain"
entry = "src/main.kn"
depends_on = ["python_source"]

[[steps.outputs]]
name = "src"
kind = "shared_buffer"

[[steps.outputs]]
name = "dst"
kind = "shared_buffer"

[[steps.outputs]]
name = "report"
kind = "value"

[[steps]]
id = "gpu_enrich"
runtime = "gpu_compute"
shader_source = "shaders/gpu_step.kn"
compute_key = "FabricGpuCopy"
depends_on = ["kain_orchestrator"]

[[steps.outputs]]
name = "dst"
kind = "shared_buffer"

[[steps]]
id = "node_packager"
runtime = "node"
entry = "scripts/node_step.mjs"
depends_on = ["kain_orchestrator", "gpu_enrich"]

[[steps.outputs]]
name = "summary"
kind = "value"

[reports]
directory = ".kain/fabric/reports"
emit_jsonl_events = true
