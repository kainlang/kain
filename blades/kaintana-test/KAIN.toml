[package]
name = "kaintana-test"
version = "0.1.0"
description = "Consumer proof blade for the Kaintana framework."

[blade]
name = "kaintana-test"
entry = "src/main.kn"
source_roots = ["src"]
module_roots = ["src"]
build_targets = ["llvm"]

[[blade.dependencies]]
name = "kaintana"
kind = "kain"

[run]
entry = "src/main.kn"
target = "llvm"

[build]
entry = "src/main.kn"
artifact_root = ".kain/out"
cache_root = ".kain/cache/build"
profile = "debug"

[[build.tasks]]
id = "check-llvm"
kind = "check"
entry = "src/main.kn"
target = "llvm"
inputs = [
  "src/main.kn",
  "entrypoints/vulkan.kn",
  "run.ps1",
]

[c_ffi]

[[c_ffi.libraries]]
name = "kaintana_desktop_bridge"
header = "../kaintana/native/kaintana_desktop_bridge.h"
shared_lib = "../kaintana/.kain/native/kaintana_desktop_bridge.obj"
link_libs = ["user32", "gdi32"]

[[c_ffi.libraries]]
name = "vulkain_bridge"
header = "../vulkain/native/vulkain_bridge.h"
shared_lib = "../vulkain/.kain/native/${kain_dynlib:vulkain_bridge}"
