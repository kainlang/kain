[package]
name = "python"
version = "0.1.0"
description = "Canonical Kain Python import lab with LLVM-native shared interop pressure."

[blade]
name = "python"
entry = "src/main.kn"
source_roots = ["src"]
module_roots = ["src"]
build_targets = ["llvm"]

[run]
entry = "src/main.kn"
target = "llvm"

[build]
entry = "src/main.kn"
artifact_root = ".kain/out"
cache_root = ".kain/cache/build"
profile = "debug"

[[build.tasks]]
id = "check-llvm"
kind = "check"
entry = "src/main.kn"
target = "llvm"
inputs = [
  "src/main.kn",
  "src/python_lab/__init__.py",
  "src/python_lab/bridge.py",
  "native/python_lab_bridge.h",
  "native/python_lab_bridge.c",
  "data/lab_config.json",
  "build.kn",
]

[c_ffi]

[[c_ffi.libraries]]
name = "python_lab_bridge"
header = "native/python_lab_bridge.h"
sources = ["native/python_lab_bridge.c"]
include_paths = ["native"]
