[package]
name = "python2"
version = "0.1.0"
description = "Kain-first pygame interop blade that compiles to LLVM."

[blade]
name = "python2"
entry = "src/main.kn"
source_roots = ["src"]
module_roots = ["src"]
build_targets = ["llvm"]

[run]
entry = "src/main.kn"
target = "llvm"

[build]
entry = "src/main.kn"
artifact_root = ".kain/out"
cache_root = ".kain/cache/build"
profile = "debug"

[[build.tasks]]
id = "check-llvm"
kind = "check"
entry = "src/main.kn"
target = "llvm"
inputs = [
  "src/main.kn",
  "src/python2_lab/__init__.py",
  "src/python2_lab/bridge.py",
  "data/game_plan.json",
  "build.kn",
]
