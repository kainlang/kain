[package]
name = "pong"
version = "0.1.0"
description = "Native UI Pong state-lattice demo for Kain worlds, entangle, actors, and ownership transitions."

[blade]
name = "pong"
entry = "src/main.kn"
source_roots = ["src"]
module_roots = ["src"]
build_targets = ["llvm"]

[[blade.dependencies]]
name = "kain-config"
kind = "kain"

[run]
entry = "src/main.kn"
target = "llvm"

[build]
entry = "src/main.kn"
artifact_root = ".kain/out"
cache_root = ".kain/cache/build"
profile = "debug"

[[build.tasks]]
id = "check-llvm"
kind = "check"
entry = "src/main.kn"
target = "llvm"
inputs = [
  "src/main.kn",
  "src/layout.kn",
  "src/pong_config.kn",
  "src/theme.kn",
  "src/ui_helpers.kn",
  "native/pong_window_bridge.h",
  "native/pong_window_bridge.c",
  "config/pong_demo.json",
  "build-pong-window.ps1",
  "run.ps1",
]

[c_ffi]

[[c_ffi.libraries]]
name = "pong_window_bridge"
header = "native/pong_window_bridge.h"
shared_lib = ".kain/native/pong_window_bridge.obj"
link_libs = ["user32", "gdi32", "opengl32"]
