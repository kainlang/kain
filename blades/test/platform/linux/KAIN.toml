[package]
name = "platform-linux"
version = "0.1.0"
description = "Linux / Unix runtime, procfs, loopback, process-gap, and graphics proof blade."

[blade]
name = "platform-linux"
entry = "src/main.kn"
source_roots = ["src"]
module_roots = ["src"]
build_targets = ["llvm"]

[run]
entry = "src/main.kn"
target = "llvm"

[build]
entry = "src/main.kn"
artifact_root = ".kain/out"
cache_root = ".kain/cache/build"
profile = "debug"

[[build.tasks]]
id = "check-llvm"
kind = "check"
entry = "src/main.kn"
target = "llvm"
inputs = [
  "src/main.kn",
  "build.kn",
  "KAIN.toml",
  "README.md",
]
