version = 1

[workspace]
root = "."
search_roots = ["packages", "scripts", "src"]

[[requires]]
key = "session.local"
version = 1
optional = false

[[steps]]
id = "fabric_probe"
runtime = "python"
entry = "scripts/fabric_probe.py"

[[steps.outputs]]
name = "summary"
kind = "value"

[reports]
directory = "outputs/fabric/reports"
emit_jsonl_events = true
