[package]
name = "stdlib-foundations"
version = "0.1.0"
description = "Integrated proof blade for std.text, std.collections, std.crypto, and std.alloc."

[blade]
name = "stdlib-foundations"
entry = "src/main.kn"
source_roots = ["src"]
module_roots = ["src"]
build_targets = ["llvm"]

[run]
entry = "src/main.kn"
target = "llvm"

[build]
entry = "src/main.kn"
artifact_root = ".kain/out"
cache_root = ".kain/cache/build"
profile = "debug"

[[build.tasks]]
id = "check-llvm"
kind = "check"
entry = "src/main.kn"
target = "llvm"
inputs = ["src/main.kn"]
