[package]
name = "kain-example"
version = "0.1.0"
description = "Canonical native LLVM Kain proving ground plus an interactive runtime workbench."

[blade]
name = "kain-example"
entry = "src/main.kn"
source_roots = ["src"]
module_roots = ["src"]
build_targets = ["llvm"]

[run]
entry = "src/main.kn"
target = "llvm"

[build]
entry = "src/main.kn"
artifact_root = ".kain/out"
cache_root = ".kain/cache/build"
profile = "debug"

[[build.tasks]]
id = "check-llvm"
kind = "check"
entry = "src/main.kn"
target = "llvm"
inputs = ["src/main.kn"]

[[build.tasks]]
id = "check-ui-llvm"
kind = "check"
entry = "src/ui.kn"
target = "llvm"
inputs = [
    "src/ui.kn",
    "src/episode_graphics.kn",
    "src/episode_input.kn",
    "src/episode_layout.kn",
    "src/episode_network.kn",
    "src/episode_pages.kn",
    "src/episode_strings.kn",
    "src/episode_theme.kn",
    "src/episode_ui_helpers.kn",
    "src/workbench_labs.kn"
]
