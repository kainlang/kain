# KAIN.toml — Workspace Config for the Self-Host Kain Compiler (kainc)
# Location: blades/kain/src/ (source root)
#
# This file is the workspace configuration authority. It defines:
#  - Package metadata (name, version, kind)
#  - Build configuration (entry, target, profile)
#  - Source order for ouroboros concatenation (all 23 source files)
#  - Self-host bootstrap outputs
#  - Runtime manifest path
#  - FFI configuration
#
# The blade-level KAIN.toml at blades/kain/KAIN.toml syncs from this file
# for toolchain discovery. Build logic is in blades/kain/build.kn (std::build).

[package]
name = "kainc"
version = "0.1.0"
kind = "kain_executable"
description = "Kain Self-Host Compiler — lex, parse, typecheck, codegen, JIT, orchestrate"
authors = ["Kain Compiler Team"]
license = "MIT"

[build]
entry = "main.kn"
source_root = "."
target = "llvm"
profile = "debug"
output = "kainc"

[dependencies]
stdlib = [
    "std::text",
    "std::machine",
    "std::markscript",
    "std::fs",
    "std::collections",
    "std::fmt",
    "std::process",
    "std::io",
    "std::runtime",
]
link_libs = ["kain_runtime"]

# ────────────────────────────────────────────────────────────────────
# SOURCE ORDER — Ouroboros Concatenation Order
#
# When the bootstrap compiler combines all source files for self-host
# compilation, it concatenates them in this exact order. Each file must
# appear AFTER its dependencies. The first definition of any symbol
# "wins" — later duplicates are shadowed at combine time.
#
# 25 source files total (23 original + L1_state + L2_integrity). Order verified against cross-file imports.
# ────────────────────────────────────────────────────────────────────

[source_order]
files = [
    # ── Foundation types (no cross-file deps) ──
    "token.kn",           # TokenKind constants, Token struct
    "error.kn",           # KcDiagnostic, KcDiagnosticBag
    "span.kn",            # Span struct, span helpers
    "ast.kn",             # AST constants (item/stmt/expr/type/pattern/binop/unary)

    # ── Build config helpers (no cross-file deps, consumed by orchestrator) ──
    "build.kn",           # Column name constants, config helpers, markscript table schema

    # ── L1 + L2 semantic constructs (state authority + integrity) ──
    "L1_state.kn",         # World + Entangle check + codegen stubs
    "L2_integrity.kn",     # Patch + Law check + codegen stubs

    # ── Lexer (depends on: token, error, span) ──
    "lexer.kn",           # DFA lexer, indent processor, tokenize_all

    # ── Builtins + Runtime contract (depends on: token, ast) ──
    "builtins.kn",        # BuiltinType, BuiltinFunction, 27 primitive types
    "runtime.kn",         # Runtime function table (~200 entries), C type mapping

    # ── LLVM FFI + JIT layer (depends on: runtime for type defs) ──
    "llvm_ffi.kn",        # LLVM-C FFI types + GOLF wrapper functions (70+ wrappers)
    "jit_metal.kn",       # W^X lifecycle, trampoline, vm_map/protect/fence
    "jit_x86.kn",         # Path A: direct x86-64 JIT emission library
    "jit_orc.kn",         # Path B: OrcJIT binding (currently stub)
    "jit_cache.kn",       # Shatter struct JIT cache with SoA layout
    "jit.kn",             # JIT dispatcher (auto-select OrcJIT vs Path A)

    # ── Parser (depends on: token, error, span, ast, lexer) ──
    "parser.kn",          # Full recursive-descent parser (108 keywords, ~3345 lines)

    # ── Typechecker + Effects (depends on: ast, token, error) ──
    "types.kn",           # ResolvedType (20 variants), 4-pass pipeline, types_compatible
    "effects.kn",         # 8-effect lattice, can_call(), effect_set_* helpers

    # ── Construct implementations (depends on: types, ast, effects) ──
    "L3_dispatch.kn",     # Converge: typecheck + codegen stubs (L3)
    "L4_stage.kn",        # Orchestrate: typecheck + codegen stubs (L4)
    "L5_temporal.kn",     # Pulse + Resonate: typecheck + codegen stubs (L5)
    "L6_stones.kn",       # Axiom + Shatter + Teleport: typecheck + codegen stubs (L6)
    "L7_systems.kn",      # Actor + Ownership: typecheck + codegen stubs (L7)
    "GpuBackend.kn",      # Shader + Dispatch: typecheck + codegen stubs (GPU)

    # ── Monomorphization + Codegen (depends on: types, llvm_ffi, runtime) ──
    "monomorphize.kn",    # Generic instantiation, unify(), substitute_type(), mangle_name
    "codegen.kn",         # Path A (textual LLVM IR) + Path B stubs, LlvmGenerator

    # ── Orchestration + Compiler driver (depends on: build.kn, codegen, markscript) ──
    "orchestrator.kn",    # Markscript VM embedding, 9 IVT handlers, CLI entry points
    "compiler.kn",        # DriverSession pipeline: Resolve→Lex→Parse→Typecheck→Mono→Codegen

    # ── CLI + Entry point ──
    "cli.kn",             # CLI argument parsing (12 subcommands), subcommand dispatch
    "main.kn",            # Entry point: parse_args → run_subcommand
]

# ────────────────────────────────────────────────────────────────────
# SELF-HOST BOOTSTRAP — Ouroboros Compilation Pipeline
#
# When `kain selfhost bootstrap --manifest src/KAIN.toml` is invoked:
#  1. All 23 files are combined in source_order → combined .kn
#  2. Combined source is compiled via bootstrap → .ll → .exe
#  3. Produced kainc.exe compiles the same combined source → stage2.ll
#  4. If --verify-ouroboros: stage2.ll is diffed against original .ll
# ────────────────────────────────────────────────────────────────────

[selfhost]
mode = "llvm"

[selfhost.outputs]
combined_source_path = ".selfhost/bootstrap/combined/kainc_bootstrap.kn"
llvm_output_path     = ".selfhost/bootstrap/out/kainc_bootstrap.ll"
native_output_path   = ".selfhost/bootstrap/out/kainc.exe"
json_report_path     = ".selfhost/reports/bootstrap_report.json"
markdown_report_path = ".selfhost/reports/bootstrap_report.md"
ouroboros_llvm_path  = ".selfhost/ouroboros/kainc_bootstrap.stage2.ll"

[selfhost.runtime]
# Path relative to workspace root (blades/kain/)
manifest_path = "../../runtime/native_core_runtime.toml"

# ────────────────────────────────────────────────────────────────────
# FFI — Foreign Function Interface
# ────────────────────────────────────────────────────────────────────

[ffi]
shared_libraries = []
link_libs = ["kain_runtime"]

[c_ffi]
enabled = false
