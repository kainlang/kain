[pack]
id = "codebase"
title = "Codebase Commands"
owner = "crates/codebase"
about = "Codebase inspection and execution helpers."

[[commands]]
id = "codebase.inspect"
bins = ["kain", "kn"]
path = ["codebase", "inspect"]
about = "Inspect codebase metadata"
handler = "builtin:codebase-inspect"
tags = ["codebase", "diagnostics"]

[[commands]]
id = "codebase.run"
bins = ["kain", "kn"]
path = ["codebase", "run"]
about = "Run a codebase-aware action"
handler = "builtin:codebase-run"
tags = ["codebase", "execute"]
